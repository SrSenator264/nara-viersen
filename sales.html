total:{de:'Gesamt: {v}',ar:'الإجمالي: {v}',en:'Total: {v}'},fail:{de:'Verkäufe konnten nicht geladen werden. Läuft der Server?',ar:'ما قدرنا نحمّل المبيعات. تأكد إنو السيرفر شغّال.',en:'Could not load sales. Make sure the server is running.'},
printBtn:{de:'Beleg drucken',ar:'طباعة الفاتورة',en:'Print receipt'},printing:{de:'Druckt …',ar:'عم يطبع …',en:'Printing …'},printed:{de:'✓ Gedruckt',ar:'✓ انطبع',en:'✓ Printed'},

corrGo:{de:'Storno bestätigen + neue Bestellung',ar:'تأكيد الـStorno وفتح طلب جديد',en:'Confirm Storno + new order'},corrCancel:{de:'Abbrechen',ar:'إلغاء',en:'Cancel'},

corrClosed:{de:'Tag {d} ist abgeschlossen (Tagesabschluss) – Korrektur nicht möglich.',ar:'يوم {d} مقفول (تقفيلة) — ما بينفع تصحيح.',en:'Day {d} is already closed – correction not possible.'},
corrOf:{de:'Korrektur zu {c}',ar:'تصحيح للفاتورة {c}',en:'Correction of {c}'},corrBy:{de:'Korrektur: {c}',ar:'التصحيح: {c}',en:'Correction: {c}'},stReason:{de:'Grund: {r}',ar:'السبب: {r}',en:'Reason: {r}'},
openKasse:{de:'In der Kasse öffnen',ar:'افتحه بالكاشير',en:'Open in till'},openSale:{de:'Verkauf ansehen',ar:'شوف العملية',en:'View sale'}
};
const state={rows:[],data:null,user:null},esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),money=c=>`${(Number(c||0)/100).toFixed(2)} €`,dateText=x=>x?new Date(x).toLocaleString(FT.locale(),{dateStyle:'short',timeStyle:'short'}):'—',nameOf=x=>x?.customerName||x?.customer?.name||x?.delivery?.customerName||x?.receipt?.customerName||'\u0001cust',itemsOf=x=>x?.cart||x?.items||x?.lineItems||x?.receipt?.items||[];
const lineCents=i=>i.totalCents??i.priceCents??((Number(i.unitCents)||0)*(Number(i.quantity??i.qty??1)||0));
function buildRows(d){const orders=Array.isArray(d.orders)?d.orders:[],payments=Array.isArray(d.payments)?d.payments:[],invoices=Array.isArray(d.invoices)?d.invoices:[],rows=[],used=new Set();orders.filter(o=>['COMPLETED','STORNIERT'].includes(String(o.status||'').toUpperCase())).forEach(o=>{const p=payments.find(x=>x.orderId===o.id&&x.status!=='STORNO'),v=String(o.status).toUpperCase()==='STORNIERT';used.add(o.id);rows.push({key:`order:${o.id}`,at:o.completedAt||o.updatedAt||o.createdAt,id:o.displayCode||o.id||p?.id,customer:nameOf(o),source:o.source||'\u0001src',status:v?(o.correctedBy?'\u0001corr':'\u0001storno'):'\u0001done',voided:v,cents:Number(o.totalCents??p?.amountCents??0),order:o,payment:p})});payments.filter(p=>!p.orderId||!used.has(p.orderId)).filter(p=>Number(p.amountCents||0)>0).forEach(p=>rows.push({key:`payment:${p.id}`,at:p.createdAt,id:p.id,customer:nameOf(p),source:'\u0001src',status:p.status||'\u0001done',cents:Number(p.amountCents||0),payment:p}));invoices.filter(i=>i.source==='MANAGER_DEMO'&&i.status!=='DRAFT').forEach(i=>rows.push({key:`invoice:${i.invoiceNumber}`,at:i.updatedAt||i.createdAt,id:i.invoiceNumber,customer:i.customerName||'Flamo Manager',source:'Flamo Manager',status:i.status,cents:Number(i.totalCents||0),invoice:i}));return rows.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))}
const rs=v=>v==='\u0001cust'?FT.t('custCashier'):v==='\u0001src'?FT.t('srcCashier'):v==='\u0001done'?FT.t('stDone'):v==='\u0001corr'?FT.t('stCorrected'):v==='\u0001storno'?FT.t('stStorno'):v;
function filtered(){const q=document.querySelector('#query').value.trim().toLowerCase(),from=document.querySelector('#from').value,to=document.querySelector('#to').value;return state.rows.filter(r=>{const hay=[r.at,r.id,rs(r.customer),rs(r.source),rs(r.status),(r.cents/100).toFixed(2),String(r.cents)].join(' ').toLowerCase(),day=r.at?(window.NARA_DAY?NARA_DAY.dayOf(r.at):new Date(r.at).toISOString().slice(0,10)):'';return(!q||hay.includes(q))&&(!from||day>=from)&&(!to||day<=to)})}
function render(){const rows=filtered();document.querySelector('#shown').textContent=rows.length;document.querySelector('#sales-list').innerHTML=rows.length?rows.map(r=>`<tr class="sale-row" data-i="${state.rows.indexOf(r)}"><td>${esc(dateText(r.at))}</td><td>${esc(r.id)}${r.order&&r.order.deliveryProof?' 📷':''}</td><td>${esc(rs(r.customer))}</td><td>${esc(rs(r.source))}</td><td>${esc(rs(r.status))}</td><td>${money(r.cents)}</td><td class="open">${esc(FT.t('openDetail'))}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">${esc(FT.t('none'))}</td></tr>`;document.querySelectorAll('.sale-row').forEach(el=>el.onclick=()=>openDetail(state.rows[Number(el.dataset.i)]))}
function proofBlock(r){const p=r.order&&r.order.deliveryProof;if(!p||!p.file)return'';const id=encodeURIComponent(r.order.id);return`<h3>📷 ${esc(FT.t('proofTitle'))}</h3><p class="muted">${esc(FT.t('proofBy',{n:p.by||'',t:dateText(p.at)}))}</p><img src="/api/delivery/proof?orderId=${id}" alt="" style="max-width:100%;border-radius:12px" onerror="this.outerHTML='<p class=&quot;muted&quot;>${esc(FT.t('proofGone'))}</p>'">`}
function openDetail(r){const x=r.order||r.invoice||r.payment||{},items=itemsOf(x);document.querySelector('#detail-title').textContent=FT.t('detailOf',{id:r.id});document.querySelector('#detail-sub').textContent=`${dateText(r.at)} · ${rs(r.status)}`;document.querySelector('#detail-content').innerHTML=`<div class="detail-grid"><div class="detail"><b>${esc(FT.t('cCust'))}</b><br>${esc(rs(r.customer))}</div><div class="detail"><b>${esc(FT.t('cSrc'))}</b><br>${esc(rs(r.source))}</div><div class="detail"><b>${esc(FT.t('dNo'))}</b><br>${esc(r.id)}</div><div class="detail"><b>${esc(FT.t('cStatus'))}</b><br>${esc(rs(r.status))}</div></div><h3>${esc(FT.t('items'))}</h3>${items.length?`<table class="items">${items.map(i=>`<tr><td>${esc(i.name||i.title||i.productName||FT.t('item'))}</td><td>${esc(i.quantity??i.qty??1)} ×</td><td>${money(lineCents(i))}</td></tr>`).join('')}</table>`:`<p class="muted">${esc(FT.t('noItems'))}</p>`}<div class="total">${esc(FT.t('total',{v:money(r.cents)}))}</div>${r.order?`<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="print-sale" type="button">🖨️ ${esc(FT.t('printBtn'))}</button><span id="print-msg" class="muted"></span></div>`:''}${proofBlock(r)}${corrBlock(r)}`;wirePrint(r);wireCorrection(r);const dlg=document.querySelector('#sale-dialog');if(!dlg.open)dlg.showModal()}
// ── Storno + Korrektur ── Logik/Prüfungen liegen auf dem Server (order-correction.js); hier nur Anzeige + Aufruf.
const isPlatformOrder=o=>/LIEFERANDO|UBER|WOLT|LANCH|LOCO|SMASHED|SIDES|^WEB/i.test(String(o.platform||o.source||o.channel||''))||!!o.externalOrderCode;
const isTrainingOrder=o=>o.training===true||o.isTest===true;
const canCorrect=()=>!!state.user&&['OWNER','MANAGER'].includes(state.user.role);
function closedDayOf(o){const at=o.completedAt||o.createdAt||'',day=window.NARA_DAY?NARA_DAY.dayOf(at):String(at).slice(0,10);return((state.data&&state.data.dayClosings)||[]).some(s=>s&&s.mode!=='TRAINING'&&s.day===day)?day:''}
function corrBlock(r){const o=r.order;if(!o)return'';const st=String(o.status||'').toUpperCase();let h='';
if(o.correctionOf)h+=`<div class="detail" style="margin-bottom:8px">↪️ ${esc(FT.t('corrOf',{c:o.correctionOfCode||o.correctionOf}))}</div>`;
if(st==='STORNIERT'){h+=`<div class="detail" style="margin-bottom:8px">↩️ ${esc(FT.t('stStorno'))}${o.stornoReason?' · '+esc(FT.t('stReason',{r:o.stornoReason})):''}</div>`;
 if(o.correctedBy){const t=state.rows.find(x=>x.order&&x.order.id===o.correctedBy);h+=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>${esc(FT.t('corrBy',{c:o.correctedByCode||o.correctedBy}))}</span>${t?`<button class="btn" id="corr-view" type="button" data-id="${esc(o.correctedBy)}">${esc(FT.t('openSale'))}</button>`:`<a class="btn" href="kasse.html?open=${encodeURIComponent(o.correctedBy)}">${esc(FT.t('openKasse'))}</a>`}</div>`}}
else if(st==='COMPLETED'&&!isPlatformOrder(o)){
 if(isTrainingOrder(o))h+=`<button class="btn" id="corr-open" type="button" data-training="1">${esc(FT.t('trainBtn'))}</button><span id="corr-msg" class="muted"></span>`;
 else if(canCorrect()){const cd=closedDayOf(o);
  if(cd)h+=`<p class="error">⚠ ${esc(FT.t('corrClosed',{d:cd}))}</p>`;
  else h+=`<button class="btn" id="corr-open" type="button">${esc(FT.t('corrBtn'))}</button><div id="corr-form" hidden style="margin-top:10px;display:none"><p class="muted">${esc(FT.t('corrHelp'))}</p><label for="corr-reason"><b>${esc(FT.t('corrWhy'))}</b></label><br><input id="corr-reason" type="text" maxlength="200" autocomplete="off" style="width:100%;max-width:520px;padding:10px;margin:6px 0"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="corr-go" type="button">${esc(FT.t('corrGo'))}</button><button class="btn" id="corr-cancel" type="button">${esc(FT.t('corrCancel'))}</button></div></div><div id="corr-msg" class="muted" style="margin-top:8px"></div>`}}
return h?`<div id="corr-box" style="margin-top:16px;padding-top:14px;border-top:1px solid #e3e7ed">${h}</div>`:''}
function wireCorrection(r){const o=r.order;if(!o)return;const $=s=>document.querySelector(s),open=$('#corr-open'),form=$('#corr-form'),go=$('#corr-go'),msg=$('#corr-msg'),view=$('#corr-view');
if(view)view.onclick=()=>{const t=state.rows.find(x=>x.order&&x.order.id===view.dataset.id);if(t)openDetail(t)};
if(!open)return;
const run=async reason=>{open.disabled=true;if(go)go.disabled=true;msg.className='muted';msg.textContent=FT.t('corrBusy');
 try{const res=await fetch('/api/kasse/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'CORRECT_ORDER',order:{id:o.id},reason})});const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error||('HTTP '+res.status));
  const id=(j.correction&&j.correction.newOrderId)||'';location.href='kasse.html'+(id?'?open='+encodeURIComponent(id):'')}
 catch(e){msg.className='error';msg.textContent='⚠ '+e.message;open.disabled=false;if(go)go.disabled=false}};
if(open.dataset.training){open.onclick=()=>run('');return}
open.onclick=()=>{form.hidden=false;form.style.display='block';open.style.display='none';$('#corr-reason').focus()};
$('#corr-cancel').onclick=()=>{form.hidden=true;form.style.display='none';open.style.display='';msg.textContent=''};
go.onclick=()=>{const reason=$('#corr-reason').value.trim();if(reason.length<3){msg.className='error';msg.textContent=FT.t('corrNeed');return}run(reason)}}

// Reprint a paid order: the server prints it on the till printer per the 🖨️ settings; the button locks for 2 s so a double click cannot print twice.
function wirePrint(r){const btn=document.querySelector('#print-sale'),msg=document.querySelector('#print-msg');if(!btn||!r.order)return;btn.onclick=async()=>{if(btn.disabled)return;btn.disabled=true;msg.className='muted';msg.textContent=FT.t('printing');try{const res=await fetch('/api/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:r.order.id,kind:'customer'})});const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(j.error||('HTTP '+res.status));if(j.mode==='browser'){msg.className='error';msg.textContent=FT.t('printBrowser')}else{msg.className='muted';msg.textContent=FT.t('printed')}}catch(e){msg.className='error';msg.textContent='⚠ '+FT.t('printFail')+': '+e.message}setTimeout(()=>{btn.disabled=false},2000)}}
async function load(){document.querySelector('#sales-list').innerHTML=`<tr><td colspan="7" class="empty">${esc(FT.t('loading'))}</td></tr>`;try{const res=await fetch('/api/admin-data',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);state.data=await res.json();try{const me=await fetch('/api/auth/me',{cache:'no-store'});state.user=me.ok?(await me.json()).user||null:null}catch(e){state.user=null}state.rows=buildRows(state.data);const live=state.rows.filter(r=>!r.voided);document.querySelector('#count').textContent=live.length;document.querySelector('#total').textContent=money(live.reduce((s,r)=>s+r.cents,0));render()}catch(e){document.querySelector('#sales-list').innerHTML=`<tr><td colspan="7" class="empty error">${esc(FT.t('fail'))}</td></tr>`}}
['query','from','to'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));document.querySelector('#clear').onclick=()=>{['query','from','to'].forEach(id=>document.querySelector('#'+id).value='');render()};document.querySelector('#refresh').onclick=load;document.querySelector('#close-detail').onclick=()=>document.querySelector('#sale-dialog').close();document.querySelector('#sale-dialog').addEventListener('click',e=>{if(e.target.id==='sale-dialog')e.target.close()});FT.init(T,{onChange(){if(state.data)render();const d=document.querySelector('#sale-dialog');if(d.open)d.close()}});
load();
