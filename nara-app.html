<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flamo</title>
<link rel="manifest" href="/nara.webmanifest">
<meta name="theme-color" content="#e34824">
<link rel="icon" href="/brand/flamo-icon.svg">
<link rel="apple-touch-icon" href="/icons/flamo-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flamo">
<script src="/nara-lang.js?v=20261009b" data-section="app"></script>
<style>
:root{--ink:#1d2327;--mute:#6b7378;--brand:#e34824}
*{box-sizing:border-box}html,body{margin:0;background:#f4f2ef;color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
main{max-width:620px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font:900 26px/1 Arial}
.flogo{height:46px;width:auto}.top h1{margin:0;font-size:1.4rem}.top small{display:block;color:var(--mute)}.sp{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.tile{display:flex;flex-direction:column;gap:4px;min-height:112px;padding:16px;border-radius:18px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 2px 10px #0000000f;border:1px solid #ece8e2}
a.tile i{font-style:normal;font-size:30px}a.tile b{font-size:1.1rem}a.tile span{color:var(--mute);font-size:.85rem}
a.tile[hidden]{display:none}
#langsw{display:inline-flex}
</style>
</head>
<body>
<main>
  <div class="top"><img class="flogo" src="/brand/flamo-logo.svg" alt="Flamo"><div><small id="who"></small></div><span class="sp"></span><span id="langsw"></span></div>
  <div class="grid" id="grid"></div>
</main>
<script>
(function(){
  const T={
    de:{web:['Flamo','Kundenseite'],kasse:['Kasse','Bestellen & bezahlen'],live:['Live Orders','Plattformen & Tagesbericht'],kitchen:['Küche','Küchenbildschirm'],dispatch:['Fahrer-Plan','Touren & Karte'],driver:['Fahrer-App','Meine Touren'],close:['Tagesabschluss','Kasse & Abrechnung'],admin:['Verwaltung','Menü, Team, Einstellungen'],staff:['Mitarbeiter','Schichten & Löhne'],customers:['Kunden','Stammkunden & Bestellungen']},
    ar:{web:['فلامو','موقع الزبون'],kasse:['الكاشير','أخد الطلبات والدفع'],live:['الطلبات الحية','المنصات وتقرير اليوم'],kitchen:['المطبخ','شاشة المطبخ'],dispatch:['السواقين','الجولات والخريطة'],driver:['تطبيق السواق','جولاتي'],close:['تقفيلة اليوم','الكاش والحساب'],admin:['الإدارة','المنيو، الفريق، الإعدادات'],staff:['الموظفين','الورديات والأجور'],customers:['الزباين','الزباين الدايمين وطلباتهن']},
    en:{web:['Flamo','Customer site'],kasse:['Till','Orders & payment'],live:['Live Orders','Platforms & daily report'],kitchen:['Kitchen','Kitchen screen'],dispatch:['Dispatch','Tours & map'],driver:['Driver app','My tours'],close:['Daily closing','Cash & settlement'],admin:['Admin','Menu, team, settings'],staff:['Staff','Shifts & wages'],customers:['Customers','Regulars & orders']}};
  const L=window.NARA_LANG?NARA_LANG.get():'de',t=T[L]||T.de;
  const M=['OWNER','MANAGER'],C=M.concat('CASHIER'),K=C.concat('KITCHEN'),S=K.concat('DRIVER'),A=M.concat('ACCOUNTANT');
  const items=[['kasse','🧾','/kasse.html',C],['live','📋','/live-orders.html',K],['kitchen','👨‍🍳','/kitchen.html',K],['dispatch','🛵','/dispatch.html',C],['driver','📍','/driver.html',S],['close','📊','/kasse-settlement.html',A],['web','🔥','/web-prototype/c.html',M],['staff','👥','/staff.html',M],['customers','🧑‍🤝‍🧑','/customers.html',K],['admin','⚙️','/admin.html',M]];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function draw(){
    const u=window.NARA_AUTH&&NARA_AUTH.user&&NARA_AUTH.user(),role=u&&u.role;
    document.getElementById('who').textContent=u?u.name:'';
    document.getElementById('grid').innerHTML=items.map(([k,ic,href,roles])=>'<a class="tile" href="'+href+'"'+(role&&(!roles.includes(role)||(k==='customers'&&!(u&&u.customers)))?' hidden':'')+'><i>'+ic+'</i><b>'+esc(t[k][0])+'</b><span>'+esc(t[k][1])+'</span></a>').join('');
  }
  if(window.NARA_LANG)NARA_LANG.mountSwitcher(document.getElementById('langsw'));
  draw();let n=0;const iv=setInterval(()=>{draw();if(++n>20||(window.NARA_AUTH&&NARA_AUTH.user&&NARA_AUTH.user()))clearInterval(iv)},500);
  // Service Worker (للتثبيت كتطبيق). بيشتغل بس على https أو localhost.
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
</html>
