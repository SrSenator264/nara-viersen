<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>NARA · Fahrer</title>
<script src="nara-lang.js?v=20261009b" data-section="driver"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202a;--muted:#6b7580;--line:#e2e6ea;--blue:#2563eb;--ok:#16a34a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:#101820;color:#fff}
header h1{margin:0;font-size:18px;flex:1}
.gps{font-size:13px;border-radius:999px;padding:4px 10px;background:#ffffff1a}
.gps.on{background:#14532d}.gps.off{background:#7f1d1d}
main{padding:12px 12px 90px}
.empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:17px}
.route{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.rh{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.rh b{font-size:18px}.rh span{color:var(--muted);font-size:14px}
.big{display:block;width:calc(100% - 28px);margin:12px 14px;min-height:58px;border:0;border-radius:12px;font-size:19px;font-weight:900;color:#fff;background:var(--blue);cursor:pointer;text-align:center;text-decoration:none;line-height:58px}
.big.ok{background:var(--ok)}.big.sec{background:#e9edf1;color:var(--ink)}
.stop{padding:12px 14px;border-top:1px solid var(--line)}
.stop.done{opacity:.5}
.top{display:flex;align-items:center;gap:8px}
.num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.done .num{background:var(--ok)}
.code{font-size:20px;font-weight:900;direction:ltr}
.src{font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;background:#eef1f4}
.src.LIEFERANDO{background:#ff8000;color:#fff}.src.UBER_EATS{background:#06c167;color:#fff}
.eta{margin-inline-start:auto;font-weight:800;color:var(--muted)}
.name{font-size:17px;font-weight:800;margin-top:6px}
.addr{font-size:16px;margin-top:2px}
.addr a,.tel{color:var(--blue);text-decoration:none;font-weight:700}
.note{margin-top:6px;padding:6px 9px;background:#fff7d6;border:1px solid #f3d36b;border-radius:8px;font-weight:700}
.pay{margin-top:6px;font-weight:800}
.pay.cash{color:#b45309}.pay.paid{color:var(--ok)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button,.acts a{flex:1;min-height:52px;border:0;border-radius:11px;font-size:17px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.deliver{background:var(--ok);color:#fff}.nav{background:#e9edf1;color:var(--ink)}
.photo{display:block;width:100%;margin-top:8px;min-height:50px;border:2px dashed #94a3b8;border-radius:11px;background:#fff;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer}
.proofok{margin-top:6px;color:var(--ok);font-weight:800}
.doorb{display:block;width:100%;margin-top:8px;min-height:54px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.door{position:fixed;inset:0;z-index:20;background:#fff;color:#16202a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.door.ok{background:#16a34a;color:#fff}.door .q{width:min(76vw,52vh,360px);aspect-ratio:1}.door .q svg{width:100%;height:100%;border:1px solid #e2e6ea;border-radius:12px}
.door .amt{font-size:36px}.door .cd{font-size:22px;font-weight:900;direction:ltr}.door .st{font-weight:800;color:#6b7580}.door .big{width:min(360px,100%);margin:4px 0 0}
#msg{position:fixed;bottom:16px;left:16px;right:16px;background:#101820;color:#fff;padding:12px 14px;border-radius:12px;display:none;text-align:center;z-index:9}
</style>
</head>
<body>
<header><h1 id="title">🛵</h1><span id="langsw"></span><span class="gps" id="gps">📍 …</span></header>
<main id="main"><div class="empty">…</div></main>
<div id="msg"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script>
(function(){
  const T={"de": {"noGeo": "📍 Handy kann keinen Standort", "needHttps": "📍 Standort braucht https", "gpsOn": "📍 Standort aktiv", "welcome": "Willkommen zurück ✅", "allowGps": "📍 Standort im Browser erlauben", "noSignal": "📍 Kein Signal", "none": "Gerade keine Aufträge für dich 👌", "auto": "Die Seite aktualisiert sich selbst", "round": "Tour", "leftOf": " offen von ", "start": "▶️ Tour starten", "back": "🏠 Zurück im Laden", "route": "🗺️ Route in Google Maps", "floor": "Etage", "cash": "💶 Bar · Betrag steht auf dem Beleg", "paid": "✓ Bezahlt – kein Geld nehmen", "navi": "🧭 Navi", "delivered": "✅ Zugestellt", "photo": "📷 Niemand da? Bestellung an der Tür fotografieren", "proofSaved": "📷 Foto-Nachweis gespeichert", "login": "Bitte anmelden", "offline": "Keine Verbindung zum Server", "imgFail": "Foto konnte nicht geöffnet werden", "sending": "📤 Foto wird gesendet…", "proofDone": "📷 Nachweis gespeichert, Auftrag zugestellt ✅", "done": "Erledigt ✅", "title": "🛵 Meine Aufträge", "doc": "NARA · Fahrer", "door": "💳 Angekommen · per Überweisung zahlen", "doorScan": "Kunde scannt den Code und überweist", "doorWait": "Warte auf Zahlung …", "doorPaid": "Bezahlt", "doorCash": "💶 Stattdessen Bar kassieren", "doorClose": "Schließen", "doorOff": "Überweisung nicht verfügbar"}, "ar": {"noGeo": "📍 الجوال ما بيدعم الموقع", "needHttps": "📍 الموقع بيحتاج رابط https", "gpsOn": "📍 الموقع شغّال", "welcome": "أهلاً بالرجعة ✅", "allowGps": "📍 اسمح للموقع من إعدادات المتصفح", "noSignal": "📍 ما في إشارة", "none": "ما في طلبات إلك هلق 👌", "auto": "الصفحة بتتحدث لحالها", "round": "جولة", "leftOf": " باقي من ", "start": "▶️ بلّش الجولة", "back": "🏠 رجعت للمحل", "route": "🗺️ افتح الطريق بـ Google Maps", "floor": "طابق", "cash": "💶 كاش · المبلغ مكتوب على الفاتورة", "paid": "✓ مدفوع، لا تاخد مصاري", "navi": "🧭 الطريق", "delivered": "✅ سلّمت الطلب", "photo": "📷 ما حدا فتح؟ صوّر الطلب عند الباب", "proofSaved": "📷 انحفظت صورة الإثبات", "login": "سجّل دخول", "offline": "ما في اتصال بالسيرفر", "imgFail": "الصورة ما انفتحت", "sending": "📤 عم تنبعت الصورة…", "proofDone": "📷 انحفظ الإثبات وانسلّم الطلب ✅", "done": "تمام ✅", "title": "🛵 طلباتي", "doc": "NARA · السواق", "door": "💳 وصلت · الدفع بالحوالة", "doorScan": "الزبون بيمسح الكود وبيحوّل", "doorWait": "عم نستنى الدفع …", "doorPaid": "اندفع", "doorCash": "💶 كاش بدل الحوالة", "doorClose": "سكّر", "doorOff": "الحوالة غير متوفرة"}, "en": {"noGeo": "📍 Phone has no location", "needHttps": "📍 Location needs https", "gpsOn": "📍 Location on", "welcome": "Welcome back ✅", "allowGps": "📍 Allow location in browser settings", "noSignal": "📍 No signal", "none": "No orders for you right now 👌", "auto": "This page updates by itself", "round": "Round", "leftOf": " left of ", "start": "▶️ Start round", "back": "🏠 Back at the shop", "route": "🗺️ Open route in Google Maps", "floor": "Floor", "cash": "💶 Cash · amount is on the receipt", "paid": "✓ Paid – take no money", "navi": "🧭 Navigate", "delivered": "✅ Delivered", "photo": "📷 Nobody home? Photo the order at the door", "proofSaved": "📷 Photo proof saved", "login": "Please log in", "offline": "No connection to the server", "imgFail": "Photo could not be opened", "sending": "📤 Sending photo…", "proofDone": "📷 Proof saved, order delivered ✅", "done": "Done ✅", "title": "🛵 My orders", "doc": "NARA · Driver", "door": "💳 Arrived · pay by transfer", "doorScan": "Customer scans the code and transfers", "doorWait": "Waiting for payment …", "doorPaid": "Paid", "doorCash": "💶 Collect cash instead", "doorClose": "Close", "doorOff": "Transfer not available"}};
  const NL=window.NARA_LANG;const L=NL?NL.get():'de';const t=k=>(T[L]||T.de)[k]||T.de[k]||k;
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hm=v=>{const d=new Date(v);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  const $=s=>document.querySelector(s);
  let doorOk=false,doorT=null,routes=[],last=null,lastSent=0,wake=null,busy=false;
  function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',3000)}
  async function api(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}

  // الموقع: بيتبعت كل 15 ثانية طول ما الصفحة مفتوحة (بس وقت الشغل)
  function gps(state,text){const g=$('#gps');g.className='gps '+state;g.textContent=text}
  function startGps(){
    if(!('geolocation' in navigator)){gps('off',t('noGeo'));return}
    if(!window.isSecureContext){gps('off',t('needHttps'));return}
    navigator.geolocation.watchPosition(p=>{
      last={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};gps('on',t('gpsOn'));
      if(Date.now()-lastSent>15000){lastSent=Date.now();api('POST','/api/driver/position',last).then(j=>{if(j.finished){toast(t('welcome'));load()}}).catch(()=>{})}
    },e=>gps('off',e.code===1?t('allowGps'):t('noSignal')),{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
  }
  async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&routes.some(r=>r.startedAt))keepAwake()});

  function render(){
    const m=$('#main');
    if(!routes.length){m.innerHTML='<div class="empty">'+t('none')+'<br><small>'+t('auto')+'</small></div>';return}
    m.innerHTML=routes.map(r=>{
      const left=r.stops.filter(s=>!s.delivered);
      const head='<div class="rh"><b>'+t('round')+' '+esc(r.roundId)+'</b><span>'+left.length+t('leftOf')+r.stops.length+'</span></div>';
      const action=!r.startedAt?'<button class="big" data-start="'+esc(r.routeId)+'">'+t('start')+'</button>'
        :r.allDelivered?'<button class="big sec" data-finish="'+esc(r.routeId)+'">'+t('back')+'</button>'
        :(r.googleMapsUrl?'<a class="big sec" target="_blank" rel="noopener" href="'+esc(r.googleMapsUrl)+'">'+t('route')+'</a>':'');
      const stops=r.stops.map((s,i)=>{
        const addr=[s.address,s.city].filter(Boolean).join(', ');
        const nav=Number.isFinite(s.lat)?'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=driving':'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
        return '<div class="stop'+(s.delivered?' done':'')+'"><div class="top"><span class="num">'+(s.delivered?'✓':i+1)+'</span><span class="code">'+esc(s.code)+'</span>'+(s.source!=='NARA'?'<span class="src '+esc(s.source)+'">'+esc(String(s.source).replace('_',' '))+'</span>':'')+'<span class="eta">'+(s.etaAt&&!s.delivered?'~'+hm(s.etaAt):'')+'</span></div>'
          +(s.name?'<div class="name"><bdi>'+esc(s.name)+'</bdi></div>':'')
          +'<div class="addr"><a href="'+esc(nav)+'" target="_blank" rel="noopener"><bdi dir="ltr">'+esc(addr||'—')+'</bdi></a>'+(s.floor?' · '+t('floor')+' <bdi>'+esc(s.floor)+'</bdi>':'')+'</div>'
          +(s.phone?'<div><a class="tel" href="tel:'+esc(String(s.phone).replace(/\s/g,''))+'">☎ <bdi dir="ltr">'+esc(s.phone)+'</bdi></a></div>':'')
          +(s.notes?'<div class="note"><bdi>'+esc(s.notes)+'</bdi></div>':'')
          +'<div class="pay '+(s.cash?'cash':'paid')+'">'+(s.cash?t('cash'):t('paid'))+'</div>'
          +(s.cash&&doorOk&&!s.delivered&&r.startedAt?'<button class="doorb" data-door="'+esc(s.orderId)+'">'+t('door')+'</button>':'')
          +(!s.delivered&&r.startedAt?'<div class="acts"><a class="nav" href="'+esc(nav)+'" target="_blank" rel="noopener">'+t('navi')+'</a><button class="deliver" data-deliver="'+esc(s.orderId)+'">'+t('delivered')+'</button></div>'
            +(s.canProof?'<button class="photo" data-proof="'+esc(s.orderId)+'">'+t('photo')+'</button>':''):'')
          +(s.proof?'<div class="proofok">'+t('proofSaved')+'</div>':'')+'</div>';
      }).join('');
      return '<section class="route">'+head+action+stops+'</section>';
    }).join('');
  }
  async function load(){
    if(busy)return;busy=true;
    try{const j=await api('GET','/api/driver/routes');const before=routes.length;routes=j.routes||[];doorOk=!!j.doorOk;if(routes.length>before&&before===0&&navigator.vibrate)navigator.vibrate([200,100,200]);render()}
    catch(e){$('#main').innerHTML='<div class="empty">'+esc(e.message==='401'?t('login'):t('offline'))+'</div>'}
    finally{busy=false}
  }
  // صورة الإثبات: بتتصغّر على الجوال (أقصى 1280px) قبل ما تنبعت
  let proofFor=null;
  function shrink(file){return new Promise((ok,bad)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.72))};img.onerror=()=>bad(Error(t('imgFail')));img.src=url})}
  $('#cam').addEventListener('change',async()=>{
    const f=$('#cam').files&&$('#cam').files[0];$('#cam').value='';if(!f||!proofFor)return;
    toast(t('sending'));
    try{const image=await shrink(f);await api('POST','/api/driver/proof',{orderId:proofFor,image,...(last||{})});toast(t('proofDone'));if(navigator.vibrate)navigator.vibrate(80)}
    catch(err){toast(err.message)}
    proofFor=null;await load();
  });
  function ensureQR(cb){if(window.NARA_QR)return cb();const sc=document.createElement('script');sc.src='/vendor/qrcode.bundle.js?v=20261008';sc.onload=cb;document.head.appendChild(sc)}
  const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
  function closeDoor(){clearInterval(doorT);const d=$('#door');if(d)d.remove();load()}
  async function openDoor(id){
    let j;try{j=await api('POST','/api/driver/door-pay',{orderId:id,action:'start'})}catch(e){toast(e.message==='TRANSFER_OFF'?t('doorOff'):e.message);return}
    const d=document.createElement('div');d.id='door';d.className='door';d.dataset.oid=id;
    d.innerHTML='<div class="q" id="doorQ"></div><b class="amt">'+eur(j.amountCents)+'</b><div class="cd">'+esc(j.code)+'</div><div class="st" id="doorSt">'+esc(t('doorWait'))+'</div><small>'+esc(t('doorScan'))+'</small><button class="big sec" data-dcash>'+t('doorCash')+'</button><button class="big sec" data-dclose>'+t('doorClose')+'</button>';
    document.body.appendChild(d);keepAwake();
    ensureQR(()=>{const q=$('#doorQ');if(q&&window.NARA_QR)q.innerHTML=NARA_QR.svg(location.origin+'/pay.html?d='+j.token,{level:'M',quiet:2})});
    clearInterval(doorT);
    doorT=setInterval(async()=>{try{const s=await api('POST','/api/driver/door-pay',{orderId:id,action:'status'});
      if(s.state==='PAID'){clearInterval(doorT);d.className='door ok';d.innerHTML='<div style="font-size:96px;line-height:1">✅</div><b class="amt">'+esc(t('doorPaid'))+'</b><div class="cd">'+esc(j.code)+' · '+eur(s.amountCents)+'</div>';if(navigator.vibrate)navigator.vibrate([150,80,150]);setTimeout(closeDoor,2500)}}catch(e){}},3000);
  }
  document.addEventListener('click',async e=>{
    if(e.target.closest('[data-dclose]')){closeDoor();return}
    if(e.target.closest('[data-dcash]')){const id=($('#door')||{dataset:{}}).dataset.oid;try{await api('POST','/api/driver/door-pay',{orderId:id,action:'cash'})}catch(err){toast(err.message)}closeDoor()}
  });
  $('#main').addEventListener('click',async e=>{
    const dr=e.target.closest('[data-door]');if(dr){openDoor(dr.dataset.door);return}
    const pf=e.target.closest('[data-proof]');if(pf){proofFor=pf.dataset.proof;$('#cam').click();return}
    const st=e.target.closest('[data-start]'),dl=e.target.closest('[data-deliver]'),fn=e.target.closest('[data-finish]');
    if(!st&&!dl&&!fn)return;const b=st||dl||fn;b.disabled=true;
    try{
      if(st){await api('POST','/api/driver/start',{routeId:st.dataset.start});keepAwake();const r=routes.find(x=>x.routeId===st.dataset.start);if(r&&r.googleMapsUrl)window.open(r.googleMapsUrl,'_blank')}
      if(dl){await api('POST','/api/driver/delivered',{orderId:dl.dataset.deliver,...(last||{})});toast(t('done'));if(navigator.vibrate)navigator.vibrate(80)}
      if(fn){await api('POST','/api/driver/finish',{routeId:fn.dataset.finish});toast(t('welcome'))}
    }catch(err){toast(err.message)}
    await load();
  });
  document.title=t('doc');$('#title').textContent=t('title');if(NL)NL.mountSwitcher($('#langsw'),{buttonStyle:'min-width:30px;height:28px;border-radius:8px;border:1px solid #fff4;background:transparent;color:#fff;font-weight:800;font-size:13px'});
  startGps();load();setInterval(load,10000);
})();
</script>
</body>
</html>
