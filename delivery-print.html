<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flamo · Lieferauftrag</title><style>@page{size:80mm auto;margin:3mm}*{box-sizing:border-box}body{width:72mm;margin:0;font-family:Arial,sans-serif;font-size:12px;color:#111}.center{text-align:center}.line{border-top:1px dashed #111;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.label{font-weight:bold}.qr{width:42mm;height:42mm;display:block;margin:8px auto}.small{font-size:10px}.error{color:#a00}</style></head><body><div id="app" data-t="prep"></div><script src="/nara-lang.js?v=20261018" data-section="delivery-print"></script><script src="/flamo-t.js"></script><script src="vendor/qrcode.bundle.js?v=20261008"></script><script>
FT.init({prep:{de:'Auftrag wird vorbereitet…',ar:'عم جهّز الطلب…',en:'Preparing order…'},title:{de:'Lieferauftrag',ar:'طلب توصيل',en:'Delivery order'},no:{de:'Bestellnr.',ar:'رقم الطلب',en:'Order no.'},time:{de:'Zeit',ar:'الوقت',en:'Time'},name:{de:'Kundenname',ar:'اسم الزبون',en:'Customer name'},addr:{de:'Adresse',ar:'العنوان',en:'Address'},phone:{de:'Telefon',ar:'الهاتف',en:'Phone'},nr:{de:'nicht erfasst',ar:'غير مسجل',en:'not provided'},amount:{de:'Betrag',ar:'المبلغ',en:'Amount'},pay:{de:'Zahlung',ar:'الدفع',en:'Payment'},cash:{de:'Barzahlung bei Lieferung',ar:'كاش عند التسليم',en:'Cash on delivery'},paid:{de:'Vorab bezahlt',ar:'مدفوع مسبقاً',en:'Paid in advance'},confirm:{de:'Bestätigung nötig',ar:'بدها تأكيد',en:'Needs confirmation'},foot:{de:'Interner Betriebscode — keine Quittung für den Kunden',ar:'كود تشغيل داخلي — مو إيصال للزبون',en:'Internal operations code — not a customer receipt'},fail:{de:'Bestellung konnte nicht gelesen werden',ar:'ما قدرنا نقرا الطلب',en:'Could not read the order'}});const t=FT.t;
const id=new URLSearchParams(location.search).get('orderId'),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/delivery/order-print?orderId='+encodeURIComponent(id||'')).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok)throw Error(j.error||t('fail'));const o=j.order,d=o.customer||{},payment=o.paymentStatus==='CASH'?t('cash'):o.paymentStatus==='PAID'?t('paid'):t('confirm');app.innerHTML='<div class="center"><h2>Flamo</h2><div>'+esc(t('title'))+'</div><div class="line"></div></div><div class="row"><span class="label">'+esc(t('no'))+'</span><span>'+esc(o.displayCode)+'</span></div><div class="row"><span class="label">'+esc(t('time'))+'</span><span>'+esc(o.createdAt||'')+'</span></div><div class="line"></div><div class="label">'+esc(t('name'))+'</div><div>'+esc(d.name||t('nr'))+'</div><div class="label">'+esc(t('addr'))+'</div><div>'+esc(d.address||t('nr'))+'</div><div class="label">'+esc(t('phone'))+'</div><div>'+esc(d.phone||t('nr'))+'</div><div class="line"></div><div class="row"><span class="label">'+esc(t('amount'))+'</span><span>'+((Number(o.amountCents||0))/100).toFixed(2)+' €</span></div><div class="row"><span class="label">'+esc(t('pay'))+'</span><span>'+esc(payment)+'</span></div><div class="line"></div><div class="qr">'+window.NARA_QR.svg(location.origin+'/delivery.html?token='+o.deliveryQrToken,{level:'M',quiet:1})+'</div><div class="center small">'+esc(t('foot'))+'</div>';setTimeout(()=>window.print(),400)}).catch(e=>app.innerHTML='<p class="error">'+esc(e.message)+'</p>');</script></body></html>
