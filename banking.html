<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · كشوف البنك</title><link rel="stylesheet" href="nara-shell.css"><style>body{margin:0;background:#f4f6f9;color:#162033;font-family:Arial,sans-serif}.page{max-width:1100px;margin:auto;padding:40px 28px}.card{background:#fff;border:1px solid #e4e9f0;border-radius:16px;padding:24px;margin-bottom:20px}h1{margin:0 0 8px}.muted{color:#68758a}input,button{padding:11px;border:1px solid #d5dce6;border-radius:8px;font:inherit}button{background:#c83b1d;color:#fff;cursor:pointer}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tx{padding:12px 0;border-bottom:1px solid #e4e9f0;display:flex;justify-content:space-between;gap:12px}.unmatched{color:#b26a00}.matched{color:#18834b}</style></head><body><main class="page"><section class="card"><p class="muted">المحاسبة · Bank/Kasse reconciliation</p><h1>كشوف البنك والتسوية</h1><p class="muted">ارفع CSV. الحركات لا تُرحّل محاسبيًا قبل المطابقة والموافقة.</p><div class="row"><input id="file" type="file" accept=".csv,text/csv"><button id="import">استيراد الكشف</button><button id="refresh">تحديث</button></div><p id="status"></p></section><section class="card"><h2>الحركات البنكية</h2><div id="transactions">جارٍ التحميل…</div></section></main><script src="nara-shell.js"></script><script>(async()=>{const $=id=>document.getElementById(id);async function load(){const j=await (await fetch('/api/accounting/bank-transactions?ts='+Date.now())).json();$('transactions').innerHTML=(j.transactions||[]).map(x=>`<div class="tx"><span>${x.date} · ${x.description||'بدون وصف'} · ${(x.amountCents/100).toFixed(2)} €</span><span class="${x.status==='MATCHED'?'matched':'unmatched'}">${x.status==='MATCHED'?'مطابقة':'غير مطابقة'} <button data-id="${x.id}">اعتماد</button></span></div>`).join('')||'لا توجد حركات بنكية بعد';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const ref=prompt('أدخل رقم العملية أو الفاتورة المرتبطة');if(!ref)return;const r=await fetch('/api/accounting/bank-transactions/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transactionId:id,status:'MATCHED',entityType:'MANUAL',entityId:ref})});$('status').textContent=r.ok?'تم اعتماد المطابقة':'تعذر اعتماد المطابقة';load()})}$('import').onclick=async()=>{const f=$('file').files[0];if(!f)return $('status').textContent='اختر ملف CSV أولاً';const r=await fetch('/api/accounting/bank-transactions/csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:await f.text()})});const j=await r.json();$('status').textContent=r.ok?`تم استيراد ${j.addedCount} حركة`:(j.error||'تعذر الاستيراد');load()};$('refresh').onclick=load;load()})()</script></body></html>
