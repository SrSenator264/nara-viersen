ü',ar:'منتجات بالمنيو المشترك',en:'Products in the shared menu'},stock:{de:'Lager',ar:'المخزون',en:'Stock'},ingr:{de:'Zutaten',ar:'مكونات',en:'Ingredients'},inv:{de:'Rechnungen',ar:'الفواتير',en:'Invoices'},invD:{de:'Gespeicherte Rechnungen',ar:'فواتير محفوظة',en:'Saved invoices'},docs:{de:'Dokumente',ar:'المستندات',en:'Documents'},docsD:{de:'Zentrale Originaldokumente',ar:'المستندات الأصلية المركزية',en:'Central original documents'},rev:{de:'Umsatz heute',ar:'مبيعات اليوم',en:'Revenue today'},noData:{de:'Noch keine Daten',ar:'ما في بيانات لسا',en:'No data yet'},fail:{de:'Daten konnten nicht geladen werden.',ar:'ما قدرنا نحمّل البيانات.',en:'Could not load data.'}});Promise.all([fetch('/api/menu').then(r=>r.json()),fetch('/api/admin-data').then(r=>r.json())]).then(([m,a])=>{products.textContent=m.products.length;items.textContent=(a.inventoryItems||[]).length;invoices.textContent=(a.invoices||[]).length;docs.textContent=(a.documents||[]).length}).catch(e=>status.textContent=FT.t('fail'));</script><script src="flamo-home.js?v=20261031a" defer></script></body></html>
