<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zahlung</title>
<style>
:root{--bg:#fff7ec;--ink:#2a1a10;--mut:#7a6656;--line:#ecdcc8;--ok:#16a34a;--acc:#e8541e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Tahoma,Arial,sans-serif;font-size:16px;min-height:100vh;display:flex;justify-content:center;padding:18px 16px 40px}
main{width:100%;max-width:440px}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.amt{font-size:40px;font-weight:900;margin:6px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row span{color:var(--mut);font-size:13px;min-width:92px}
.row b{flex:1;word-break:break-all}
.row button{border:1px solid var(--line);background:#fff7ec;border-radius:9px;padding:7px 11px;font-weight:800;color:var(--ink);cursor:pointer}
.qr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;text-align:center}
.qr svg{width:210px;height:210px}
.hint{color:var(--mut);font-size:14px}
.state{border-radius:16px;padding:22px 16px;text-align:center;margin:12px 0;font-weight:800}
.state.ok{background:var(--ok);color:#fff;font-size:22px}
.state.no{background:#fde8e1}
.big{font-size:70px;line-height:1}
.wait{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}
</style>
</head>
<body>
<main id="m"><p class="sub">…</p></main>
<script>
(function(){
  var q=new URLSearchParams(location.search),tok=q.get('d')||'';
  var nl=(q.get('l')||navigator.language||'de').toLowerCase().slice(0,2),L=['de','ar','en'].indexOf(nl)>=0?nl:'de';
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  var T={
    title:{de:'Bezahlung per Überweisung',en:'Pay by bank transfer',ar:'الدفع بالحوالة البنكية'},
    sub:{de:'Bitte jetzt mit deiner Banking-App überweisen. Der Fahrer sieht die Zahlung sofort.',en:'Please transfer now with your banking app. The driver sees the payment right away.',ar:'حوّل هلأ من تطبيق البنك. السائق بيشوف الدفع فوراً.'},
    amount:{de:'Betrag',en:'Amount',ar:'المبلغ'},payee:{de:'Empfänger',en:'Payee',ar:'المستفيد'},ref:{de:'Verwendungszweck',en:'Reference',ar:'البيان'},
    copy:{de:'Kopieren',en:'Copy',ar:'نسخ'},
    scan:{de:'Oder QR-Code mit der Banking-App scannen (auf einem anderen Gerät).',en:'Or scan the QR code with your banking app (on another device).',ar:'أو امسح رمز QR بتطبيق البنك (من جهاز تاني).'},
    rule:{de:'Verwendungszweck genau so eintragen und den Betrag nicht ändern. Echtzeit-Überweisung geht am schnellsten.',en:'Enter the reference exactly and do not change the amount. Instant transfer is fastest.',ar:'اكتب البيان متل ما هو ولا تغيّر المبلغ. الحوالة الفورية الأسرع.'},
    wait:{de:'Warte auf die Zahlung …',en:'Waiting for the payment …',ar:'عم نستنى الدفع …'},
    paid:{de:'Bezahlt – danke!',en:'Paid – thank you!',ar:'تم الدفع – شكراً!'},
    no:{de:'Dieser Zahlungslink ist nicht mehr aktiv. Bitte beim Fahrer nachfragen.',en:'This payment link is no longer active. Please ask the driver.',ar:'رابط الدفع ما عاد شغّال. اسأل السائق.'},
    off:{de:'Überweisung ist gerade nicht verfügbar.',en:'Bank transfer is currently unavailable.',ar:'الحوالة غير متوفرة هلأ.'}
  };
  var t=function(k){return T[k][L]};
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var eur=function(c){return (c/100).toFixed(2).replace('.',',')+' €'};
  var m=document.getElementById('m'),timer=null,drawn='';
  function copyBtn(v){return '<button type="button" data-copy="'+esc(v)+'">'+esc(t('copy'))+'</button>'}
  function ensureQR(cb){if(window.NARA_QR)return cb();var s=document.createElement('script');s.src='/vendor/qrcode.bundle.js?v=20261008';s.onload=cb;document.head.appendChild(s)}
  function draw(p){
    if(p.state==='PAID'){clearInterval(timer);m.innerHTML='<div class="state ok"><div class="big">✅</div>'+esc(t('paid'))+'<div style="font-size:15px;margin-top:6px;font-weight:600">'+esc(p.code)+' · '+eur(p.amountCents)+'</div></div>';return}
    if(p.state!=='WAITING'){clearInterval(timer);m.innerHTML='<div class="state no">'+esc(t('no'))+'</div>';return}
    if(drawn===p.code)return;drawn=p.code;
    var iban=String(p.iban||'').replace(/(.{4})/g,'$1 ').trim();
    m.innerHTML='<h1>'+esc(t('title'))+'</h1><p class="sub">'+esc(t('sub'))+'</p><div class="amt">'+eur(p.amountCents)+'</div>'
      +'<div class="box"><div class="row"><span>'+esc(t('payee'))+'</span><b>'+esc(p.payee)+'</b></div>'
      +'<div class="row"><span>IBAN</span><b>'+esc(iban)+'</b>'+copyBtn(p.iban)+'</div>'
      +'<div class="row"><span>'+esc(t('ref'))+'</span><b>'+esc(p.reference)+'</b>'+copyBtn(p.reference)+'</div>'
      +'<div class="row"><span>'+esc(t('amount'))+'</span><b>'+eur(p.amountCents)+'</b>'+copyBtn((p.amountCents/100).toFixed(2))+'</div></div>'
      +'<div class="wait"><span class="dot"></span>'+esc(t('wait'))+'</div>'
      +'<div class="qr"><div id="qr"></div><p class="hint">'+esc(t('scan'))+'</p></div><p class="hint">'+esc(t('rule'))+'</p>';
    ensureQR(function(){var e=document.getElementById('qr');if(e&&window.NARA_QR&&p.giro)e.innerHTML=NARA_QR.svg(p.giro,{level:'M',quiet:2})});
  }
  function poll(){
    fetch('/api/pay/door?d='+encodeURIComponent(tok),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})}).then(function(x){
      if(x.s===503){clearInterval(timer);m.innerHTML='<div class="state no">'+esc(t('off'))+'</div>';return}
      if(x.j&&x.j.pay)draw(x.j.pay);else{clearInterval(timer);m.innerHTML='<div class="state no">'+esc(t('no'))+'</div>'}
    }).catch(function(){});
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;var v=b.getAttribute('data-copy'),done=function(){var o=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=o},1200)};try{navigator.clipboard.writeText(v).then(done,done)}catch(x){var ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(y){}ta.remove();done()}});
  if(tok.length<16){m.innerHTML='<div class="state no">'+esc(t('no'))+'</div>'}else{poll();timer=setInterval(poll,4000)}
})();
</script>
</body>
</html>
