<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#1d2327;--mute:#6b7378;--line:#e7e3de;--brand:#ff6d00;--ok:#16884a;--late:#d1342f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 14px;background:#fff;box-shadow:0 1px 0 var(--line),0 4px 10px #0000000d;flex-wrap:wrap}
header h1{margin:0;font-size:1.2rem;color:var(--brand)}
header .sp{flex:1}
.tabs{display:flex;gap:8px;flex:1 1 520px;order:5}
.tabs>*{flex:1 1 0;justify-content:center;min-height:52px}
.cnt,.tab{display:flex;align-items:center;gap:8px;padding:6px 16px;border:2px solid transparent;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}
.cnt b,.tab b{font-size:1.5rem;line-height:1}
.cnt{background:var(--ok);color:#fff}
.cnt.hot{background:var(--brand)}
.cnt.sel,.tab.sel{border-color:var(--ink)}
.tab.sel{background:var(--ink);color:#fff}
.hbtn{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700}
.sync{color:var(--mute);font-size:.85rem}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}
.sync.off b{background:var(--late)}
@keyframes pulse{0%,100%{background:#fff}50%{background:#ffd9b0}}
body.alarm header{animation:pulse 1s infinite;box-shadow:0 3px 0 var(--brand)}
body.alarm #cnt{animation:pulse 1s infinite;color:var(--ink)}
#banner{display:none;margin:14px 20px 0}
#banner button{width:100%;height:64px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:1.2rem}
main{padding:12px 12px 40px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:70px 10px;font-size:1.3rem}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px #0000001a;border-inline-start:10px solid var(--pc,#999);padding:10px 12px 12px;border-top:5px solid var(--st,transparent)}
.card.late{--st:var(--late);background:#fff5f4}
.card.warn{--st:var(--brand)}
.card.PENDING,.card.ACCEPTING{--st:var(--ok)}
.card.FAILED{outline:3px solid var(--late);background:#fff5f4}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:.95rem;background:var(--pc);color:#fff}
.badge.brand{background:#1d2327}
.code{font-size:1.3rem}
.age{margin-inline-start:auto;color:var(--mute);font-size:.9rem}
.meta{margin:4px 0;color:var(--mute);font-size:.88rem}
.items{list-style:none;margin:4px 0;padding:6px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.items li{padding:2px 0;font-weight:800;font-size:1.05rem}
.items .opts{font-weight:400;color:var(--mute);font-size:.85rem;padding-inline-start:1.4em;line-height:1.3}
.sum{margin:4px 0;font-weight:700;font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tog{display:block;width:100%;height:36px;margin:2px 0;border:0;border-radius:10px;background:#f0ede9;color:var(--mute);font-weight:700}
.items .note{font-weight:600;color:#7a5200;font-size:.92rem;padding-inline-start:1.6em}
.contact{margin:6px 0;padding:8px 10px;border-radius:10px;background:#eef3f7;font-size:.95rem;line-height:1.35}
.contact .addr{font-weight:800;font-size:1.1rem}
.contact .row2{color:var(--ink)}
.contact a{color:#0b5cad;font-weight:800;text-decoration:none;font-size:1.05rem}
.contact .code{background:#fff;border-radius:6px;padding:1px 6px;font-weight:800}
.notes{margin:6px 0;padding:8px 10px;border-radius:10px;background:#fff0c2;border:2px solid #f0b400;color:#5c3d00;font-weight:800;font-size:1.02rem}
.time{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.time .lbl{font-weight:700}
.step{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.step button{width:56px;height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800;font-size:1.1rem}
.step b{min-width:74px;text-align:center;font-size:1.3rem}
.qlen{width:100%;color:var(--mute);font-size:.85rem}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring svg{width:70px;height:70px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#e7e3de;stroke-width:6}
.ring .fg{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.ring.warn .fg{stroke:var(--brand)}
.ring.late .fg{stroke:var(--late)}
.ring .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.05}
.ring .tx b{font-size:1.35rem}
.ring .tx small{font-size:.7rem;font-weight:600;color:var(--mute)}
.ring.late .tx b{color:var(--late)}
.head{display:flex;align-items:center;gap:12px}
.head .top{flex:1}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:6px 0 0}
.times.one{grid-template-columns:1fr}
.timerow{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:0}
.timerow .lbl{font-weight:700;font-size:.82rem;color:var(--mute);text-align:center}
.timerow .step{margin:0;justify-content:space-between;gap:3px}
.timerow .step button{width:38px;flex:none;height:46px;padding:0;font-size:1rem}
.timerow .step b{min-width:0;flex:1;font-size:1rem;white-space:nowrap;text-align:center}
.saved{width:100%;color:var(--mute);font-size:.82rem;text-align:end}
.sync2{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#fff1d6;color:#7a5200;font-weight:700;font-size:.9rem}
.card.DONE{opacity:.78}
.go.next{background:var(--brand)}
.go.fin{background:var(--ink)}
.go{width:100%;height:58px;margin-top:8px;border:0;border-radius:16px;background:var(--ok);color:#fff;font-weight:800;font-size:1.25rem}
.go:disabled{background:#9aa5a0}
.go.retry{background:var(--late)}
.err{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#fde8e8;color:#9b1c1c;font-weight:700;font-size:.92rem}
#set{position:fixed;inset:0;z-index:20;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#set .box{width:min(520px,100%);background:#fff;border-radius:18px;padding:20px 22px}
#set h2{margin:0 0 12px}
#set .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
#set .row label{flex:1;font-weight:700}
#set select,#set button.tst{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;padding:0 10px}
#set input[type=range]{flex:1;min-width:120px}
#set .close{margin-top:14px;width:100%;height:50px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:800}
</style>

<script>
(function(){
'use strict';

const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={
  de:{title:'Plattformen',waiting:'warten auf Annahme',none:'Keine Bestellung wartet ✅',accept:'✅ Annehmen',accepting:'Wird angenommen …',retry:'🔁 Nochmal versuchen',failed:'Annahme fehlgeschlagen',
    prep:'Zubereitungszeit',min:'Min',delivery:'🛵 Lieferung',pickup:'🛍 Abholung',cash:'💶 Barzahlung',online:'💳 Online bezahlt',asap:'So schnell wie möglich',at:'um',now:'jetzt',ago:'vor {n} Min',
    queue:'🍳 Küche aktuell: {n}',sounds:'⚙️ Töne',enableSound:'🔊 Tippen, um den Ton zu aktivieren',volume:'Lautstärke',repeat:'Wiederholen alle',off:'aus',test:'Test',close:'Schließen',offline:'Keine Verbindung',live:'Live',
    short:'Kurz',double:'Doppelt',long:'Lang',triple:'Dreifach',rising:'Steigend',falling:'Fallend',bell:'Glocke',siren:'Sirene',mute:'Stumm',web:'Website',sec:'{n} Sek',errGeneric:'Fehler: ',
    tabPrepare:'Zubereitung',tabHandover:'Übergabe',tabDone:'Erledigt',deliveryTime:'Lieferzeit',toHandover:'🚗 Handover',toDone:'✅ Fertig',noneStage:'Keine Bestellungen',saving:'wird gespeichert …',saved:'✓ gespeichert',leftMin:'Min',lateMin:'überfällig',platformFail:'Auf der Plattform nicht übernommen',doneAgo:'erledigt vor {n} Min',details:'▼ Details',hide:'▲ Weniger',itemsN:'{n} Artikel'},
  ar:{title:'تجميع المنصات',waiting:'بانتظار الموافقة',none:'ما في طلبات بانتظار الموافقة ✅',accept:'✅ استلام',accepting:'عم ينقبل …',retry:'🔁 جرّب مرة ثانية',failed:'فشل الاستلام',
    prep:'وقت التحضير',min:'د',delivery:'🛵 توصيل',pickup:'🛍 استلام من المحل',cash:'💶 دفع كاش',online:'💳 مدفوع أونلاين',asap:'بأسرع وقت',at:'الساعة',now:'هلق',ago:'قبل {n} د',
    queue:'🍳 بالمطبخ هلق: {n}',sounds:'⚙️ الأصوات',enableSound:'🔊 اضغط لتفعيل الصوت',volume:'مستوى الصوت',repeat:'كرّر كل',off:'بلا',test:'جرّب',close:'سكّر',offline:'ما في اتصال',live:'Live',
    short:'قصير',double:'مرتين',long:'طويل',triple:'ثلاث مرات',rising:'صاعد',falling:'نازل',bell:'جرس',siren:'صفّارة',mute:'بلا صوت',web:'الموقع',sec:'{n} ث',errGeneric:'غلط: ',
    tabPrepare:'قيد التحضير',tabHandover:'تسليم',tabDone:'خلصت',deliveryTime:'وقت التوصيل',toHandover:'🚗 جاهز للتسليم',toDone:'✅ تم التسليم',noneStage:'ما في طلبات',saving:'عم ينحفظ …',saved:'✓ انحفظ',leftMin:'د',lateMin:'متأخر',platformFail:'ما انتقل عند المنصة',doneAgo:'خلص قبل {n} د',details:'▼ التفاصيل',hide:'▲ أقل',itemsN:'{n} أصناف'},
  en:{title:'Platform hub',waiting:'waiting for acceptance',none:'No orders waiting ✅',accept:'✅ Accept',accepting:'Accepting …',retry:'🔁 Try again',failed:'Accept failed',
    prep:'Prep time',min:'min',delivery:'🛵 Delivery',pickup:'🛍 Pickup',cash:'💶 Cash',online:'💳 Paid online',asap:'As soon as possible',at:'at',now:'now',ago:'{n} min ago',
    queue:'🍳 In kitchen now: {n}',sounds:'⚙️ Sounds',enableSound:'🔊 Tap to enable sound',volume:'Volume',repeat:'Repeat every',off:'off',test:'Test',close:'Close',offline:'No connection',live:'Live',
    short:'Short',double:'Double',long:'Long',triple:'Triple',rising:'Rising',falling:'Falling',bell:'Bell',siren:'Siren',mute:'Mute',web:'Website',sec:'{n} s',errGeneric:'Error: ',
    tabPrepare:'Preparing',tabHandover:'Handover',tabDone:'Done',deliveryTime:'Delivery time',toHandover:'🚗 Handover',toDone:'✅ Done',noneStage:'No orders',saving:'saving …',saved:'✓ saved',leftMin:'min',lateMin:'late',platformFail:'Not applied on the platform',doneAgo:'done {n} min ago',details:'▼ Details',hide:'▲ Less',itemsN:'{n} items'}
};
const lang=()=>{try{return window.NARA_LANG?NARA_LANG.get():'de'}catch(e){return 'de'}};
const t=(k,n)=>{const v=((T[lang()]||T.de)[k]);const s=v!=null?v:(T.de[k]!=null?T.de[k]:k);return n==null?s:s.replace('{n}',n)};
const P=x=>{const v=String(x==null?'':x);return window.NARA_LANG&&/[؀-ۿ]/.test(v)?NARA_LANG.pick(v):v};
if(window.NARA_LANG&&NARA_LANG.mountSwitcher)NARA_LANG.mountSwitcher($('#langsw'));

// ───── المنصات: لون + اسم + نغمة افتراضية مميزة ─────
const PC={LIEFERANDO:'#ff8000',UBER_EATS:'#06c167',WOLT:'#009de0',LANCH:'#7b4ddb',WEB:'#E3262F',SIDES:'#8d6e63'};
const PN={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',WOLT:'Wolt',LANCH:'Lanch',WEB:'Website',SIDES:'Loco Chicken'};
const DEF_TONE={LIEFERANDO:'rising',UBER_EATS:'bell',WOLT:'falling',LANCH:'triple',WEB:'siren',SIDES:'long'};
const TONES={short:[[880,.14]],double:[[880,.14],[660,.14]],long:[[740,.18],[740,.18],[740,.18]],triple:[[880,.1],[880,.1],[880,.1]],
  rising:[[523,.12],[659,.12],[784,.22]],falling:[[784,.12],[659,.12],[523,.22]],bell:[[1047,.35],[784,.4]],siren:[[900,.2],[600,.2],[900,.2],[600,.2]]};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){/* ignore */}};
const toneOf=p=>lsGet('nara-sound-'+p,DEF_TONE[p]||'short');
const volume=()=>Math.min(100,Math.max(10,Number(lsGet('nara-sound-volume','80'))||80));
const repeatSec=()=>{const v=Number(lsGet('nara-reception-repeat','10'));return Number.isFinite(v)?v:10};

// ───── الصوت ─────
let ctx=null;
function audio(){if(ctx)return ctx;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C()}catch(e){ctx=null}return ctx}
// الطريقة الأساسية: ملف WAV بيتولّد ويتشغّل بعنصر Audio (نفس طريقة يوتيوب، أضمن على أندرويد)؛ WebAudio احتياط
const wavUrls={};
function wavUrl(style){
  if(wavUrls[style])return wavUrls[style];
  const R=22050,seq=TONES[style]||TONES.short,gap=Math.round(R*0.07);
  let n=0;for(const [,d] of seq)n+=Math.round(R*d)+gap;
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,R,true);v.setUint32(28,R*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let o=44;
  for(const [f,d] of seq){
    const len=Math.round(R*d);
    for(let i=0;i<len;i++){const e=Math.min(1,i/(R*0.015),(len-i)/(R*0.03));v.setInt16(o,Math.round(Math.sin(2*Math.PI*f*i/R)*e*0.9*32767),true);o+=2}
    o+=gap*2;
  }
  return (wavUrls[style]=URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
}
function diag(msg){const e=$('#diag');if(e)e.textContent=msg}
function playStyle(style){
  if(style==='off')return;
  try{
    if(typeof Audio==='function'&&typeof URL!=='undefined'&&URL.createObjectURL){
      const a=new Audio(wavUrl(style));a.volume=Math.min(1,volume()/100);
      const pr=a.play();
      if(pr&&pr.then)pr.then(()=>diag('🔊 OK ('+style+')')).catch(err=>{diag('⚠️ '+(err&&err.name||'Fehler'));playWeb(style)});
      return;
    }
  }catch(err){diag('⚠️ '+(err&&err.name||'Fehler'))}
  playWeb(style);
}
function playWeb(style){
  const c=audio();if(!c)return;
  if(c.state!=='running'){      // أندرويد: resume غير فوري، فنستنى لحد ما يشتغل ثم نشغّل
    try{c.resume().then(()=>{if(c.state==='running')playNow(c,style)}).catch(()=>{})}catch(e){/* ignore */}
    return;
  }
  playNow(c,style);
}
function playNow(c,style){
  let at=c.currentTime+0.02;const vol=volume()/100*0.9;
  for(const [f,d] of (TONES[style]||TONES.short)){
    const o=c.createOscillator(),g=c.createGain();
    o.type=style==='bell'?'triangle':'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+0.015);g.gain.linearRampToValueAtTime(0,at+d);
    o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+d+0.02);at+=d+0.07;
  }
}
const vib=()=>{try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){/* ignore */}};
const playFor=p=>{vib();playStyle(toneOf(p))};
function unlock(){const c=audio();if(!c)return;if(c.state==='suspended')c.resume().then(syncBanner).catch(()=>{});try{const b=c.createBuffer(1,1,22050),n=c.createBufferSource();n.buffer=b;n.connect(c.destination);n.start(0)}catch(e){/* ignore */}syncBanner()}
function syncBanner(){const c=audio();$('#banner').style.display=(c&&c.state==='running')?'none':'block'}
document.addEventListener('pointerdown',unlock);
$('#enableSound').onclick=()=>{unlock();setTimeout(()=>playStyle('short'),150)};

// ───── البيانات ─────
let orders=[],counts={WAIT:0,PREPARE:0,HANDOVER:0,DONE:0},tab=null,lastOk=0,lastSig='',seen=new Set(),lastBeep=0,busy=false;
const open=new Set(),mins={},dels={},touched={},localErr={},localAccepting=new Set(),localStage={},ed={},savedAt={};
const BASE=document.title;
const clamp=n=>Math.min(240,Math.max(5,n));
const clampD=n=>Math.min(180,Math.max(0,n));
const fmt=iso=>{const d=Date.parse(iso||'');return d?new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''};
const agoOf=iso=>{const d=Date.parse(iso||'');if(!d)return '';const m=Math.floor((Date.now()-d)/60000);return m<1?t('now'):t('ago',m)};
const minsLeft=o=>{const d=Date.parse(o.dueAt||'');return d?Math.round((d-Date.now())/60000):null};
const stageOf=o=>localStage[String(o.id)]||o.stage;

async function load(){
  if(busy)return;busy=true;
  try{
    const r=await fetch('/api/platform-orders/board',{cache:'no-store'});
    if(!r.ok)throw Error(r.status);
    const j=await r.json();
    orders=j.orders||[];
    counts=j.counts||{WAIT:orders.filter(o=>o.stage==='WAIT').length,PREPARE:0,HANDOVER:0,DONE:0};
    for(const o of orders){
      const id=String(o.id);
      if(o.state!=='ACCEPTING')localAccepting.delete(id);
      if(localStage[id]&&o.stage===localStage[id])delete localStage[id];
      if(o.stage==='WAIT'){
        if(!touched[id]||mins[id]==null)mins[id]=o.suggestedMinutes;
        if(!touched[id+'d']||dels[id]==null)dels[id]=o.deliveryMinutes!=null?o.deliveryMinutes:15;
      }
      const e=ed[id];
      if(e&&!e.timer&&e.state==='ok'&&o.prepMinutes===e.prep&&o.deliveryMinutes===e.del)delete ed[id];
    }
    if(tab==null)tab=(counts.WAIT>0)?'WAIT':'PREPARE';
    lastOk=Date.now();
    alerts();
  }catch(e){/* offline يظهر بالمؤشر */}
  finally{busy=false}
  render();
}
function needAction(){return orders.filter(o=>o.stage==='WAIT'&&(o.state==='PENDING'||o.state==='FAILED'))}
function alerts(){
  const need=needAction();let fresh=null;
  for(const o of need){const id=String(o.id);if(!seen.has(id)){seen.add(id);fresh=fresh||o}}
  const now=Date.now();
  if(fresh){playFor(fresh.source);lastBeep=now;tab='WAIT';return}
  const rs=repeatSec();
  if(need.length&&rs>0&&now-lastBeep>=rs*1000){playFor(need[0].source);lastBeep=now}
}

// ───── العرض ─────
function itemsHtml(o){
  return (o.items||[]).map(i=>'<li><span>'+(Number(i.quantity)||1)+'× '+esc(P(i.name))+'</span>'
    +((i.options||[]).length?'<div class="opts">+ '+(i.options||[]).map(x=>esc(P(x.name))+((x.quantity||1)>1?' ×'+x.quantity:'')).join(' · ')+'</div>':'')
    +(i.note?'<div class="note">📝 '+esc(i.note)+'</div>':'')+'</li>').join('');
}
function sumHtml(o){return (o.items||[]).map(i=>(Number(i.quantity)||1)+'× '+esc(P(i.name))).join(' · ')}
function itemsBlock(o,id,stg){
  const its=o.items||[];
  if(stg==='WAIT'||its.length<=1||open.has(id))return '<ul class="items">'+itemsHtml(o)+'</ul>'+(stg!=='WAIT'&&its.length>1?'<button type="button" class="tog" data-act="toggle">'+t('hide')+'</button>':'');
  return '<div class="sum">'+sumHtml(o)+'</div><button type="button" class="tog" data-act="toggle">'+t('details')+'</button>';
}
function stepsHtml(a,b,pick){return '<div class="times'+(pick?' one':'')+'">'+a+(pick?'':b)+'</div>'}
function metaHtml(o){
  const when=o.asap===false?'🕒 '+t('at')+' '+fmt(o.requestedAt):'';
  return [o.type==='pickup'?t('pickup'):t('delivery'),o.payment&&o.payment.method==='CASH'?t('cash'):t('online'),when].filter(Boolean).join(' · ');
}
function contactHtml(o){
  const c=o.contact||{},pick=o.type==='pickup',rows=[];
  if(!pick&&c.street)rows.push('<div class="addr">📍 '+esc(c.street)+'</div>');
  if(!pick&&c.city)rows.push('<div class="row2">'+esc(c.city)+(c.floor?' · 🏢 '+esc(c.floor):'')+'</div>');
  else if(!pick&&c.floor)rows.push('<div class="row2">🏢 '+esc(c.floor)+'</div>');
  if(c.name)rows.push('<div class="row2">👤 '+esc(c.name)+'</div>');
  if(c.phone)rows.push('<div class="row2">📞 <a href="tel:'+esc(c.phone.replace(/[^+\d]/g,''))+'">'+esc(c.phone)+'</a>'+(c.code?' · 🔑 <span class="code">'+esc(c.code)+'</span>':'')+'</div>');
  else if(c.code)rows.push('<div class="row2">🔑 <span class="code">'+esc(c.code)+'</span></div>');
  if(!pick&&c.note&&c.note!==o.notes)rows.push('<div class="row2">📝 '+esc(c.note)+'</div>');
  return rows.length?'<div class="contact">'+rows.join('')+'</div>':'';
}
function ringHtml(o){
  const ml=minsLeft(o),total=Math.max(1,(o.prepMinutes||25)+(o.deliveryMinutes!=null?o.deliveryMinutes:15));
  const cls=ml==null?'':(ml<0?'late':(ml<=10?'warn':''));
  const C=2*Math.PI*26,frac=ml==null?0:Math.min(1,Math.max(0,ml/total));
  return '<div class="ring '+cls+'" data-due="'+esc(o.dueAt||'')+'" data-total="'+total+'"><svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="26"/><circle class="fg" cx="31" cy="31" r="26" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"/></svg>'
    +'<div class="tx"><b>'+(ml==null?'–':Math.abs(ml))+'</b><small>'+(ml!=null&&ml<0?t('lateMin'):t('leftMin'))+'</small></div></div>';
}
function stepHtml(lbl,val,a,b,dis){
  return '<div class="timerow"><span class="lbl">'+lbl+'</span><div class="step"><button type="button" data-act="'+a+'"'+(dis?' disabled':'')+'>−5</button><b>'+val+' '+t('min')+'</b><button type="button" data-act="'+b+'"'+(dis?' disabled':'')+'>+5</button></div></div>';
}
function cardHtml(o){
  const id=String(o.id),pc=PC[o.source]||'#37474f',stg=stageOf(o);
  const badges='<span class="badge">'+esc(PN[o.source]||o.source)+'</span>'+(o.brand&&o.brand!==PN[o.source]?'<span class="badge brand">'+esc(o.brand)+'</span>':'')+'<b class="code">#'+esc(o.displayCode)+'</b>';
  const pick=o.type==='pickup';
  if(stg==='WAIT'){
    const st=o.state==='FAILED'?'FAILED':(o.state==='ACCEPTING'||localAccepting.has(id)?'ACCEPTING':'PENDING'),busyNow=st==='ACCEPTING';
    const m=mins[id]!=null?mins[id]:o.suggestedMinutes,d=dels[id]!=null?dels[id]:15;
    return '<article class="card '+st+'" style="--pc:'+pc+'" data-id="'+esc(id)+'">'
      +'<div class="top">'+badges+'<span class="age" data-ts="'+esc(o.pendingSince||o.placedAt||'')+'">'+esc(agoOf(o.pendingSince||o.placedAt))+'</span></div>'
      +'<div class="meta">'+metaHtml(o)+'</div>'+contactHtml(o)+itemsBlock(o,id,'WAIT')
      +(o.notes?'<div class="notes">📝 '+esc(o.notes)+'</div>':'')
      +stepsHtml(stepHtml(t('prep'),m,'minus','plus',busyNow),stepHtml(t('deliveryTime'),d,'dminus','dplus',busyNow),pick)
      +'<div class="saved">'+t('queue',o.queue||0)+'</div>'
      +((st==='FAILED'||localErr[id])?'<div class="err">⚠️ '+t('failed')+(o.error||localErr[id]?': '+esc(o.error||localErr[id]):'')+'</div>':'')
      +'<button type="button" class="go'+(st==='FAILED'?' retry':'')+'" data-act="accept"'+(busyNow?' disabled':'')+'>'+(busyNow?t('accepting'):(st==='FAILED'?t('retry'):t('accept')))+'</button>'
      +'</article>';
  }
  const e=ed[id],prep=e?e.prep:(o.prepMinutes||25),del=e?e.del:(o.deliveryMinutes!=null?o.deliveryMinutes:15);
  const stateTxt=e?(e.state==='ok'?t('saved'):(e.state==='err'?'⚠️ '+esc(e.msg||''):t('saving'))):(Date.now()-(savedAt[id]||0)<3000?t('saved'):'');
  const syncTxt=o.sync&&o.sync.state==='FAILED'?'<div class="sync2">⚠️ '+t('platformFail')+(o.sync.error?': '+esc(o.sync.error):'')+'</div>':'';
  let head='<div class="head">'+(stg==='DONE'?'':ringHtml(o))+'<div class="top">'+badges+'<span class="age" data-ts="'+esc(o.stageAt||o.acceptedAt||o.placedAt||'')+'">'+esc(agoOf(o.stageAt||o.acceptedAt||o.placedAt))+'</span></div></div>';
  let body='<div class="meta">'+metaHtml(o)+'</div>'+contactHtml(o)+(o.notes?'<div class="notes">📝 '+esc(o.notes)+'</div>':'')+itemsBlock(o,id,stg);
  let times='',btn='';
  if(stg!=='DONE'){
    times=stepsHtml(stepHtml(t('prep'),prep,'minus','plus',false),stepHtml(t('deliveryTime'),del,'dminus','dplus',false),pick)+'<div class="saved">'+stateTxt+'</div>';
    btn=stg==='PREPARE'?'<button type="button" class="go next" data-act="next">'+t('toHandover')+'</button>':'<button type="button" class="go fin" data-act="next">'+t('toDone')+'</button>';
  }
  const ml0=stg==='DONE'?null:minsLeft(o),urg=ml0==null?'':(ml0<0?' late':(ml0<=10?' warn':''));
  return '<article class="card '+stg+urg+'" style="--pc:'+pc+'" data-id="'+esc(id)+'">'+head+body+times+syncTxt+(localErr[id]?'<div class="err">⚠️ '+esc(localErr[id])+'</div>':'')+btn+'</article>';
}
function render(force){
  const need=needAction().length;
  $('#cntN').textContent=counts.WAIT;$('#cntP').textContent=counts.PREPARE;$('#cntH').textContent=counts.HANDOVER;$('#cntD').textContent=counts.DONE;
  $('#cnt').classList.toggle('hot',need>0);if(document.body&&document.body.classList)document.body.classList.toggle('alarm',need>0);
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab));
  document.title=(counts.WAIT?'('+counts.WAIT+') ':'')+BASE;
  const sy=$('#sync'),off=Date.now()-lastOk>10000;sy.classList.toggle('off',off);
  sy.querySelector('span').textContent=(off?t('offline'):t('live'))+' · '+new Date(lastOk||Date.now()).toLocaleTimeString('de-DE');
  const shown=orders.filter(o=>stageOf(o)===(tab||'WAIT'));
  const sig=JSON.stringify([lang(),tab,counts,shown.map(o=>{const id=String(o.id),e=ed[id];return [o.id,stageOf(o),o.state,o.error,o.queue,o.prepMinutes,o.deliveryMinutes,o.dueAt,o.sync&&o.sync.state,mins[id],dels[id],localAccepting.has(id),open.has(id),localErr[id],e&&[e.prep,e.del,e.state],Date.now()-(savedAt[id]||0)<3000]})]);
  if(!force&&sig===lastSig)return;   // ما منعيد الرسم إذا ما تغيّر شي (كي ما تضيع كبسة على التابلت)
  lastSig=sig;
  $('#list').innerHTML=shown.length?shown.map(cardHtml).join(''):'<div class="empty">'+((tab||'WAIT')==='WAIT'?t('none'):t('noneStage'))+'</div>';
}
function tickAges(){
  document.querySelectorAll('.age[data-ts]').forEach(e=>{e.textContent=agoOf(e.dataset.ts)});
  document.querySelectorAll('.ring[data-due]').forEach(r=>{
    const d=Date.parse(r.dataset.due||'');if(!d)return;
    const ml=Math.round((d-Date.now())/60000),total=Math.max(1,Number(r.dataset.total)||1),C=2*Math.PI*26;
    r.classList.toggle('late',ml<0);r.classList.toggle('warn',ml>=0&&ml<=10);
    const b=r.querySelector('.tx b'),sm=r.querySelector('.tx small'),fg=r.querySelector('.fg');
    if(b)b.textContent=Math.abs(ml);if(sm)sm.textContent=ml<0?t('lateMin'):t('leftMin');
    if(fg)fg.setAttribute('stroke-dashoffset',(C*(1-Math.min(1,Math.max(0,ml/total)))).toFixed(1));
  });
}

async function saveTimes(id){
  const e=ed[id];if(!e)return;e.timer=null;e.state='saving';render();
  try{
    const r=await fetch('/api/platform-orders/times',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,prepMinutes:e.prep,deliveryMinutes:e.del})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(j.error||r.status);
    e.state='ok';savedAt[id]=Date.now();setTimeout(()=>render(true),3200);
  }catch(err){e.state='err';e.msg=String(err.message||err)}
  render();load();
}
function editTimes(o,dp,dd){
  const id=String(o.id);
  const e=ed[id]||(ed[id]={prep:o.prepMinutes||25,del:o.deliveryMinutes!=null?o.deliveryMinutes:15,state:'saving',timer:null});
  e.prep=clamp(e.prep+dp);e.del=clampD(e.del+dd);e.state='saving';
  clearTimeout(e.timer);e.timer=setTimeout(()=>saveTimes(id),900);
  render();
}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-tab]');if(b&&b.dataset.tab){tab=b.dataset.tab;render(true)}});
$('#list').addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('button[data-act]');if(!b||b.disabled)return;
  const card=b.closest('.card'),id=card&&card.dataset.id;if(!id)return;
  const o=orders.find(x=>String(x.id)===id);if(!o)return;
  const act=b.dataset.act,stg=stageOf(o);
  if(act==='toggle'){if(open.has(id))open.delete(id);else open.add(id);render(true);return}
  if(act==='minus'||act==='plus'||act==='dminus'||act==='dplus'){
    const dp=act==='plus'?5:(act==='minus'?-5:0),dd=act==='dplus'?5:(act==='dminus'?-5:0);
    if(stg==='WAIT'){
      if(dp){touched[id]=true;mins[id]=clamp((mins[id]!=null?mins[id]:o.suggestedMinutes)+dp)}
      if(dd){touched[id+'d']=true;dels[id]=clampD((dels[id]!=null?dels[id]:15)+dd)}
      render();
    }else editTimes(o,dp,dd);
    return;
  }
  if(act==='accept'){
    unlock();
    delete localErr[id];localAccepting.add(id);render();
    try{
      const body={orderId:id,minutes:mins[id]!=null?mins[id]:o.suggestedMinutes};
      if(o.type!=='pickup')body.deliveryMinutes=dels[id]!=null?dels[id]:15;
      const r=await fetch('/api/platform-orders/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok&&r.status!==409)throw Error(j.error||r.status);
    }catch(err){localAccepting.delete(id);localErr[id]=String(err.message||err);render();return}
    load();
    return;
  }
  if(act==='next'){
    const to=stg==='PREPARE'?'HANDOVER':'DONE';
    delete localErr[id];localStage[id]=to;render();
    try{
      const r=await fetch('/api/platform-orders/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,stage:to})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw Error(j.error||r.status);
    }catch(err){delete localStage[id];localErr[id]=String(err.message||err);render();return}
    load();
  }
});

// ───── إعدادات الأصوات ─────
function buildSettings(){
  const toneOpts=sel=>Object.keys(TONES).concat(['off']).map(k=>'<option value="'+k+'"'+(k===sel?' selected':'')+'>'+t(k==='off'?'mute':k)+'</option>').join('');
  $('#setRows').innerHTML=Object.keys(PC).map(p=>'<div class="row"><label for="t-'+p+'">'+esc(PN[p])+'</label><select id="t-'+p+'" data-p="'+p+'">'+toneOpts(toneOf(p))+'</select><button type="button" class="tst" data-test="'+p+'">'+t('test')+'</button></div>').join('');
  $('#vol').value=volume();
  $('#rep').innerHTML=[0,5,10,20,30].map(n=>'<option value="'+n+'"'+(n===repeatSec()?' selected':'')+'>'+(n?t('sec',n):t('off'))+'</option>').join('');
}
$('#openSet').onclick=()=>{unlock();buildSettings();$('#set').style.display='flex'};
$('#closeSet').onclick=()=>{$('#set').style.display='none'};
$('#setRows').addEventListener('change',e=>{const s=e.target.closest('select[data-p]');if(s){lsSet('nara-sound-'+s.dataset.p,s.value);playStyle(s.value)}});
$('#setRows').addEventListener('click',e=>{const b=e.target.closest('button[data-test]');if(b){unlock();playFor(b.dataset.test)}});
$('#vol').oninput=e=>{lsSet('nara-sound-volume',e.target.value)};
$('#vol').onchange=()=>{unlock();playStyle('short')};
$('#rep').onchange=e=>lsSet('nara-reception-repeat',e.target.value);

function applyStatic(){document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.documentElement.lang=lang()}
window.addEventListener('nara-lang',()=>{applyStatic();tickAges();render(true)});
applyStatic();syncBanner();
load();
setInterval(()=>{load()},3000);
setInterval(()=>{if(orders.some(o=>o.state==='ACCEPTING'||localAccepting.has(String(o.id))))load()},1000);
setInterval(tickAges,20000);
})();
</script>
