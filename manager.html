<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Flamo · KI-Manager</title>
<script src="nara-lang.js?v=20261009b" data-section="manager"></script>
<script src="flamo-t.js"></script>
<link rel="stylesheet" href="flamo-night.css?v=20261031b"><script src="flamo-night.js?v=20261031b"></script>
<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#1d2327;--mute:#6b7378;--line:#e7e3de;--brand:#ef491d;--soft:#fff4ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 FlamoAr,"Segoe UI",system-ui,Arial,sans-serif}
button,textarea{font:inherit;color:inherit}
body{display:flex;flex-direction:column}
header{padding:12px 16px;background:#fff;box-shadow:0 1px 0 var(--line);display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.2rem;color:var(--brand);flex:1}
header a,header button{border:0;background:#eef0ea;border-radius:12px;min-height:40px;padding:0 12px;text-decoration:none;color:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center}
#status{font-size:.8rem;color:var(--mute);padding:4px 16px 0;max-width:820px;margin:0 auto;width:100%}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:820px;margin:0 auto;width:100%}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;white-space:normal;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-end-end-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card);box-shadow:0 1px 0 var(--line);border-end-start-radius:6px}
.msg.ai ul{margin:4px 0;padding-inline-start:20px}
.msg.ai p{margin:4px 0}
.msg.err{align-self:center;background:#fff6f5;color:#b3261e;font-size:.92rem}
.tools{font-size:.75rem;color:var(--mute);margin-top:6px}
.typing{align-self:flex-start;color:var(--mute);padding:6px 12px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card.ask{box-shadow:inset 0 0 0 3px var(--brand);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:#f7f5f2;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:600;text-align:start}
form{display:flex;gap:8px;padding:10px 14px 14px;max-width:820px;margin:0 auto;width:100%}
textarea{flex:1;min-height:52px;max-height:160px;resize:none;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff}
#send{min-width:64px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:1.2rem;cursor:pointer}
#send:disabled{opacity:.5}
[hidden]{display:none!important}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:#f1eee9;border-radius:6px;padding:1px 5px;direction:ltr;unicode-bidi:isolate}
header button.on{background:var(--brand);color:#fff}
#tasks{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:820px;margin:0 auto;width:100%}
.task h3{margin:0 0 4px;font-size:1.05rem}.task pre{white-space:pre-wrap;background:#f7f5f2;border-radius:12px;padding:10px;font-size:.85rem;max-height:220px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row button{border:0;border-radius:12px;min-height:42px;padding:0 12px;font-weight:700;cursor:pointer;background:#eef0ea}.row button.main{background:var(--brand);color:#fff}
.risk-high{color:#b3261e}.risk-medium{color:#9a5200}.risk-low{color:#16884a}
.mute{color:var(--mute);font-size:.9rem}
</style>
<link rel="stylesheet" href="flamo-font.css?v=20261109a"></head>
<body>
<header><h1>🧠 <span data-t="title"></span></h1><button type="button" id="tabChat" class="on">💬 <span data-t="tChat"></span></button><button type="button" id="tabTasks">📋 <span data-t="tTasks"></span> <b id="nTasks"></b></button><button type="button" id="clear">🧹</button></header>
<div id="status"></div>
<div id="log" aria-live="polite"></div>
<div id="tasks" hidden></div>
<form id="f"><textarea id="q" rows="1" data-t-ph="ph"></textarea><button id="send" type="submit" data-t-title="send">➤</button></form>
<script>
let TASKS=[],view='chat';
FT.init({
  title:{de:'KI-Manager',ar:'المدير الذكي',en:'AI manager'},
  tChat:{de:'Chat',ar:'محادثة',en:'Chat'},
  tTasks:{de:'Aufgaben',ar:'بطاقات المهام',en:'Task cards'},
  ph:{de:'Frag alles zum System: Seiten, Fehler, Änderungen, Zahlen…',ar:'اسأل أي شي عن النظام: صفحات، أخطاء، تعديلات، أرقام…',en:'Ask anything about the system: pages, errors, changes, numbers…'},
  send:{de:'Senden',ar:'ابعت',en:'Send'},
  hello:{de:'Hallo Omar 👋 Ich kenne das ganze Flamo-System — Code, Seiten, letzte Änderungen und den Live-Zustand. Frag mich, ich erkläre es einfach. Änderungen schreibe ich als Aufgabenkarte für Claude Code.',ar:'أهلين عمر 👋 أنا بعرف كل نظام Flamo: الكود والصفحات وآخر التعديلات وشو عم يصير هلق. اسألني وبشرحلك ببساطة. وأي تعديل بكتبلك ياه كبطاقة مهمة لـ Claude Code.',en:'Hi Omar 👋 I know the whole Flamo system — code, pages, recent changes and the live state. Ask me and I will explain simply. Changes become task cards for Claude Code.'},
  s1:{de:'Was hat sich in den letzten Tagen am System geändert?',ar:'شو تغيّر بالنظام بالأيام الأخيرة؟',en:'What changed in the system in the last days?'},
  s2:{de:'Wie läuft es gerade? Alles in Ordnung?',ar:'كيف الشغل هلق؟ كلو تمام؟',en:'How is it running right now? All fine?'},
  s3:{de:'Wie kommt eine Lieferando-Bestellung bis zum Drucker?',ar:'كيف طلب Lieferando بيوصل لعند الطابعة؟',en:'How does a Lieferando order reach the printer?'},
  s4:{de:'Wie viel Umsatz hatten wir gestern?',ar:'قديش كانت المبيعات مبارح؟',en:'How much did we sell yesterday?'},
  s5:{de:'Welche Seiten gibt es und wofür?',ar:'شو الصفحات الموجودة وشو بتعمل كل وحدة؟',en:'Which pages exist and what for?'},
  s6:{de:'Ich will, dass die Küche einen Ton bei neuen Bestellungen spielt',ar:'بدي المطبخ يطلع صوت لما يجي طلب جديد',en:'I want the kitchen to play a sound for new orders'},
  thinking:{de:'Schaue im System nach…',ar:'عم شوف بالنظام…',en:'Looking into the system…'},
  noKeyT:{de:'KI noch nicht eingerichtet',ar:'الذكاء الاصطناعي لسا مو مركّب',en:'AI not set up yet'},
  noKey:{de:'Auf dem Kassen-PC in der Datei .env die Zeile ANTHROPIC_API_KEY=… eintragen und den Server neu starten. Den Schlüssel nie in einen Chat schicken.',ar:'على كمبيوتر المحل بملف .env زيد سطر ANTHROPIC_API_KEY=… وأعد تشغيل السيرفر. ولا تبعت المفتاح بأي شات.',en:'On the shop PC add the line ANTHROPIC_API_KEY=… to the .env file and restart the server. Never send the key in a chat.'},
  budget:{de:'Monatsbudget erreicht ({c} € von {b} €). Erhöhen mit NARA_MANAGER_AI_BUDGET_EUR in .env.',ar:'خلصت ميزانية الشهر ({c} € من {b} €). بتزيدها بـ NARA_MANAGER_AI_BUDGET_EUR بملف .env.',en:'Monthly budget reached ({c} € of {b} €). Raise it with NARA_MANAGER_AI_BUDGET_EUR in .env.'},
  err:{de:'Keine Antwort — bitte nochmal versuchen.',ar:'ما في جواب — جرّب كمان مرة.',en:'No answer — please try again.'},
  stat:{de:'{p} · diesen Monat {n} Fragen · ca. {c} €',ar:'{p} · هالشهر {n} سؤال · تقريباً {c} €',en:'{p} · this month {n} questions · approx. {c} €'},
  readOnly:{de:'Liest nur — ändert nie selbst Code oder Daten.',ar:'بيقرا بس — ما بيغيّر كود ولا بيانات لحالو.',en:'Read-only — never changes code or data itself.'},
  looked:{de:'Nachgeschaut: {t}',ar:'شاف: {t}',en:'Looked at: {t}'},
  noTasks:{de:'Noch keine Aufgabenkarten. Sag im Chat, was geändert werden soll.',ar:'لسا ما في بطاقات. قول بالمحادثة شو بدك يتغيّر.',en:'No task cards yet. Say in the chat what should change.'},
  copy:{de:'Für Claude kopieren',ar:'انسخ لـ Claude',en:'Copy for Claude'},
  copied:{de:'Kopiert ✅ — in Claude Code einfügen',ar:'انتسخ ✅ — الصقو بـ Claude Code',en:'Copied ✅ — paste into Claude Code'},
  done:{de:'Erledigt',ar:'خلصت',en:'Done'},
  dismiss:{de:'Verwerfen',ar:'إلغاء',en:'Dismiss'},
  st_OPEN:{de:'offen',ar:'مفتوحة',en:'open'},
  st_DONE:{de:'erledigt',ar:'خالصة',en:'done'},
  st_DISMISSED:{de:'verworfen',ar:'ملغاة',en:'dismissed'},
  risk:{de:'Risiko',ar:'الخطورة',en:'Risk'},
},{onChange(){render();drawTasks()}});

const $=id=>document.getElementById(id);
const t=(k,v)=>FT.t(k,v);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lang=()=>{const l=(FT.locale()||'de').slice(0,2);return ['de','ar','en'].includes(l)?l:'de'};
let H=[],busy=false,status=null;
try{H=JSON.parse(sessionStorage.getItem('flamo-manager')||'[]')||[]}catch(e){H=[]}
const keep=()=>{try{sessionStorage.setItem('flamo-manager',JSON.stringify(H.slice(-30)))}catch(e){}};

function md(s){
  const lines=esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').split('\n');
  let out='',inList=false;
  for(const l of lines){
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!inList){out+='<ul>';inList=true}out+='<li>'+m[1]+'</li>'}
    else{if(inList){out+='</ul>';inList=false}if(l.trim())out+='<p>'+l+'</p>'}
  }
  return out+(inList?'</ul>':'');
}
function render(){
  const log=$('log');let html='';
  // Ohne KI-Schlüssel: Eingabe und Vorschläge gesperrt (wie beim KI-Buchhalter) — nichts wird gesendet, was nur einen Fehler bringt
  const noKey=!!(status&&!status.configured);
  if(noKey)html+=`<div class="card ask"><b>🔑 ${esc(t('noKeyT'))}</b><p class="mute">${esc(t('noKey'))}</p></div>`;
  html+=`<div class="msg ai"><p>${esc(t('hello'))}</p><p style="font-size:.85rem;color:var(--mute)">🔒 ${esc(t('readOnly'))}</p></div>`;
  if(!H.length)html+=`<div class="chips">${['s1','s2','s3','s4','s5','s6'].map(k=>`<button class="chip" type="button" data-k="${k}"${noKey?' disabled':''}>${esc(t(k))}</button>`).join('')}</div>`;
  $('q').disabled=noKey;$('send').disabled=noKey||busy;
  for(const m of H){
    if(m.role==='user')html+=`<div class="msg me">${esc(m.text)}</div>`;
    else if(m.role==='assistant')html+=`<div class="msg ai">${md(m.text)}${m.tools&&m.tools.length?`<div class="tools">🔎 ${esc(t('looked',{t:m.tools.join(', ')}))}</div>`:''}</div>`;
    else html+=`<div class="msg err">${esc(m.text)}</div>`;
  }
  if(busy)html+=`<div class="typing">⏳ ${esc(t('thinking'))}</div>`;
  log.innerHTML=html;
  log.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(!noKey)ask(t(b.dataset.k))});
  log.scrollTop=log.scrollHeight;
  if(status&&status.configured){const u=status.usage||{};$('status').textContent=t('stat',{p:String(status.provider||'').split(':')[0],n:u.calls||0,c:(u.costEur||0).toFixed(2)})+(status.budgetEur?' / '+Number(status.budgetEur).toFixed(2)+' €':'')}
}
async function loadStatus(){try{const r=await fetch('/api/manager/status',{cache:'no-store'});if(r.ok)status=await r.json()}catch(e){}render()}
async function ask(text){
  text=String(text||'').trim();if(!text||busy)return;
  const history=H.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,text:m.text}));
  H.push({role:'user',text});busy=true;$('send').disabled=true;render();
  try{
    const r=await fetch('/api/manager/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,history,lang:lang()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.reply)H.push({role:'assistant',text:j.reply,tools:j.toolsUsed||[]});
    else if(j.code==='NO_AI_KEY'){status={configured:false};H.push({role:'error',text:t('noKey')})}
    else if(j.code==='BUDGET')H.push({role:'error',text:t('budget',{c:(j.usage&&j.usage.costEur||0).toFixed(2),b:j.budgetEur})});
    else H.push({role:'error',text:t('err')});
  }catch(e){H.push({role:'error',text:t('err')})}
  busy=false;$('send').disabled=!!(status&&!status.configured);keep();loadStatus();loadTasks();
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('q').value;$('q').value='';ask(v)};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}});
$('clear').onclick=()=>{H=[];keep();render()};
const tk=(k,v)=>FT.t(k,v); // dynamic keys
function setView(v){view=v;$('log').hidden=v!=='chat';$('f').hidden=v!=='chat';$('tasks').hidden=v!=='tasks';$('tabChat').classList.toggle('on',v==='chat');$('tabTasks').classList.toggle('on',v==='tasks');if(v==='tasks')loadTasks()}
function drawTasks(){
  const open=TASKS.filter(x=>x.status==='OPEN').length;$('nTasks').textContent=open?String(open):'';
  $('tasks').innerHTML=TASKS.map(x=>`<div class="card task"><h3>${x.status==='OPEN'?'🟠':x.status==='DONE'?'✅':'⚪'} ${esc(x.title)}</h3><div class="mute">${esc(tk('st_'+x.status))} · ${esc(t('risk'))}: <b class="risk-${esc(x.risk)}">${esc(x.risk)}</b> · ${esc(String(x.createdAt||'').slice(0,10))}</div><pre>${esc(x.prompt)}</pre><div class="row"><button class="main" type="button" data-copy="${esc(x.id)}">📋 ${esc(t('copy'))}</button>${x.status==='OPEN'?`<button type="button" data-st="DONE" data-id="${esc(x.id)}">✅ ${esc(t('done'))}</button><button type="button" data-st="DISMISSED" data-id="${esc(x.id)}">✖ ${esc(t('dismiss'))}</button>`:''}</div></div>`).join('')||`<div class="card mute">${esc(t('noTasks'))}</div>`;
  $('tasks').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const x=TASKS.find(y=>y.id===b.dataset.copy);try{await navigator.clipboard.writeText(x.prompt);b.textContent=t('copied')}catch(e){}});
  $('tasks').querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{try{await fetch('/api/manager/tasks/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,status:b.dataset.st})})}catch(e){}loadTasks()});
}
async function loadTasks(){try{const r=await fetch('/api/manager/tasks',{cache:'no-store'});TASKS=r.ok?(await r.json()).tasks||[]:[]}catch(e){TASKS=[]}drawTasks()}
$('tabChat').onclick=()=>setView('chat');$('tabTasks').onclick=()=>setView('tasks');
loadTasks();
render();loadStatus();
</script>
<script src="flamo-home.js?v=20261031a" defer></script></body>
</html>
