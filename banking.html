<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flamo · Bank</title><link rel="stylesheet" href="nara-shell.css"><style>body{margin:0;background:#f4f6f9;color:#162033;font-family:Arial,sans-serif}.page{max-width:1100px;margin:auto;padding:40px 28px}.card{background:#fff;border:1px solid #e4e9f0;border-radius:16px;padding:24px;margin-bottom:20px}h1{margin:0 0 8px}.muted{color:#68758a}input,button{padding:11px;border:1px solid #d5dce6;border-radius:8px;font:inherit}button{background:#c83b1d;color:#fff;cursor:pointer}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tx{padding:12px 0;border-bottom:1px solid #e4e9f0;display:flex;justify-content:space-between;gap:12px}.unmatched{color:#b26a00}.matched{color:#18834b}</style><link rel="stylesheet" href="flamo-night.css?v=20261031a"><script src="flamo-night.js?v=20261031a"></script></head><body><main class="page"><section class="card"><p class="muted" data-t="eyebrow"></p><h1 data-t="h1"></h1><p class="muted" data-t="sub"></p><div class="row"><input id="file" type="file" accept=".csv,text/csv"><button id="import" data-t="imp"></button><button id="refresh" data-t="refresh"></button></div><p id="status"></p></section><section class="card"><h2 data-t="txh"></h2><div id="transactions" data-t="loading"></div></section></main><script src="/nara-lang.js?v=20261018" data-section="banking"></script><script src="/flamo-t.js"></script><script>(async()=>{
const T={title:{de:'Bank',ar:'البنك',en:'Bank'},eyebrow:{de:'Buchhaltung · Bank-/Kassenabgleich',ar:'المحاسبة · مطابقة البنك والكاشير',en:'Accounting · Bank/cash reconciliation'},h1:{de:'Kontoauszüge und Abgleich',ar:'كشوف البنك والتسوية',en:'Bank statements & reconciliation'},sub:{de:'CSV hochladen. Buchungen werden erst nach Abgleich und Freigabe verbucht.',ar:'ارفع ملف CSV. الحركات ما بتنرحّل محاسبياً قبل المطابقة والموافقة.',en:'Upload a CSV. Transactions are not posted until matched and approved.'},imp:{de:'Auszug importieren',ar:'استيراد الكشف',en:'Import statement'},refresh:{de:'Aktualisieren',ar:'تحديث',en:'Refresh'},txh:{de:'Banktransaktionen',ar:'الحركات البنكية',en:'Bank transactions'},loading:{de:'Wird geladen…',ar:'عم يحمّل…',en:'Loading…'},noDesc:{de:'ohne Beschreibung',ar:'بدون وصف',en:'no description'},matched:{de:'abgeglichen',ar:'مطابقة',en:'matched'},unmatched:{de:'nicht abgeglichen',ar:'غير مطابقة',en:'unmatched'},approve:{de:'Freigeben',ar:'اعتماد',en:'Approve'},none:{de:'Noch keine Banktransaktionen',ar:'ما في حركات بنكية لسا',en:'No bank transactions yet'},ask:{de:'Vorgangs- oder Rechnungsnummer eingeben',ar:'دخّل رقم العملية أو الفاتورة المرتبطة',en:'Enter the linked transaction or invoice number'},ok:{de:'Abgleich freigegeben',ar:'تم اعتماد المطابقة',en:'Match approved'},noOk:{de:'Abgleich konnte nicht freigegeben werden',ar:'تعذر اعتماد المطابقة',en:'Could not approve the match'},pick:{de:'Bitte zuerst eine CSV-Datei wählen',ar:'اختار ملف CSV أولاً',en:'Choose a CSV file first'},imported:{de:'{n} Buchungen importiert',ar:'تم استيراد {n} حركة',en:'{n} transactions imported'},impFail:{de:'Import fehlgeschlagen',ar:'تعذر الاستيراد',en:'Import failed'}};
let last=null;const $=id=>document.getElementById(id);async function load(){last=await (await fetch('/api/accounting/bank-transactions?ts='+Date.now())).json();draw()}function draw(){const j=last||{};$('transactions').innerHTML=(j.transactions||[]).map(x=>`<div class="tx"><span>${x.date} · ${x.description||FT.t('noDesc')} · ${(x.amountCents/100).toFixed(2)} €</span><span class="${x.status==='MATCHED'?'matched':'unmatched'}">${FT.t(x.status==='MATCHED'?'matched':'unmatched')} <button data-id="${x.id}">${FT.t('approve')}</button></span></div>`).join('')||FT.t('none');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const ref=prompt(FT.t('ask'));if(!ref)return;const r=await fetch('/api/accounting/bank-transactions/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transactionId:id,status:'MATCHED',entityType:'MANUAL',entityId:ref})});$('status').textContent=FT.t(r.ok?'ok':'noOk');load()})}$('import').onclick=async()=>{const f=$('file').files[0];if(!f)return $('status').textContent=FT.t('pick');const r=await fetch('/api/accounting/bank-transactions/csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv:await f.text()})});const j=await r.json();$('status').textContent=r.ok?FT.t('imported',{n:j.addedCount}):(j.error||FT.t('impFail'));load()};$('refresh').onclick=load;FT.init(T,{onChange:draw});load()})()</script><script src="flamo-home.js?v=20261031a" defer></script></body></html>
