<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NARA · الزباين</title>
<script src="nara-lang.js?v=20261009b" data-section="customers"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202a;--muted:#6b7580;--line:#e2e6ea;--blue:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#101820;color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:19px}
.chip{background:#ffffff1a;border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.sp{flex:1}
.wrap{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:calc(100% - 52px)}
aside{display:flex;flex-direction:column;border-inline-end:1px solid var(--line);min-height:0}
.tools{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--card)}
.tools input,.tools select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#list{overflow:auto;flex:1;padding:8px}
.cust{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-inline-start:5px solid var(--c,#ccc)}
.cust:hover{box-shadow:0 1px 6px #0002}
.cust.sel{outline:2px solid var(--blue)}
.cust .top{display:flex;gap:8px;align-items:baseline}
.cust .nm{font-weight:800;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust .am{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.cust .ad{color:#334;font-size:13px;margin-top:2px}
.cust .mt{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:#eef1f4;color:#334}
.b-REGULAR{background:#dcfce7;color:#166534}.b-RETURNING{background:#fef3c7;color:#92400e}.b-NEW{background:#cffafe;color:#155e75}.b-SLEEPING{background:#e5e7eb;color:#374151}.b-CANCELLED_ONLY{background:#fee2e2;color:#991b1b}
.main{position:relative;min-height:0}
#map{position:absolute;inset:0}
#detail{position:absolute;top:10px;inset-inline-end:10px;width:min(380px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 4px 20px #0003;padding:14px;z-index:500;display:none}
#detail h2{margin:0 0 2px;font-size:19px;padding-inline-end:28px}
#detail .x{position:absolute;top:8px;inset-inline-end:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:10px 0}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums;direction:ltr}
.stat small{color:var(--muted);font-size:12px}
.fav{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.note{font-size:12px;border-radius:8px;padding:7px 9px;margin-top:10px;background:#eef1f4}
.note.pl{background:#fff7d6;border:1px solid #f3d36b}
.note.own{background:#dcfce7;border:1px solid #86efac}
h3{font-size:14px;margin:12px 0 4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.dot{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0007}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}aside{border:0}#list{overflow:visible}.main{height:60vh}#detail{position:fixed;inset:auto 0 0 0;width:auto;max-height:75vh;border-radius:14px 14px 0 0}}
</style>
</head>
<body>
<header>
  <h1>👥 <span data-t="title"></span></h1>
  <span class="chip" id="s-cust"></span>
  <span class="chip" id="s-rep"></span>
  <span class="chip" id="s-avg"></span>
  <span class="chip" id="s-since"></span>
  <span class="sp"></span>
  <span id="langsw"></span>
</header>
<div class="wrap">
  <aside>
    <div class="tools">
      <input id="q" type="search" autocomplete="off">
      <div class="row" id="segs"></div>
      <div class="row">
        <select id="src" style="flex:1"></select>
        <select id="sort" style="flex:1"></select>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <div class="main"><div id="map"></div><div id="detail"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const T={
    de:{title:'Kunden',search:'Name, Straße oder Telefon suchen …',all:'Alle',REGULAR:'Stammkunde',RETURNING:'Wiederkehrend',NEW:'Neu',SLEEPING:'Lange nicht bestellt',CANCELLED_ONLY:'Nur storniert',
      allSrc:'Alle Quellen',sLast:'Letzte Bestellung',sOrders:'Meiste Bestellungen',sTotal:'Höchster Umsatz',sAvg:'Höchster Bestellwert',
      cust:'{n} Kunden',rep:'<bdi>{p}%</bdi> kommen wieder',avg:'Ø {a} pro Bestellung',since:'Daten seit {d}',
      orders:'Bestellungen',total:'Umsatz',avgS:'Ø Bestellung',first:'Erste Bestellung',last:'Letzte Bestellung',gap:'Bestellt alle',days:'{n} Tage',next:'Nächste erwartet',
      usual:'Bestellt meistens',at:'{d} um ca. {h} Uhr',phone:'Telefon',floor:'Etage',bell:'Klingel',noteD:'Notiz',aka:'Auch als',source:'Quellen',cancelled:'Storniert',range:'Spanne',
      favs:'Bestellt am liebsten',none:'Keine Kunden gefunden.',loading:'Lade Kunden …',err:'Kunden konnten nicht geladen werden: ',
      platform:'Plattform-Kunde: Daten nur für die Lieferung verwenden, nicht für Werbung.',own:'Hat direkt bei uns bestellt (Website/Kasse).',
      raw:'Adresse aus altem Lieferando-Text gelesen.',noMap:'Karte nicht verfügbar.',overdue:'überfällig',
      wd:['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag']},
    ar:{title:'الزباين',search:'دوّر بالاسم أو الشارع أو التلفون …',all:'الكل',REGULAR:'زبون دايم',RETURNING:'رجع طلب',NEW:'جديد',SLEEPING:'صارلو زمان ما طلب',CANCELLED_ONLY:'ملغى بس',
      allSrc:'كل المصادر',sLast:'آخر طلب',sOrders:'أكتر طلبات',sTotal:'أكتر مبيعات',sAvg:'أعلى فاتورة',
      cust:'{n} زبون',rep:'<bdi>{p}%</bdi> بيرجعوا',avg:'المتوسط {a} للطلب',since:'البيانات من {d}',
      orders:'طلبات',total:'المجموع',avgS:'متوسط الطلب',first:'أول طلب',last:'آخر طلب',gap:'بيطلب كل',days:'{n} يوم',next:'متوقع يطلب',
      usual:'بيطلب عادةً',at:'{d} حوالي الساعة {h}',phone:'التلفون',floor:'الطابق',bell:'الجرس',noteD:'ملاحظة',aka:'كمان باسم',source:'المصادر',cancelled:'ملغية',range:'من لـ',
      favs:'أكتر شي بيطلبه',none:'ما في زباين.',loading:'عم حمّل الزباين …',err:'ما قدرت حمّل الزباين: ',
      platform:'زبون منصة: بياناته للتوصيل بس، مو للإعلانات.',own:'طلب منّا مباشرة (الموقع أو الكاشير).',
      raw:'العنوان مقروء من نص Lieferando القديم.',noMap:'الخريطة مو متوفرة.',overdue:'تأخّر',
      wd:['الأحد','الاتنين','التلاتا','الأربعا','الخميس','الجمعة','السبت']},
    en:{title:'Customers',search:'Search name, street or phone …',all:'All',REGULAR:'Regular',RETURNING:'Returning',NEW:'New',SLEEPING:'Not ordered in a while',CANCELLED_ONLY:'Cancelled only',
      allSrc:'All sources',sLast:'Last order',sOrders:'Most orders',sTotal:'Highest spend',sAvg:'Highest basket',
      cust:'{n} customers',rep:'<bdi>{p}%</bdi> come back',avg:'Avg {a} per order',since:'Data since {d}',
      orders:'Orders',total:'Spend',avgS:'Avg order',first:'First order',last:'Last order',gap:'Orders every',days:'{n} days',next:'Next expected',
      usual:'Usually orders',at:'{d} around {h}:00',phone:'Phone',floor:'Floor',bell:'Bell',noteD:'Note',aka:'Also as',source:'Sources',cancelled:'Cancelled',range:'Range',
      favs:'Favourite items',none:'No customers found.',loading:'Loading customers …',err:'Could not load customers: ',
      platform:'Platform customer: use the data for delivery only, not for marketing.',own:'Ordered directly from us (website/till).',
      raw:'Address read from old Lieferando text.',noMap:'Map not available.',overdue:'overdue',
      wd:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']}
  };
  const SRC={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',LOCO:'Loco (Sides)',LANCH:'Lanch',WEB:'Website',KASSE:'Kasse',DINE_IN:'Dine-in'};
  const SEGC={REGULAR:'#16a34a',RETURNING:'#d97706',NEW:'#0891b2',SLEEPING:'#8a8f98',CANCELLED_ONLY:'#dc2626'};
  const lang=window.NARA_LANG?NARA_LANG.get():'de';
  const L10=T[lang]||T.de;
  const t=(k,v)=>String(L10[k]??T.de[k]??k).replace(/\{(\w+)\}/g,(m,x)=>v&&v[x]!=null?v[x]:m);
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const eur=c=>(Number(c||0)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
  const dt=v=>{const d=new Date(v);return !v||isNaN(d)?'—':d.toLocaleDateString(lang==='en'?'en-GB':'de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})};
  const $=s=>document.querySelector(s);
  const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  document.title='NARA · '+t('title');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#q').placeholder=t('search');
  if(window.NARA_LANG)NARA_LANG.mountSwitcher(document.getElementById('langsw'),{buttonStyle:'min-width:34px;height:30px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff1a;color:#fff;font-weight:800;cursor:pointer'});

  let db=null,seg=store.get('nara-cust-seg','all'),sel=null,map=null,layer=null,fitted=false;
  const sorts={last:(a,b)=>(b.lastAt||'').localeCompare(a.lastAt||''),orders:(a,b)=>b.orders-a.orders||(b.lastAt||'').localeCompare(a.lastAt||''),total:(a,b)=>b.totalCents-a.totalCents,avg:(a,b)=>b.avgCents-a.avgCents};
  $('#sort').innerHTML=[['last','sLast'],['orders','sOrders'],['total','sTotal'],['avg','sAvg']].map(([v,k])=>'<option value="'+v+'">'+esc(t(k))+'</option>').join('');
  $('#sort').value=store.get('nara-cust-sort','last');

  function initMap(){
    if(!window.L){$('#map').innerHTML='<div class="empty">'+esc(t('noMap'))+'</div>';return}
    map=L.map('map').setView([51.2556,6.3936],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    L.marker([51.2556,6.3936],{icon:L.divIcon({className:'',html:'<div style="font-size:22px">🏠</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);
    layer=L.layerGroup().addTo(map);
  }
  const hasPos=c=>Number.isFinite(c.lat)&&Number.isFinite(c.lng)&&c.lat!==0;
  function filtered(){
    const q=$('#q').value.trim().toLowerCase(),src=$('#src').value;
    return db.customers.filter(c=>(seg==='all'||c.segment===seg)&&(!src||c.sources[src])&&(!q||[c.name,...(c.otherNames||[]),c.street+' '+c.house,c.postal,c.city,c.phone].join(' ').toLowerCase().includes(q))).sort(sorts[$('#sort').value]||sorts.last);
  }
  function card(c){
    const late=c.nextExpectedAt&&Date.parse(c.nextExpectedAt)<Date.now()&&c.segment!=='SLEEPING';
    return '<div class="cust'+(sel===c.id?' sel':'')+'" data-id="'+esc(c.id)+'" style="--c:'+(SEGC[c.segment]||'#ccc')+'">'+
      '<div class="top"><span class="nm">'+esc(c.name||'—')+'</span><span class="am">'+eur(c.totalCents)+'</span></div>'+
      '<div class="ad">'+esc([c.street,c.house].filter(Boolean).join(' '))+(c.postal?' · '+esc(c.postal):'')+'</div>'+
      '<div class="mt"><span class="badge b-'+esc(c.segment)+'">'+esc(t(c.segment))+'</span><span>🧾 '+c.orders+'</span><bdi>Ø '+eur(c.avgCents)+'</bdi><span>🕒 '+dt(c.lastAt)+(late?' · '+esc(t('overdue')):'')+'</span><span>'+esc(SRC[c.mainSource]||c.mainSource)+'</span></div></div>';
  }
  function render(){
    if(!db)return;
    const list=filtered();
    $('#list').innerHTML=list.length?list.slice(0,400).map(card).join(''):'<div class="empty">'+esc(t('none'))+'</div>';
    if(!layer)return;
    layer.clearLayers();const pts=[];
    for(const c of list)if(hasPos(c)){
      const r=Math.min(24,10+c.orders*3);
      const m=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:'<div class="dot" style="width:'+r+'px;height:'+r+'px;background:'+(SEGC[c.segment]||'#999')+'"></div>',iconSize:[r,r],iconAnchor:[r/2,r/2]})}).addTo(layer).bindTooltip(esc(c.name)+' · '+c.orders+'× · '+eur(c.totalCents));
      m.on('click',()=>show(c.id));pts.push([c.lat,c.lng]);
    }
    if(pts.length&&!fitted){map.fitBounds(pts,{padding:[30,30],maxZoom:14});fitted=true}
  }
  function show(id){
    const c=db.customers.find(x=>x.id===id);if(!c)return;sel=id;
    document.querySelectorAll('.cust.sel').forEach(e=>e.classList.remove('sel'));
    const el=document.querySelector('.cust[data-id="'+CSS.escape(id)+'"]');if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest'})}
    const kv=[];const add=(k,v)=>{if(v)kv.push('<span>'+esc(t(k))+'</span><span>'+v+'</span>')};
    add('phone',c.phone?'<a href="tel:'+esc(c.phone)+'" dir="ltr">'+esc(c.phone)+'</a>':'');
    add('floor',esc(c.floor));add('bell',esc(c.bell));add('noteD',esc(c.notes));
    add('aka',esc((c.otherNames||[]).join(', ')));
    add('first',dt(c.firstAt));add('last',dt(c.lastAt));
    if(c.gapDays)add('gap',esc(t('days',{n:String(c.gapDays).replace('.',',')})));
    if(c.nextExpectedAt&&c.segment!=='SLEEPING')add('next',dt(c.nextExpectedAt));
    if(c.usualWeekday!=null)add('usual',esc(t('at',{d:(L10.wd||T.de.wd)[c.usualWeekday],h:c.usualHour})));
    add('source',esc(Object.entries(c.sources||{}).map(([k,v])=>(SRC[k]||k)+' ×'+v).join(', ')));
    if(c.orders>1)add('range','<span dir="ltr">'+eur(c.minCents)+' – '+eur(c.maxCents)+'</span>');
    if(c.cancelled)add('cancelled',String(c.cancelled));
    $('#detail').innerHTML='<button class="x" aria-label="×">×</button><h2>'+esc(c.name||'—')+'</h2>'+
      '<div class="sub">'+esc([[c.street,c.house].filter(Boolean).join(' '),[c.postal,c.city].filter(Boolean).join(' ')].filter(Boolean).join(', '))+'</div>'+
      '<div style="margin-top:6px"><span class="badge b-'+esc(c.segment)+'">'+esc(t(c.segment))+'</span></div>'+
      '<div class="stats"><div class="stat"><b>'+c.orders+'</b><small>'+esc(t('orders'))+'</small></div><div class="stat"><b>'+eur(c.totalCents)+'</b><small>'+esc(t('total'))+'</small></div><div class="stat"><b>'+eur(c.avgCents)+'</b><small>'+esc(t('avgS'))+'</small></div></div>'+
      ((c.favourites||[]).length?'<h3>'+esc(t('favs'))+'</h3>'+c.favourites.map(f=>'<div class="fav"><span>'+esc(f.name)+'</span><b>×'+f.count+'</b></div>').join(''):'')+
      '<div class="kv">'+kv.join('')+'</div>'+
      '<div class="note '+(c.contactOk?'own':'pl')+'">'+esc(t(c.contactOk?'own':'platform'))+'</div>'+
      (c.fromRawText?'<div class="note">'+esc(t('raw'))+'</div>':'');
    $('#detail').style.display='block';
    $('#detail .x').onclick=()=>{$('#detail').style.display='none';sel=null;document.querySelectorAll('.cust.sel').forEach(e=>e.classList.remove('sel'))};
    if(map&&hasPos(c))map.setView([c.lat,c.lng],Math.max(map.getZoom(),15));
  }
  function header(){
    const s=db.stats;
    $('#s-cust').textContent='👥 '+t('cust',{n:s.customers});
    $('#s-rep').innerHTML='🔁 '+t('rep',{p:Number(s.repeatShare)||0});
    $('#s-avg').textContent='🧾 '+t('avg',{a:eur(s.avgCents)});
    $('#s-since').textContent=s.firstAt?t('since',{d:dt(s.firstAt)}):'';
    const counts={};for(const c of db.customers)counts[c.segment]=(counts[c.segment]||0)+1;
    if(seg!=='all'&&!counts[seg])seg='all';
    $('#segs').innerHTML=['all','REGULAR','RETURNING','NEW','SLEEPING','CANCELLED_ONLY'].filter(k=>k==='all'||counts[k]).map(k=>'<button class="seg'+(seg===k?' on':'')+'" data-seg="'+k+'">'+esc(t(k))+' '+(k==='all'?db.customers.length:counts[k])+'</button>').join('');
    const srcs={};for(const c of db.customers)for(const k in (c.sources||{}))srcs[k]=(srcs[k]||0)+1;
    const cur=$('#src').value;
    $('#src').innerHTML='<option value="">'+esc(t('allSrc'))+'</option>'+Object.entries(srcs).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<option value="'+esc(k)+'">'+esc(SRC[k]||k)+' ('+n+')</option>').join('');
    $('#src').value=cur;
  }
  async function load(){
    try{
      const r=await fetch('/api/customer-db',{credentials:'same-origin',cache:'no-store'});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||r.status);
      db=j;header();render();if(sel)show(sel);
    }catch(e){if(!db)$('#list').innerHTML='<div class="empty">'+esc(t('err')+e.message)+'</div>'}
  }
  $('#segs').onclick=e=>{const b=e.target.closest('[data-seg]');if(!b)return;seg=b.dataset.seg;store.set('nara-cust-seg',seg);header();render()};
  $('#list').onclick=e=>{const c=e.target.closest('.cust');if(c)show(c.dataset.id)};
  $('#q').oninput=render;$('#src').onchange=render;
  $('#sort').onchange=()=>{store.set('nara-cust-sort',$('#sort').value);render()};
  $('#list').innerHTML='<div class="empty">'+esc(t('loading'))+'</div>';
  initMap();load();setInterval(load,5*60000);
})();
</script>
</body>
</html>
