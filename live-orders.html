<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#1d2327;--mute:#6b7378;--line:#e7e3de;--brand:#ff6d00;--ok:#16884a;--warn:#e0a100;--late:#d1342f;--chip:#e9f4fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;background:#fff;box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:800;font-size:1.35rem;text-decoration:none}
.brand i{font-style:normal;font-size:1.5rem}
header .sp{flex:1}
.sync{color:var(--mute);font-size:.85rem}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}
.sync.off b{background:var(--late)}
header a.back{color:var(--brand);font-weight:800;text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px}
main{max-width:1320px;margin:0 auto;padding:22px 24px;display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border-radius:18px;box-shadow:0 1px 3px #0000000d}
.list{padding:18px}
.list h1{margin:0 0 12px;font-size:1.6rem}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools select,.tools input{min-width:0;flex:1;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{position:relative;flex:1;height:42px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button small{position:absolute;top:-8px;inset-inline-end:8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:.78rem;line-height:20px}
.cards{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 290px);overflow:auto;padding:2px}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:start;width:100%}
.card:hover{border-color:#cfc8c0}
.card.sel{border:2px solid var(--brand);padding:11px}
.card h3{margin:0;font-size:1rem;line-height:1.25}
.card p{margin:2px 0 0;color:var(--mute);font-size:.88rem}
.card .code{color:var(--ink);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.ring{position:relative;width:58px;height:58px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;line-height:1}
.ring span small{font-weight:600;font-size:.68rem;color:var(--mute);margin-top:2px}
.ring.big{width:74px;height:74px}.ring.big span{font-size:1.3rem}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.b-LIEFERANDO{background:#fff1e6;color:#d65a00}.b-UBER_EATS{background:#e6f6ec;color:#0b7a3b}.b-WOLT{background:#e6f4fb;color:#0a7cb2}.b-LANCH{background:#f1eafd;color:#6b3fc4}.b-LOCO{background:#fde8e8;color:#c21f1f}.b-NARA{background:#eceff1;color:#37474f}
.b-x{background:#fde8e8;color:#c21f1f}
.detail{padding:24px 26px;min-height:420px;display:flex;flex-direction:column}
.dh{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.35rem}
.dh .meta{color:var(--mute);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dh .sp{flex:1}
.cust{padding:16px 0;border-bottom:1px solid var(--line)}
.cust b{font-size:1.05rem}
.cust .row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;color:var(--ink)}
.cust a{color:var(--ink);text-decoration:none;font-weight:600}
.cust .muted{color:var(--mute)}
.note{margin-top:10px;padding:8px 12px;border-radius:10px;background:#fff6e0;color:#7a5200;font-weight:600}
.items{padding:16px 0;flex:1}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ih h3{margin:0;font-size:1.25rem}
.pay{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef6ef;color:var(--ok)}
.pay.cash{background:#fff1e6;color:#c24f00}
.cat{margin:16px 0 6px;font-weight:800;font-size:1.05rem}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:6px;padding:4px 0}
.it .q{font-weight:700}
.it .n{font-weight:600}
.it .p{font-variant-numeric:tabular-nums}
.opt{grid-column:2/4;color:var(--mute);font-size:.9rem}
.chip{grid-column:2/4;justify-self:start;margin-top:4px;padding:6px 12px;border-radius:10px;background:var(--chip);color:#164a63;font-size:.92rem}
.sum{border-top:1px solid var(--line);padding-top:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}
.sum .tot{color:var(--ink);font-weight:800;font-size:1.15rem}
.sum .net{color:#16a34a;font-weight:700;font-size:.92rem}
.acts{display:flex;justify-content:flex-end;gap:12px;padding-top:16px}
.acts button{height:52px;padding:0 26px;border-radius:999px;font-weight:800;font-size:1.05rem}
.acts .sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.acts .pri{background:var(--brand);border:0;color:#fff}
.acts .pri:disabled{opacity:.5}
.placeholder{margin:auto;color:var(--mute)}
#nara-print-sheet{display:none}
.stats{max-width:1320px;margin:18px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.stat{display:flex;flex-direction:column;gap:2px;min-width:132px;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid transparent;border-top:5px solid var(--pc,#999);text-align:start;box-shadow:0 1px 3px #0000000d}
.stat.on{border-color:var(--pc)}
.stat b{font-size:.85rem;color:var(--pc)}
.stat strong{font-size:1.5rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.82rem}
.stat.total{--pc:#1d2327;background:#1d2327;color:#fff}.stat.total b,.stat.total span{color:#ffffffb0}
.stat.rep{--pc:#1d2327;justify-content:center;align-items:center;font-weight:800;cursor:pointer}
.card{border-inline-start:6px solid var(--pc,#999)!important}
.badge{font-size:.8rem;padding:4px 11px}
#rep,#arc{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#rep[hidden],#arc[hidden]{display:none}
.arow{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;width:100%;text-align:start;background:#fff;border:0;border-bottom:1px solid #f0ece7;border-inline-start:4px solid var(--pc);padding:8px 10px;font:inherit;cursor:pointer}
.arow:hover{background:#faf7f3}.arow small{display:block;color:#7a7470}.arow.x{opacity:.55;text-decoration:line-through}
.arhint{color:#7a7470;font-size:.85rem;margin:0 0 10px}
.rcard{width:min(760px,100%);background:#fff;border-radius:18px;padding:22px 24px}
.rcard h2{margin:0 0 4px}.rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rhead .sp{flex:1}.rhead button,.rhead input{height:40px;border-radius:10px;border:1px solid var(--line);padding:0 14px;font:inherit;background:#fff}
.rhead .go{background:var(--ink);color:#fff;border:0;font-weight:700}
.rg{margin:16px 0 4px;padding:8px 12px;border-radius:10px;background:#f6f4f1;border-inline-start:6px solid var(--pc);display:flex;justify-content:space-between;font-weight:800}
.rt{width:100%;border-collapse:collapse;font-size:.9rem}.rt td{padding:5px 6px;border-bottom:1px solid #f0ece7}.rt td.n{text-align:end;font-variant-numeric:tabular-nums}.rt .tst{border:0;background:#f4f1ec;border-radius:6px;cursor:pointer;padding:0 4px}.rt tr.x td{color:#b00;text-decoration:line-through}
.asum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 12px;margin-bottom:8px;border-radius:10px;background:#f6f4f1;font-size:.9rem}
.rsvc{display:flex;justify-content:space-between;gap:12px;padding:2px 12px 6px;font-size:.85rem;color:#7a736c}
.rsum{margin-top:18px;border-top:2px solid var(--ink);padding-top:10px}.rsum div{display:flex;justify-content:space-between;padding:3px 0}.rsum .big{font-size:1.25rem;font-weight:800}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px}.cards{max-height:none}header{padding:0 14px}}
</style>

};
const lang=window.NARA_LANG?NARA_LANG.get():'de';
const t=k=>(T[lang]||T.de)[k]??T.de[k]??k;
const P=x=>{const v=String(x??'');return window.NARA_LANG&&/[؀-ۿ]/.test(v)?NARA_LANG.pick(v):v};
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
if(window.NARA_LANG)NARA_LANG.mountSwitcher($('#langsw'));
let orders=[],stage='PREPARE',selId=null,lastOk=0,arcSel=null;

const isLoco=o=>/loco/i.test(S(o.brand||o.brandName))||/^SIDES/i.test(S(o.source));
function plat(o){if(isLoco(o))return 'LOCO';const p=S(o.platform||o.source).toUpperCase();if(/LIEFERANDO/.test(p))return 'LIEFERANDO';if(/UBER/.test(p))return 'UBER_EATS';if(/WOLT/.test(p))return 'WOLT';if(/LANCH/.test(p))return 'LANCH';return 'NARA'}
const PC={LIEFERANDO:'#ff8000',UBER_EATS:'#06c167',WOLT:'#009de0',LANCH:'#7b4ddb',LOCO:'#d62828',NARA:'#37474f'};
let all=[],pays={};
const PL={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',WOLT:'Wolt',LANCH:'Lanch',LOCO:'Loco',NARA:'NARA'};
function badge(o){const p=plat(o);let t=PL[p];if(p==='LOCO'&&o.channel&&o.channel!=='SIDES')t+=' · '+(PL[o.channel]||o.portalName||'');return '<span class="badge b-'+p+'">'+esc(t)+'</span>'}
function stageOf(o){const st=S(o.status).toUpperCase();if(st==='CANCELLED')return 'DONE';const s=S(o.liveStage).toUpperCase();if(s==='DONE'||st==='COMPLETED')return 'DONE';if(s==='HANDOVER')return 'HANDOVER';return 'PREPARE'}
const cancelled=o=>S(o.status).toUpperCase()==='CANCELLED';
const code=o=>S(o.displayCode)||S(o.externalOrderCode)||S(o.id).slice(-6);
const D=o=>o.delivery||{};
const isDel=o=>S(o.type||o.orderType).toLowerCase().startsWith('deliv');
function street(o){const d=D(o),st=S(d.street),h=S(d.house||d.houseNumber);return (st&&h&&!new RegExp('\\s'+h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$').test(st)?st+' '+h:st)||S(d.address)}
function place(o){const d=D(o);return [S(d.postal||d.postalCode),S(d.city)].filter(Boolean).join(' ')}
function title(o){if(!isDel(o))return t('pickup');return [place(o),street(o)].filter(Boolean).join(', ')||t('delivery')}
function custName(o){return S(D(o).name)||S(o.customerName)||t('customer')}
function phone(o){return S(o.customerPhone)||S(D(o).phone)}
// يوم الشغل: من 5 الصبح لـ 5 الصبح (طلب الساعة 00:30 تابع لليوم اللي قبل)
const DAY_START_H=5;
const localDay=t=>{const d=new Date(t-DAY_START_H*3600000);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function when(o){const v=o.placedAt||o.createdAt||o.acceptedAt;const t=v?Date.parse(v):0;if(t)return t;const id=S(o.id).match(/1\d{12}/);return id?Number(id[0]):(Date.parse(o.completedAt||o.updatedAt||0)||0)}
function due(o){const v=o.promisedDueAt||o.dueAt||o.etaAt||o.requestedAt;return v?(Date.parse(v)||0):0}

function ring(o,big){
  const now=Date.now(),d=due(o),p=when(o);
  const size=big?74:58,r=big?32:25,c=2*Math.PI*r;
  if(!d||stageOf(o)==='DONE'){return '<div class="ring'+(big?' big':'')+'"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#e7e3de" stroke-width="5"/></svg><span>'+(stageOf(o)==='DONE'?(cancelled(o)?'✕':'✓'):'ASAP')+'</span></div>'}
  const left=Math.round((d-now)/60000),total=Math.max(1,(d-(p||d-45*60000))/60000),frac=Math.max(0,Math.min(1,left/total));
  const col=left<0?'var(--late)':left<10?'var(--warn)':'var(--ok)';
  return '<div class="ring'+(big?' big':'')+'"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#e7e3de" stroke-width="5"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*frac)+' '+c+'"/></svg><span style="color:'+(left<0?'var(--late)':'inherit')+'">'+Math.abs(left)+'<small>'+(left<0?t('minLate'):t('min'))+'</small></span></div>'
}

async function load(){
  try{
    const r=await fetch('/api/kasse-state',{cache:'no-store'});
    if(!r.ok)throw Error(r.status);
    const j=await r.json(),today=localDay(Date.now());
    all=j.orders||[];pays={};for(const p of j.payments||[])pays[p.id]=p;
    // طلبات التجربة اللي انلغت (NARA-Demo-Loeschen) ما بتطلع أبداً
    orders=all.filter(o=>plat(o)!=='NARA'&&!o.liveArchivedAt&&!(o.isTest&&cancelled(o))&&(localDay(when(o))===today||stageOf(o)!=='DONE'&&Date.now()-when(o)<3*3600000));
    // بعد تسكيرة اليوم (5 الصبح) كل طلبات امبارح بتروح عالأرشيف، حتى لو المنصة ما سكّرتها. بس طلب عمرو أقل من 3 ساعات بيضل.
    lastOk=Date.now();
  }catch(e){}
  render();
}

function visible(){
  const p=$('#plat').value,q=S($('#q').value).toLowerCase();
  return orders.filter(o=>(p==='ALL'||plat(o)===p)&&(!q||[code(o),custName(o),street(o),place(o),phone(o)].some(v=>v.toLowerCase().includes(q))));
}

function render(){
  renderStats();
  const vis=visible();
  for(const s of ['PREPARE','HANDOVER','DONE'])$('#n-'+s).textContent=vis.filter(o=>stageOf(o)===s).length;
  const list=vis.filter(o=>stageOf(o)===stage).sort((a,b)=>stage==='DONE'?when(b)-when(a):(due(a)||when(a))-(due(b)||when(b)));
  if(selId&&!orders.some(o=>String(o.id)===selId))selId=null;
  if(!selId&&list[0])selId=String(list[0].id);
  $('#cards').innerHTML=list.map(o=>'<button class="card'+(String(o.id)===selId?' sel':'')+'" style="--pc:'+PC[plat(o)]+'" data-id="'+esc(o.id)+'">'+ring(o)+'<div><h3>'+'<bdi>'+esc(title(o))+'</bdi>'+'</h3><p>'+'<bdi>'+esc(custName(o))+'</bdi>'+'</p><p>'+(o.asap===false||o.requestedAt?'🕒 '+new Date(due(o)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'ASAP')+' · <span class="code">#'+esc(code(o))+'</span></p></div><div>'+(cancelled(o)?'<span class="badge b-x">'+t('cancelled')+'</span>':badge(o))+'</div></button>').join('')||'<p class="empty">'+t('none')+'</p>';
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{selId=b.dataset.id;arcSel=null;render()});
  const sy=$('#sync');sy.classList.toggle('off',Date.now()-lastOk>20000);sy.querySelector('span').textContent=(Date.now()-lastOk>20000?t('offline'):t('live'))+' · '+new Date(lastOk||Date.now()).toLocaleTimeString('de-DE');
  renderDetail(arcSel||orders.find(o=>String(o.id)===selId));
}

function itemsHtml(o){
  const cart=(o.cart||[]).filter(i=>!/FEE|TIP/.test(S(i.kind).toUpperCase()));
  const groups=[];
  for(const i of cart){const c=S(i.category);let g=groups.find(x=>x.c===c);if(!g)groups.push(g={c,items:[]});g.items.push(i)}
  return groups.map(g=>(g.c?'<div class="cat">'+esc(P(g.c))+'</div>':'')+g.items.map(i=>{
    const q=Number(i.quantity)||1,tot=i.totalCents!=null?Number(i.totalCents):(Number(i.unitCents)||0)*q;
    const opts=(i.options||[]).map(x=>/[؀-ۿ]/.test(S(x.name))?P(S(x.name)):S(x.name).split(' / ')[0]).filter(n=>n&&!/^einzel$/i.test(n)&&!/^__/.test(n));
    const note=S(i.note||i.notes);
    const dc=Number(i.discountCents)||0;
    return '<div class="it"><span class="q">'+q+'</span><span class="n">'+esc(P(i.name))+'</span><span class="p">'+(dc?'<s style="color:#9a948e;font-weight:400">'+eur(tot)+'</s> <b style="color:#16a34a">'+eur(tot-dc)+'</b>':eur(tot))+'</span>'+(opts.length?'<span class="opt">+ '+opts.map(esc).join(', ')+'</span>':'')+(note?'<span class="chip">'+esc(note)+'</span>':'')+'</div>'}).join('')).join('');
}
function sumHtml(o){
  const cart=o.cart||[];
  const goods=cart.filter(i=>!/FEE|TIP/.test(S(i.kind).toUpperCase()));
  const itemDisc=goods.reduce((s,i)=>s+(Number(i.discountCents)||0),0);
  const sub=goods.reduce((s,i)=>s+(i.totalCents!=null?Number(i.totalCents):(Number(i.unitCents)||0)*(Number(i.quantity)||1)),0)-itemDisc;
  const rows=[[t('subtotal'),sub]];
  const f=o.fees||{};
  const fee=(Number(o.deliveryFeeCents)||0)||(typeof f.delivery==='number'?f.delivery:0)||cart.filter(i=>S(i.kind).toUpperCase()==='DELIVERY_FEE').reduce((s,i)=>s+(Number(i.unitCents)||0)*(Number(i.quantity)||1),0);
  if(fee)rows.push([t('fee'),fee]);
  for(const [k,l] of [['service',t('service')],['smallOrder',t('small')]])if(typeof f[k]==='number'&&f[k])rows.push([l,f[k]]);
  const disc=Math.max(0,(Number(o.discountsCents)||0)+(Number(o.discountCents)||0)+(Number(o.stampCents)||0)+(Number(o.discount&&o.discount.amountCents)||0)-itemDisc);
  if(disc)rows.push([t('disc'),-disc]);
  if(Number(o.tipCents))rows.push([t('tip'),Number(o.tipCents)]);
  const total=Number(o.totalCents)||Number(o.externalTotalCents)||rows.reduce((s,r)=>s+r[1],0);
  const svc=svcOf(o);
  return '<div class="sum">'+rows.map(r=>'<div><span>'+r[0]+'</span><span>'+eur(r[1])+'</span></div>').join('')+'<div class="tot"><span>'+t('total')+'</span><span>'+eur(total)+'</span></div>'+(svc?'<div class="net"><span>'+t('forYou')+' ('+t('platFee')+' − '+eur(svc)+')</span><span>'+eur(total-svc)+'</span></div>':'')+'</div>';
}

function renderDetail(o){
  const el=$('#detail');
  if(!o){el.innerHTML='<p class="placeholder">'+t('pick')+'</p>';return}
  const st=stageOf(o),cash=S(o.payment&&o.payment.method).toUpperCase()==='CASH';
  const n=(o.cart||[]).filter(i=>!/FEE|TIP/.test(S(i.kind).toUpperCase())).reduce((s,i)=>s+(Number(i.quantity)||1),0);
  const acc=Date.parse(o.acceptedAt||o.confirmedAt||o.placedAt||o.createdAt||0);
  const notes=[S(D(o).notes),S(o.remarks)].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
  const tel=phone(o);
  el.innerHTML=
    '<div class="dh">'+ring(o,true)+'<div><h2>'+'<bdi>'+esc(title(o))+'</bdi>'+'</h2><div class="meta">#'+esc(code(o))+' · '+(isDel(o)?t('delTag'):t('pickTag'))+' '+badge(o)+(cancelled(o)?' <span class="badge b-x">'+t('cancelled')+'</span>':'')+'</div></div><span class="sp"></span></div>'+
    '<div class="cust"><b>'+'<bdi>'+esc(custName(o))+'</bdi>'+'</b><div class="row">'+(tel?'<a href="tel:'+esc(tel.replace(/\s/g,''))+'">📞 <bdi dir="ltr">'+esc(tel)+'</bdi>'+'</a>':'')+(o.verificationCode?'<span><b>'+t('verify')+'</b> '+esc(o.verificationCode)+'</span>':'')+'</div>'+
      (acc?'<div class="row muted">'+t('ordered')+' '+new Date(acc).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+(due(o)?' · '+t('dueBy')+' '+new Date(due(o)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'')+'</div>':'')+
      notes.map(x=>'<div class="note">📝 '+esc(x)+'</div>').join('')+'</div>'+
    '<div class="items"><div class="ih"><h3>'+n+' '+t('items')+'</h3><span class="pay'+(cash?' cash':'')+'">'+(cash?t('cash')+' · '+eur(o.cashDueCents||o.totalCents):t('online'))+'</span></div>'+itemsHtml(o)+'</div>'+
    sumHtml(o)+
    '<div class="acts"><button class="sec" id="print">'+t('printOrder')+'</button>'+(cancelled(o)?'':st==='PREPARE'?'<button class="pri" id="adv" data-to="HANDOVER">'+t('toHandover')+'</button>':st==='HANDOVER'?'<button class="pri" id="adv" data-to="DONE">'+t('done')+'</button>':'<button class="sec" id="adv" data-to="HANDOVER">'+t('back')+'</button>')+'</div>';
  $('#print').onclick=()=>printOrder(o);
  const a=$('#adv');if(a)a.onclick=async()=>{a.disabled=true;try{const r=await fetch('/api/live-orders/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id,stage:a.dataset.to})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);Object.assign(o,j.order||{liveStage:a.dataset.to})}catch(e){a.disabled=false;a.textContent=t('err')+e.message;return}render()};
}

function printOrder(o){
  const R=window.NARA_RECEIPT,sheet=$('#nara-print-sheet');
  // السيرفر بيبعتها للطابعة المختارة (Epson لطلبات المنصات)، أو نافذة المتصفح
  if(R&&R.print){R.print(o,'customer');return}
  if(R&&R.ready){sheet.innerHTML=R.html(o,'customer')}
  else sheet.innerHTML='<div style="font:14px Arial"><b>#'+esc(code(o))+'</b><br>'+'<bdi>'+esc(title(o))+'</bdi>'+'<br>'+'<bdi>'+esc(custName(o))+'</bdi>'+'</div>';
  setTimeout(()=>window.print(),50);
}

document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{stage=b.dataset.st;selId=null;document.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#plat').onchange=()=>{selId=null;render()};$('#q').oninput=()=>{selId=null;render()};

// ── Zähler je Plattform + Tagesbericht ──
function paysOf(o){return (o.paymentIds&&o.paymentIds.length?o.paymentIds:[o.paymentId]).map(id=>id&&pays[id]).filter(Boolean)}
function totalOf(o){const ps=paysOf(o);if(ps.length)return ps.reduce((s,p)=>s+(Number(p.amountCents)||0),0);
  const t=Number(o.totalCents)||Number(o.externalTotalCents);if(t)return t;
  return (o.cart||[]).reduce((s,i)=>s+(i.totalCents!=null?Number(i.totalCents):(Number(i.unitCents)||0)*(Number(i.quantity)||1)),0)-(Number(o.discount&&o.discount.amountCents)||0)}
// رسوم الخدمة تبع المنصة (Lieferando 0,99 €): الزبون بيدفعها بس بتروح للمنصة، مو إلك
function svcOf(o){if(plat(o)==='NARA')return 0;const f=o.fees||{};return typeof f.service==='number'&&f.service>0?f.service:0}
const netOf=o=>totalOf(o)-svcOf(o);
function payOf(o){const ps=paysOf(o);const ms=new Set(ps.flatMap(p=>(p.paymentLines||[{method:p.method}]).map(l=>S(l.method).toUpperCase())));if(ms.size>1)return 'Mix';const p=ps[0];const m=S((p&&p.method)||(o.payment&&o.payment.method)||o.paymentMethod).toUpperCase();
  if(/MIXED/.test(m))return 'Mix';if(/CASH|BAR/.test(m))return 'Bar';if(/CARD|KARTE|EC/.test(m))return 'Karte';if(/ONLINE|PAID/.test(m))return 'Online';return plat(o)==='NARA'?(S(o.status).toUpperCase()==='COMPLETED'?'?':'offen'):'Online'}
// طلبات الكاشير: بتنحسب بس إذا اندفعت (مو المفتوحة)، وعلى يوم الدفع
const isKasse=o=>plat(o)==='NARA';
const dayOf=o=>isKasse(o)?(Date.parse(o.completedAt||0)||when(o)):when(o);
function dayOrders(day){return all.filter(o=>localDay(dayOf(o))===day&&!o.isTest&&!/^TEST/i.test(S(o.id))&&(!isKasse(o)||S(o.status).toUpperCase()==='COMPLETED'||cancelled(o)&&o.paidCents>0))}
const ORDER=['LIEFERANDO','UBER_EATS','WOLT','LANCH','LOCO','NARA'];
function groups(list){const g={};for(const o of list){(g[plat(o)]??=[]).push(o)}return ORDER.filter(k=>g[k]).map(k=>({k,list:g[k]}))}
function renderStats(){
  const list=dayOrders(localDay(Date.now())).filter(o=>!cancelled(o));
  const cur=$('#plat').value;
  const chips=groups(list).map(({k,list})=>{let sub=eur(list.reduce((s,o)=>s+netOf(o),0));
    if(k==='LOCO'){const c={};for(const o of list){const ch=PL[o.channel]||o.portalName||'Sides';c[ch]=(c[ch]||0)+1}sub+=' · '+Object.entries(c).map(([a,b])=>a+' '+b).join(' · ')}
    return '<button class="stat'+(cur===k?' on':'')+'" style="--pc:'+PC[k]+'" data-p="'+k+'"><b>'+(k==='NARA'?t('naraKasse'):PL[k])+'</b><strong>'+list.length+'</strong><span>'+esc(sub)+'</span></button>'});
  const tot=list.reduce((s,o)=>s+netOf(o),0);
  $('#stats').innerHTML=chips.join('')+'<div class="stat total"><b>'+t('today')+'</b><strong>'+list.length+'</strong><span>'+eur(tot)+'</span></div><button class="stat rep" id="openrep">📊 '+t('report')+'</button><button class="stat rep" id="openarc">🗂 '+t('archive')+'</button>';
  document.querySelectorAll('.stat[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(k==='NARA'){openRep();return}$('#plat').value=$('#plat').value===k?'ALL':k;selId=null;render()});
  $('#openrep').onclick=openRep;$('#openarc').onclick=openArc;
}
function reportHtml(day){
  const list=dayOrders(day).sort((a,b)=>when(a)-when(b));
  const ok=list.filter(o=>!cancelled(o));
  const by={Bar:0,Karte:0,Online:0};let rows='';
  for(const {k,list:L} of groups(list)){
    const good=L.filter(o=>!cancelled(o)),sum=good.reduce((s,o)=>s+totalOf(o),0),svc=good.reduce((s,o)=>s+svcOf(o),0);
    rows+='<div class="rg" style="--pc:'+PC[k]+'"><span>'+(k==='NARA'?t('naraKasse'):PL[k])+' · '+good.length+' '+t('orders')+'</span><span>'+eur(sum-svc)+'</span></div>'+(svc?'<div class="rsvc"><span>'+t('custPaid')+' '+eur(sum)+'</span><span>− '+t('platFee')+' '+eur(svc)+'</span></div>':'')+'<table class="rt">'+
      L.map(o=>{const amt=totalOf(o),pm=payOf(o);if(!cancelled(o)){const ps=paysOf(o);if(ps.length){for(const p of ps)for(const l of (p.paymentLines||[{method:p.method,amountCents:p.amountCents}])){const k=/CASH/i.test(l.method)?'Bar':/CARD/i.test(l.method)?'Karte':null;if(k)by[k]+=Number(l.amountCents)||0}}else if(by[pm]!=null)by[pm]+=amt}
        return '<tr'+(cancelled(o)?' class="x"':'')+'><td>'+(isMgr?'<button class="tst" data-tst="'+esc(o.id)+'" title="'+esc(t('markTest'))+'">🧪</button> ':'')+new Date(dayOf(o)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</td><td>#'+esc(code(o))+'</td><td>'+(k==='LOCO'?esc(PL[o.channel]||o.portalName||''):'')+' '+(isDel(o)?t('delivery'):S(o.type)==='pickup'?t('pickup'):t('local'))+'</td><td>'+t(pm)+'</td><td class="n">'+eur(amt)+'</td></tr>'}).join('')+'</table>';
  }
  const total=ok.reduce((s,o)=>s+totalOf(o),0),svcAll=ok.reduce((s,o)=>s+svcOf(o),0),canc=list.length-ok.length;
  return rows+'<div class="rsum"><div><span>'+t('orders')+'</span><span>'+ok.length+(canc?' (+'+canc+' '+t('plusCanc')+')':'')+'</span></div><div><span>'+t('Bar')+'</span><span>'+eur(by.Bar)+'</span></div><div><span>'+t('Karte')+'</span><span>'+eur(by.Karte)+'</span></div><div><span>'+t('onlinePlat')+'</span><span>'+eur(by.Online)+'</span></div>'+(svcAll?'<div><span>'+t('custPaid')+'</span><span>'+eur(total)+'</span></div><div><span>'+t('platFee')+'</span><span>− '+eur(svcAll)+'</span></div>':'')+'<div class="big"><span>'+t(svcAll?'forYou':'revenue')+'</span><span>'+eur(total-svcAll)+'</span></div></div>'||'<p>'+t('noOrders')+'</p>';
}
function isoDay(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function openRep(){const r=$('#rday');if(!r.value)r.value=isoDay(Date.now()-DAY_START_H*3600000);drawRep();$('#rep').hidden=false}
function drawRep(){const [y,m,d]=$('#rday').value.split('-').map(Number);$('#rbody').innerHTML=reportHtml(y+'-'+m+'-'+d)+(isMgr?'<p class="arhint">🧪 '+esc(t('testHint'))+'</p>':'');
  document.querySelectorAll('[data-tst]').forEach(b=>b.onclick=async()=>{if(!confirm(t('markTestQ')))return;b.disabled=true;try{const r=await fetch('/api/orders/mark-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:b.dataset.tst})});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||r.status);const o=all.find(x=>String(x.id)===b.dataset.tst);if(o)o.isTest=true;drawRep();render()}catch(e){b.disabled=false;alert(e.message)}})}
let isMgr=false;fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{const role=j&&(j.user||j).role;isMgr=['OWNER','MANAGER'].includes(role)}).catch(()=>{});
$('#rday').onchange=drawRep;$('#rclose').onclick=()=>{$('#rep').hidden=true};
$('#rprint').onclick=()=>{const sh=$('#nara-print-sheet');sh.innerHTML='<div style="font:12px Arial"><b style="font-size:16px">'+esc(t('report'))+' '+esc($('#rday').value)+'</b>'+$('#rbody').innerHTML+'</div>';setTimeout(()=>window.print(),50)};
// الأرشيف: كل طلبات المنصات بيوم شغل معيّن (بس للقراءة)
function openArc(){const a=$('#aday');if(!a.value)a.value=isoDay(Date.now()-DAY_START_H*3600000-86400000);drawArc();$('#arc').hidden=false}
function drawArc(){
  const [y,m,d]=$('#aday').value.split('-').map(Number),day=y+'-'+m+'-'+d;
  const list=all.filter(o=>plat(o)!=='NARA'&&!o.isTest&&localDay(when(o))===day).sort((a,b)=>when(a)-when(b));
  const ok=list.filter(o=>!cancelled(o)),paid=ok.reduce((s,o)=>s+totalOf(o),0),svc=ok.reduce((s,o)=>s+svcOf(o),0),cnt={};for(const o of ok)cnt[plat(o)]=(cnt[plat(o)]||0)+1;
  const head=list.length?'<div class="asum"><span>'+ok.length+' '+t('orders')+(list.length>ok.length?' (+'+(list.length-ok.length)+' '+t('plusCanc')+')':'')+' · '+Object.entries(cnt).map(([k,n])=>PL[k]+' '+n).join(' · ')+'</span><b>'+(svc?t('forYou')+' ':'')+eur(paid-svc)+'</b></div>':'';
  $('#abody').innerHTML=head+list.map(o=>'<button class="arow'+(cancelled(o)?' x':'')+'" style="--pc:'+PC[plat(o)]+'" data-aid="'+esc(o.id)+'"><span>'+new Date(when(o)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</span><span><b><bdi>'+esc(title(o))+'</bdi></b><small><bdi>'+esc(custName(o))+'</bdi> · #'+esc(code(o))+'</small></span>'+badge(o)+'<span>'+eur(totalOf(o))+'</span></button>').join('')||'<p>'+t('noOrders')+'</p>';
  document.querySelectorAll('[data-aid]').forEach(b=>b.onclick=()=>{arcSel=all.find(o=>String(o.id)===b.dataset.aid)||null;$('#arc').hidden=true;render()});
}
$('#aday').onchange=drawArc;$('#aclose').onclick=()=>{$('#arc').hidden=true};
load();setInterval(load,5000);setInterval(render,30000);
})();
</script>
