name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor-Projekt erzeugen
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Firebase-Konfiguration (FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub-Secret GOOGLE_SERVICES_JSON fehlt - ohne Firebase bekommt die APK keine Benachrichtigungen bei geschlossener App."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/android/app/google-services.json
      - name: APK bauen
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flamo-fahrer-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
