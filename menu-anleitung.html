<!doctype html>
<html lang="de" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Flamo · Menü-Anleitung</title>
<style>
@font-face{font-family:LalezarX;src:url(fonts/lalezar.woff) format('woff');font-weight:400}
@font-face{font-family:CairoX;src:url(fonts/cairo-600.woff) format('woff');font-weight:600}
@font-face{font-family:CairoX;src:url(fonts/cairo-700.woff) format('woff');font-weight:700}
@font-face{font-family:CairoX;src:url(fonts/cairo-800.woff) format('woff');font-weight:800}
:root{--paper:#fff4de;--ink:#2b2118;--orange:#ff7a1a;--yellow:#ffc233;--red:#ff4d2e;--green:#3fae5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:CairoX,system-ui,'Noto Color Emoji',sans-serif;font-weight:700;color:var(--ink);background:var(--paper);background-image:radial-gradient(#f3dcb2 2px,transparent 2.5px);background-size:34px 34px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:#fff}
.bar b{font-family:LalezarX;font-weight:400;font-size:24px;color:var(--orange)}
.bar .tools{display:flex;gap:6px;flex-wrap:wrap}
.bar button{font:inherit;font-size:15px;border:2px solid #fff6;background:#3a2c22;color:#fff;border-radius:12px;padding:6px 12px;cursor:pointer}
.bar button.on{background:var(--orange);border-color:var(--orange)}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 100px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e6cfa6;border:2px solid var(--ink);cursor:pointer}
.dots i.on{background:var(--orange)}
.card{position:relative;background:#fffaf0;border:4px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:16px}
.head{display:flex;align-items:center;gap:12px}
.badge{flex:none;width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:LalezarX;font-weight:400;font-size:40px;line-height:1.1}
h1{font-family:LalezarX;font-weight:400;font-size:clamp(28px,7.4vw,42px);line-height:1.2}
.art{margin:12px -6px 4px}
.art svg{display:block;width:100%;height:auto;direction:ltr}
.row{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.flamo{flex:none;width:96px;height:auto;filter:drop-shadow(4px 5px 0 rgba(43,33,24,.18))}
.body{font-size:19px;line-height:1.65;font-weight:700}
.body ol{margin:8px 0 0;padding-inline-start:24px}
.body li{margin:4px 0}
.tip{margin-top:12px;background:#e9f7ec;border:3px dashed var(--green);border-radius:18px;padding:12px 14px;color:#1f5e30;font-size:17px;line-height:1.55}
.pfoot{display:none}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--ink)}
.nav button{flex:1;font:inherit;font-size:20px;border:0;border-radius:16px;padding:12px;background:var(--orange);color:#fff;cursor:pointer}
.nav button[disabled]{opacity:.35}
.nav .cnt{align-self:center;color:#fff;font-size:16px;min-width:64px;text-align:center}
@page{size:A5;margin:8mm}
body.fn-on .bar{top:46px}
body.print{background:#fff;background-image:none;padding-top:0!important}
body.print .bar,body.print .nav,body.print .dots{display:none}
body.print .wrap{max-width:none;padding:0}
body.print .card{box-shadow:none;border-width:3px;page-break-after:always;break-after:page;margin:0;border-radius:18px}
body.print .card:last-child{page-break-after:auto;break-after:auto}
body.print .pfoot{display:block;margin-top:10px;text-align:center;font-size:12px;color:#8a6a4a;direction:ltr}
body.print .flamo{width:72px}
body.print .body{font-size:15px}
body.print .tip{font-size:13px}
body.print h1{font-size:30px}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

const STEPS=[
 {scene:'cover',clip:'wave',
  de:{t:'Die Speisekarte aufbauen',b:'Diese Anleitung zeigt Schritt für Schritt, wie du eine Kategorie, ein Produkt und Extras anlegst. Danach kann jeder ein neues Produkt oder ein Menü komplett allein einrichten.',tip:'Alles passiert auf der Seite “Speisekarte”. Jede Änderung wird im Verlauf gespeichert und lässt sich rückgängig machen.'},
  ar:{t:'كيف بتبني المنيو',b:'هالدليل بيشرحلك خطوة خطوة كيف بتضيف فئة ومنتج وإضافات. بعدها أي حدا بيقدر يجهّز منتج جديد أو منيو كامل لحاله.',tip:'كل شي بيصير بصفحة «المنيو». كل تغيير بينحفظ بسجل التغييرات وبتقدر ترجّعه.'},
  en:{t:'Building the menu',b:'This guide shows step by step how to create a category, a product and its extras. After that, anyone can set up a new product or a full menu on their own.',tip:'Everything happens on the “Menu” page. Every change is saved in the history and can be undone.'}},
 {scene:'overview',clip:'present',
  de:{t:'Die Idee: Kategorie → Produkt → Listen',b:'Eine Kategorie enthält Produkte. Ein Produkt bekommt Listen mit Extras. Es gibt nur zwei Extra-Listen: “Ihre Extras” (alles, was IN den Burger kommt) und “Dips” (extra Becher). Dazu kommen bei Burgern “Ihr Getränk” und “Ihre Sauce” für das Menü.',tip:'Die Listen werden einmal gepflegt und gelten für alle Produkte, die sie benutzen. Du legst für ein neues Produkt keine neue Liste an, du verknüpfst nur.'},
  ar:{t:'الفكرة: فئة ← منتج ← قوائم',b:'الفئة فيها منتجات. المنتج بنربطلو قوائم إضافات. في بس قائمتين للإضافات: «Ihre Extras» (كل شي بينحط جوا البرغر) و«Dips» (علبة منفصلة). وللبرغر كمان «Ihr Getränk» و«Ihre Sauce» للمنيو.',tip:'القوائم بتنعدّل مرة وحدة وبتنطبق على كل المنتجات اللي مربوطة فيها. للمنتج الجديد ما بتعمل قائمة جديدة، بس بتربطه بالموجودة.'},
  en:{t:'The idea: category → product → lists',b:'A category holds products. A product gets lists of extras. There are only two extra lists: “Ihre Extras” (everything that goes IN the burger) and “Dips” (a separate cup). Burgers also get “Ihr Getränk” and “Ihre Sauce” for the menu.',tip:'Each list is maintained once and applies to every product that uses it. For a new product you do not create a new list, you just link it.'}},
 {scene:'menupage',clip:'point',
  de:{t:'Die Seite “Speisekarte” öffnen',b:'Links stehen die Kategorien, rechts die Produkte der gewählten Kategorie. ① “Neue Kategorie”, ② “Neues Produkt”, ③ Suche. Ganz oben rechts findest du “Optionen & Extras” (die Bibliothek) und “Verlauf”.',tip:'Diese Seite ist nur für Chef und Manager. Die Kasse selbst kann nichts am Menü ändern.'},
  ar:{t:'افتح صفحة «المنيو»',b:'عاليسار الفئات، وعاليمين منتجات الفئة المختارة. ① «فئة جديدة»، ② «منتج جديد»، ③ البحث. فوق ع الزاوية بتلاقي «الخيارات والإضافات» (المكتبة) و«سجل التغييرات».',tip:'هالصفحة للمدير والمانجر بس. الكاشير نفسه ما بيقدر يعدّل المنيو.'},
  en:{t:'Open the “Menu” page',b:'Categories are on the left, the products of the selected category on the right. ① “New category”, ② “New product”, ③ search. At the top right you find “Options & extras” (the library) and “History”.',tip:'This page is for owner and managers only. The till itself cannot change the menu.'}},
 {scene:'catdlg',clip:'guide',
  de:{t:'Szenario 1: Neue Kategorie',b:'Tippe auf “Neue Kategorie”, schreibe den Namen, wähle die Sortierung (kleine Zahl = weiter oben) und lass “Aktiv” eingeschaltet. Dann “Speichern”.',tip:'Achtung beim Namen: Enthält er Wörter wie Dessert, Getränk/Drink, Special, Bucket, Bundle, Angebot, Kaffee, Tee, Wasser, Cola, Bier oder Wein, bietet die Kasse für diese Produkte KEIN “Als Menü” an.'},
  ar:{t:'سيناريو 1: فئة جديدة',b:'اضغط «فئة جديدة»، اكتب الاسم، حدّد الترتيب (رقم صغير = أعلى) واترك «فعّال» مفعّل. بعدين «حفظ».',tip:'انتبه للاسم: إذا فيه كلمات متل Dessert أو Getränk/Drink أو Special أو Bucket أو Bundle أو Angebot أو Kaffee أو Tee أو Wasser أو Cola أو Bier أو Wein، الكاشير ما بيعرض «منيو» لمنتجات هالفئة.'},
  en:{t:'Scenario 1: A new category',b:'Tap “New category”, type the name, set the sort order (small number = higher up) and keep “Active” on. Then “Save”.',tip:'Careful with the name: if it contains words like Dessert, Getränk/Drink, Special, Bucket, Bundle, Angebot, Kaffee, Tee, Wasser, Cola, Bier or Wein, the till will NOT offer “As menu” for its products.'}},
 {scene:'simple',clip:'talk',
  de:{t:'Szenario 2: Einfaches Produkt (z. B. Getränk)',b:'Wähle die Kategorie und tippe auf “Neues Produkt”. Fülle Name, Kategorie und Verkaufspreis aus (rot markiert = Pflicht). Beschreibung ist optional. “Speichern” – fertig. Ohne Haken bei Extras hat das Produkt keine Optionen.',tip:'Der Preis wird mit Komma oder Punkt geschrieben, zum Beispiel 2,50.'},
  ar:{t:'سيناريو 2: منتج بسيط (مثل مشروب)',b:'اختار الفئة واضغط «منتج جديد». عبّي الاسم والفئة وسعر البيع (المعلّم بالأحمر إجباري). الوصف اختياري. «حفظ» وخلص. إذا ما حطيت علامة عالإضافات بيكون المنتج بدون خيارات.',tip:'اكتب السعر بفاصلة أو نقطة، مثلاً 2,50.'},
  en:{t:'Scenario 2: A simple product (e.g. a drink)',b:'Pick the category and tap “New product”. Fill in name, category and sales price (red = required). The description is optional. “Save” – done. With no ticks under extras, the product has no options.',tip:'Write the price with a comma or a dot, for example 2.50.'}},
 {scene:'copy',clip:'present',
  de:{t:'Szenario 3: Neuer Burger durch Kopieren (empfohlen)',b:'① Bei einem ähnlichen Burger auf “Kopieren” tippen. ② Neuen Namen schreiben. ③ Preis anpassen. “Speichern”. Alle Listen (Extras, Dips, Getränk, Sauce) sind schon verknüpft.',tip:'Das ist der schnellste und sicherste Weg: nichts wird vergessen, und die Preise der Extras stimmen automatisch.'},
  ar:{t:'سيناريو 3: برغر جديد بالنسخ (الأفضل)',b:'① عند برغر شبيه اضغط «نسخ». ② اكتب الاسم الجديد. ③ عدّل السعر. «حفظ». كل القوائم (Extras وDips ومشروب وصوص) بتكون مربوطة جاهزة.',tip:'هي أسرع وأضمن طريقة: ما بينسى شي، وأسعار الإضافات صح لحالها.'},
  en:{t:'Scenario 3: A new burger by copying (recommended)',b:'① Tap “Copy” on a similar burger. ② Type the new name. ③ Adjust the price. “Save”. All lists (extras, dips, drink, sauce) are already linked.',tip:'This is the fastest and safest way: nothing gets forgotten, and the extra prices are right automatically.'}},
 {scene:'groups',clip:'guide',
  de:{t:'Szenario 4: Produkt von Grund auf mit Extras',b:'Öffne das Produkt und scrolle zu “Optionen & Extras dieses Produkts”. Setze den Haken bei den Listen, die gelten sollen: Burger = Ihre Extras + Dips + Ihr Getränk + Ihre Sauce. Wings/Fingerfood = nur Dips. Getränke = keine. Über “Gruppe hinzufügen …” kommen weitere Listen dazu.',tip:'Reihenfolge: Die Listen erscheinen in der Kasse in dieser Reihenfolge. Name der Listen nicht ändern, die Kasse nutzt die Namen für ihre Texte (der Name ist gesperrt).'},
  ar:{t:'سيناريو 4: منتج من الصفر مع الإضافات',b:'افتح المنتج وانزل لـ «خيارات وإضافات هالمنتج». حط علامة عالقوائم اللي بدك ياها: برغر = Ihre Extras + Dips + Ihr Getränk + Ihre Sauce. وينغز/فينغر فود = Dips بس. مشروبات = ولا وحدة. من «زيد مجموعة …» بتضيف قوائم تانية.',tip:'الترتيب: القوائم بتظهر بالكاشير بنفس الترتيب. لا تغيّر أسماء القوائم، الكاشير بيستعملها بالنصوص (الاسم مقفول).'},
  en:{t:'Scenario 4: A product from scratch with extras',b:'Open the product and scroll to “Options & extras of this product”. Tick the lists that should apply: burger = Ihre Extras + Dips + Ihr Getränk + Ihre Sauce. Wings/finger food = Dips only. Drinks = none. “Add a group …” adds more lists.',tip:'Order: the lists appear in the till in this order. Do not rename the lists, the till uses the names for its labels (the name is locked).'}},
 {scene:'rule',clip:'point',
  de:{t:'Die Preisregel für Saucen',b:'Sauce IM Burger, Sandwich, Taco oder Hot Dog (Liste “Ihre Extras”) = 0,99 €. Sauce als extra Becher (Liste “Dips”) = 1,49 €. Mayonnaise und Ketchup kosten immer 0,49 €. Alle anderen Extras (Fleisch, Käse, Bacon …) behalten ihren eigenen Preis.',tip:'Im Menü sind die Sauce-Auswahl und das Getränk schon im Preis. Mehr Saucen gibt es dann aus “Dips`.'.replace('`','”')},
  ar:{t:'قاعدة أسعار الصوصات',b:'الصوص جوا البرغر أو الساندويش أو التاكو أو الهوت دوغ (قائمة «Ihre Extras») = 0,99 €. الصوص بعلبة منفصلة (قائمة «Dips») = 1,49 €. المايونيز والكاتشب دايماً 0,49 €. باقي الإضافات (لحم، جبنة، بيكون …) بتضل بسعرها.',tip:'بالمنيو اختيار الصوص والمشروب محسوبين بالسعر. الصوصات الزيادة بتاخدها من «Dips».'},
  en:{t:'The sauce price rule',b:'Sauce IN the burger, sandwich, taco or hot dog (list “Ihre Extras”) = €0.99. Sauce as a separate cup (list “Dips”) = €1.49. Mayonnaise and ketchup are always €0.49. All other extras (meat, cheese, bacon …) keep their own price.',tip:'In a menu the sauce choice and the drink are already in the price. Extra sauces come from “Dips”.'}},
 {scene:'menu',clip:'talk',
  de:{t:'Szenario 5: Als Menü verkaufen',b:'Ein Burger mit den Listen “Ihr Getränk” und “Ihre Sauce” kann an der Kasse “Als Menü” verkauft werden. Das Getränk und die freie Sauce sind Pflicht. Weitere Saucen kommen aus “Dips` (1,49 €). Der Menü-Aufpreis ist eine allgemeine Einstellung (Standard 4,50 €).'.replace('`','”'),tip:'Kein “Als Menü” sichtbar? Prüfe den Kategorienamen (Szenario 1) und ob die Listen “Ihr Getränk” und “Ihre Sauce” am Produkt angehakt sind.'},
  ar:{t:'سيناريو 5: بيع المنتج كمنيو',b:'البرغر اللي عليه قائمتين «Ihr Getränk» و«Ihre Sauce» بينباع بالكاشير «Als Menü». المشروب والصوص المجاني إجباريين. الصوصات الزيادة من «Dips» (1,49 €). زيادة المنيو إعداد عام (الأساسي 4,50 €).',tip:'ما ظهر خيار المنيو؟ شوف اسم الفئة (سيناريو 1) وتأكد إنو قائمتي «Ihr Getränk» و«Ihre Sauce» معلّمين عالمنتج.'},
  en:{t:'Scenario 5: Selling it as a menu',b:'A burger with the lists “Ihr Getränk” and “Ihre Sauce” can be sold “As menu” at the till. The drink and the free sauce are required. More sauces come from “Dips” (€1.49). The menu surcharge is a general setting (default €4.50).',tip:'No “As menu” visible? Check the category name (scenario 1) and that “Ihr Getränk” and “Ihre Sauce” are ticked on the product.'}},
 {scene:'exclude',clip:'check',
  de:{t:'Szenario 6: Ein Extra für ein Produkt ausschließen',b:'Beim Produkt die Liste mit dem Pfeil aufklappen und den Haken beim Eintrag entfernen. Das gilt nur für dieses Produkt, die Liste selbst bleibt für alle anderen unverändert.',tip:'Beispiel: “Extra Patty” beim Veggie Burger ausschließen, ohne es bei den anderen Burgern zu ändern.'},
  ar:{t:'سيناريو 6: استثناء إضافة لمنتج واحد',b:'عند المنتج افتح القائمة بالسهم وشيل العلامة عن الخيار. هيك بينطبق عهالمنتج بس، والقائمة نفسها بتضل متل ما هي لباقي المنتجات.',tip:'مثال: استثني «Extra Patty» من الفيجي برغر بدون ما تغيّر شي عند باقي البرغر.'},
  en:{t:'Scenario 6: Exclude one extra for one product',b:'On the product, expand the list with the arrow and untick the entry. This applies to this product only; the list itself stays unchanged for all others.',tip:'Example: exclude “Extra Patty” on the veggie burger without changing the other burgers.'}},
 {scene:'library',clip:'present',
  de:{t:'Die Bibliothek: Preise und Listen ändern',b:'Oben rechts auf “Optionen & Extras” tippen. Links die Liste wählen, rechts stehen die Einträge. ① Einen Eintrag ändern oder ➕ Eintrag hinzufügen. ② Preis ändern. Mit “Speichern” gilt es sofort für alle Produkte, die die Liste benutzen.',tip:'Preismodus je Eintrag: “Katalogpreis” (gilt überall gleich), “Gratis” oder “Eigener Preis” (nur in dieser Liste, z. B. 0,99 € in “Ihre Extras”).'},
  ar:{t:'المكتبة: تغيير الأسعار والقوائم',b:'فوق ع اليمين اضغط «الخيارات والإضافات». اختار القائمة عاليسار، وعاليمين الخيارات. ① عدّل خيار أو ➕ خيار جديد. ② غيّر السعر. مع «حفظ» بينطبق فوراً عكل المنتجات اللي بتستعمل القائمة.',tip:'نمط السعر لكل خيار: «سعر الكتالوج» (واحد بكل مكان) أو «مجاني» أو «سعر خاص» (بهالقائمة بس، مثلاً 0,99 € بـ Ihre Extras).'},
  en:{t:'The library: changing prices and lists',b:'Tap “Options & extras” at the top right. Pick the list on the left, the entries are on the right. ① Edit an entry or add ➕ Item. ② Change the price. With “Save” it applies immediately to all products using the list.',tip:'Price mode per entry: “Catalog price” (same everywhere), “Free” or “Own price” (this list only, e.g. €0.99 in “Ihre Extras”).'}},
 {scene:'newsauce',clip:'guide',
  de:{t:'Szenario 7: Eine neue Sauce hinzufügen',b:'Öffne die Bibliothek. In “Dips” einen Eintrag hinzufügen (Name + Katalogpreis 1,49 €). Dann in “Ihre Extras” denselben Namen mit “Eigener Preis” 0,99 € eintragen. Mayo/Ketchup-Art: 0,49 € in beiden. Soll sie im Menü gratis wählbar sein, trage sie auch in “Ihre Sauce” ein (Gratis).',tip:'Schreibe den Namen in beiden Listen gleich. Dann erkennt das System, dass es dieselbe Sauce ist, und ein späterer Preiswechsel gilt für beide.'},
  ar:{t:'سيناريو 7: إضافة صوص جديد',b:'افتح المكتبة. بـ «Dips» زيد خيار (اسم + سعر الكتالوج 1,49 €). بعدين بـ «Ihre Extras» اكتب نفس الاسم بنمط «سعر خاص» 0,99 €. إذا مايونيز/كاتشب: 0,49 € بالاتنين. وإذا بدك الصوص يكون مجاني بالمنيو، زيده كمان بـ «Ihre Sauce» (مجاني).',tip:'اكتب الاسم نفسه بالقائمتين. هيك النظام بيعرف إنو نفس الصوص، وأي تغيير سعر بعدين بينطبق عالاتنين.'},
  en:{t:'Scenario 7: Adding a new sauce',b:'Open the library. In “Dips” add an entry (name + catalog price €1.49). Then in “Ihre Extras” add the same name with “Own price” €0.99. For mayo/ketchup type: €0.49 in both. If it should be a free menu choice, also add it to “Ihre Sauce” (Free).',tip:'Write the name exactly the same in both lists. The system then knows it is the same sauce, and a later price change applies to both.'}},
 {scene:'catalog',clip:'point',
  de:{t:'Szenario 8: Preise überall vereinheitlichen',b:'Im Tab “Katalog” steht jeder Eintrag nur einmal. Siehst du ⚠️, hat der Eintrag in manchen Listen einen eigenen Preis. Tippe auf ⚠️, um alle auf den Katalogpreis zu setzen, oder lasse den Eigenen Preis bewusst stehen (z. B. 0,99 € in “Ihre Extras”).',tip:'Gewollte Unterschiede sind normal: Sauce im Burger 0,99 €, als Dip 1,49 €. Das ⚠️ ist nur ein Hinweis zum Prüfen.'},
  ar:{t:'سيناريو 8: توحيد الأسعار بكل مكان',b:'بتبويب «الكتالوج» كل خيار بينذكر مرة وحدة. إذا شفت ⚠️ يعني الخيار إلو سعر خاص ببعض القوائم. اضغط ⚠️ لتوحّد الكل على سعر الكتالوج، أو اترك السعر الخاص عن قصد (مثلاً 0,99 € بـ Ihre Extras).',tip:'الفروقات المقصودة عادية: صوص جوا البرغر 0,99 € وكديب 1,49 €. الـ ⚠️ مجرد تنبيه للمراجعة.'},
  en:{t:'Scenario 8: Unify prices everywhere',b:'In the “Catalog” tab every entry appears only once. If you see ⚠️, the entry has its own price in some lists. Tap ⚠️ to set all to the catalog price, or keep the own price on purpose (e.g. €0.99 in “Ihre Extras”).',tip:'Intended differences are normal: sauce in the burger €0.99, as a dip €1.49. The ⚠️ is only a hint to check.'}},
 {scene:'soldout',clip:'sit',
  de:{t:'Szenario 9: Etwas ist ausverkauft',b:'In der Bibliothek beim Eintrag “nur heute aus” anhaken: Er verschwindet für heute und ist morgen automatisch wieder da. Nimmst du den Haken bei “verfügbar` weg, bleibt er ausgeblendet, bis du ihn wieder setzt.'.replace('`','”'),tip:'Das wirkt an der Kasse und im Online-Shop für alle Produkte, die den Eintrag benutzen.'},
  ar:{t:'سيناريو 9: صنف خلص',b:'بالمكتبة علّم «نفد اليوم بس» عند الخيار: بيختفي لليوم وبكرا بيرجع لحالو. وإذا شلت علامة «متوفر» بيضل مخفي لحد ما ترجّعها.',tip:'بيأثر بالكاشير وبالمتجر الأونلاين عكل المنتجات اللي بتستعمل الخيار.'},
  en:{t:'Scenario 9: Something is sold out',b:'In the library tick “out today only” on the entry: it disappears for today and is back tomorrow by itself. If you untick “available”, it stays hidden until you tick it again.',tip:'It applies at the till and in the online shop for every product using the entry.'}},

/* ---------- App ---------- */
const $=s=>document.querySelector(s);
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
const dig=(n,L)=>L==='ar'?String(n).replace(/\d/g,d=>AR_DIG[d]):String(n);
const params=new URLSearchParams(location.search);
const printLang=['de','ar','en'].includes(params.get('print'))?params.get('print'):null;
let lang=printLang||(()=>{try{const a=localStorage.getItem('flamo-guide-lang')||localStorage.getItem('nara-kasse-language');if(['de','ar','en'].includes(a))return a}catch(e){}return 'de'})();
let cur=Math.max(0,Math.min(STEPS.length-1,(parseInt(location.hash.slice(1),10)||1)-1));

function card(s,n){
 const d=s[lang];
 return `<article class="card" data-n="${n}"><div class="head"><div class="badge">${dig(n+1,lang)}</div><h1>${d.t}</h1></div>
 <div class="art">${SC[s.scene](lang,X[lang])}</div>
 <div class="row"><img class="flamo" src="web-prototype/c/flamo-${s.clip}.webp" alt="" ${printLang?'':'loading="lazy"'}><div class="body">${d.b}${d.list?'<ol>'+d.list.map(l=>`<li>${l}</li>`).join('')+'</ol>':''}</div></div>
 ${d.tip?`<div class="tip">💡 ${d.tip}</div>`:''}
 <div class="pfoot">Flamo · ${UI.de.doc} · v${VER} · ${DATE} · ${n+1}/${STEPS.length}</div></article>`;
}
function render(){
 const rtl=lang==='ar';
 document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
 document.title='Flamo · '+UI[lang].title;
 const u=UI[lang];
 const bar=`<div class="bar"><b>Flamo · ${u.title}</b><div class="tools">${LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===lang?'on':''}">${n}</button>`).join('')}<button data-pdf="1">${u.pdf}</button></div></div>`;
 if(printLang){$('#app').innerHTML=`<div class="wrap">${STEPS.map(card).join('')}</div>`;document.body.classList.add('print');return}
 const arrow=rtl?['▶','◀']:['◀','▶'];
 $('#app').innerHTML=bar+`<div class="wrap"><div class="dots">${STEPS.map((_,i)=>`<i data-i="${i}" class="${i===cur?'on':''}"></i>`).join('')}</div>${card(STEPS[cur],cur)}</div>
 <div class="nav"><button data-go="-1" ${cur===0?'disabled':''}>${arrow[0]} ${u.prev}</button><div class="cnt">${dig(cur+1,lang)} / ${dig(STEPS.length,lang)}</div><button data-go="1" ${cur===STEPS.length-1?'disabled':''}>${u.next} ${arrow[1]}</button></div>`;
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));history.replaceState(null,'','#'+(cur+1));render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('flamo-guide-lang',lang)}catch(_){}render();return}
 if(e.target.closest('[data-pdf]')){window.open(location.pathname+'?print='+lang,'_blank');return}
 const g=e.target.closest('[data-go]');if(g){go(cur+Number(g.dataset.go));return}
 const d=e.target.closest('[data-i]');if(d)go(Number(d.dataset.i));
});
document.addEventListener('keydown',e=>{if(printLang)return;const rtl=lang==='ar';if(e.key==='ArrowRight')go(cur+(rtl?-1:1));if(e.key==='ArrowLeft')go(cur+(rtl?1:-1))});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||printLang)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<60)return;const rtl=lang==='ar';go(cur+((dx<0)!==rtl?1:-1))},{passive:true});
render();
if(printLang){
 const imgs=[...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}));
 Promise.all([document.fonts.ready,...imgs]).then(()=>setTimeout(()=>window.print(),500));
}
</script>
