<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · شاشة المطبخ</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#14213d}.bar{padding:18px;background:#14213d;color:#fff;display:flex;justify-content:space-between;align-items:center}.bar h1{margin:0;font-size:24px}.muted{color:#697586}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding:16px}.order{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 14px #0001;border-top:6px solid #95a4b8}.order.start{border-top-color:#ef4444}.order.soon{border-top-color:#f59e0b}.order.ready{border-top-color:#16a34a}.order h2{margin:0 0 8px}.items{border-top:1px solid #e5e7eb;padding-top:8px}.item{padding:5px 0}.meta{font-size:14px;line-height:1.7}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:11px;border:0;border-radius:9px;background:#c9361e;color:#fff;font-weight:bold}.actions button.secondary{background:#e5e7eb;color:#14213d}.empty{padding:40px;text-align:center}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:13px}</style></head><body><header class="bar"><h1>NARA · شاشة المطبخ</h1><span id="clock"></span></header><main><p id="status" class="muted" style="padding:0 16px"></p><section id="board" class="board"></section></main><script>(async()=>{const board=document.querySelector('#board'),status=document.querySelector('#status'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=c=>`${(Number(c||0)/100).toFixed(2)} €`;const priority=o=>{const age=Math.max(0,(Date.now()-Date.parse(o.createdAt||Date.now()))/60000),left=Math.max(0,Number(o.preparationMinutes||20)-age),eta=Number(o.delivery?.driverEtaMinutes||10);return left<=eta?'start':left<=eta+10?'soon':''};async function setStatus(id,kitchenStatus){const r=await fetch('/api/kitchen/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,kitchenStatus})});if(!r.ok){const j=await r.json();throw Error(j.error||'تعذر التحديث')}await load()}async function load(){try{const r=await fetch('/api/kitchen/orders',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error();const orders=j.orders||[];orders.sort((a,b)=>({start:0,soon:1,'':2}[priority(a)]-({start:0,soon:1,'':2}[priority(b)])));board.innerHTML=orders.length?orders.map(o=>{const p=priority(o),d=o.delivery||{};return `<article class="order ${p} ${o.kitchenStatus==='READY'?'ready':''}"><h2>${esc(o.displayCode)} <span class="badge">${esc(o.kitchenStatus)}</span></h2><div class="meta">${esc(o.type||'طلب')} · ${esc(d.name||'بدون اسم')}<br>${esc(d.address||d.city||'بدون عنوان')}<br>التحضير: ${esc(o.preparationMinutes||20)} دقيقة · ${money((o.cart||[]).reduce((s,x)=>s+Number(x.unitCents||0)*Number(x.quantity||0),0))}</div><div class="items">${(o.cart||[]).map(x=>`<div class="item">${esc(x.name||'صنف')} × ${Number(x.quantity||1)}</div>`).join('')}</div><div class="actions">${o.kitchenStatus==='NEW'?`<button data-id="${esc(o.id)}" data-state="PREPARING">ابدأ التحضير</button>`:''}${o.kitchenStatus==='PREPARING'?`<button data-id="${esc(o.id)}" data-state="READY">جاهز</button>`:''}${o.kitchenStatus==='READY'?`<button class="secondary" data-id="${esc(o.id)}" data-state="PICKED_UP">تم الاستلام</button>`:''}</div></article>`}).join(''):'<div class="empty">لا توجد طلبات حالياً</div>';status.textContent=`آخر تحديث: ${new Date().toLocaleTimeString('ar-DE')} · الطلبات: ${orders.length}`}catch(e){status.textContent='تعذر الاتصال بالسيرفر؛ تأكد أنه يعمل.'}}board.onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;try{await setStatus(b.dataset.id,b.dataset.state)}catch(err){status.textContent=err.message}};setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ar-DE'),1000);await load();setInterval(load,10000)})()</script></body></html>
