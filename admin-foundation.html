<!doctype html><html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flamo · Menüverwaltung</title><link rel="stylesheet" href="admin-foundation.css"><link rel="stylesheet" href="nara-shell.css"></head><body>
<header class="top"><span class="logo">🍔</span><h1 data-t="title"></h1><span class="sp"></span><div class="top-actions"><button type="button" id="open-hist" class="btn" data-t="histBtn"></button><button type="button" id="open-lib" class="btn" data-t="libBtn"></button><button type="button" id="bulk-price" class="btn" data-t="bulk"></button><button type="button" id="new-product" class="btn pri" data-t="newProd"></button></div></header>

<dialog id="bulk-dialog"><form method="dialog" id="bulk-form"><h2 data-t="bulkTitle"></h2><div class="two"><label><span data-t="bulkScope"></span><select name="scope"><option value="cat" data-t="scopeCat"></option><option value="shown" data-t="scopeShown"></option><option value="all" data-t="scopeAll"></option></select></label><label><span data-t="bulkMode"></span><select name="mode"><option value="pct" data-t="modePct"></option><option value="eur" data-t="modeEur"></option></select></label></div><label><span data-t="bulkValue"></span><input name="value" inputmode="decimal" placeholder="+10 / -0,50"></label><p class="muted" data-t="bulkHelp"></p><div id="bulk-preview" class="bulk-preview"></div><p id="bulk-error" class="error"></p><div class="dialog-actions"><button type="button" data-close data-t="cancel"></button><button class="pri" id="bulk-apply" data-t="bulkApply"></button></div></form></dialog>
