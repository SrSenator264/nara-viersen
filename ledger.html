<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · دفتر الحسابات</title><link rel="stylesheet" href="nara-shell.css"><style>body{margin:0;background:#f4f6f9;color:#162033;font-family:Arial,sans-serif}.page{max-width:1100px;margin:auto;padding:40px 28px}.card{background:#fff;border:1px solid #e4e9f0;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px #1620330a}h1{margin:0 0 8px;font-size:34px}.muted{color:#68758a}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border-bottom:1px solid #e4e9f0;text-align:right}th{color:#68758a;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf8f0;color:#18834b;font-size:12px}</style></head><body><main class="page"><section class="card"><p class="muted">المحاسبة القانونية · دليل الحسابات</p><h1>دليل الحسابات</h1><p class="muted">طبقة مستقلة لربط المبيعات، تكلفة المواد، الأجور، الضرائب والمصاريف. اعتماد القيود سيتم لاحقاً بعد مراجعة المستشار الضريبي.</p></section><section class="card"><div id="status">جارٍ تحميل الحسابات…</div><div id="accounts"></div></section></main><script src="nara-shell.js"></script><script>fetch('/api/accounting/accounts').then(r=>r.json()).then(j=>{if(!j.ok)throw Error(j.error||'تعذر التحميل');document.getElementById('status').textContent=`${j.accounts.length} حسابات أساسية جاهزة`;document.getElementById('accounts').innerHTML='<table><thead><tr><th>رقم الحساب</th><th>الحساب</th><th>النوع</th><th>الحالة</th></tr></thead><tbody>'+j.accounts.map(a=>`<tr><td>${a.number}</td><td>${a.name}</td><td>${a.type}</td><td><span class="badge">نشط</span></td></tr>`).join('')+'</tbody></table>'}).catch(e=>document.getElementById('status').textContent=e.message)</script></body></html>
