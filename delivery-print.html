<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · طلب توصيل</title><style>@page{size:80mm auto;margin:3mm}*{box-sizing:border-box}body{width:72mm;margin:0;font-family:Arial,sans-serif;font-size:12px;color:#111}.center{text-align:center}.line{border-top:1px dashed #111;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.label{font-weight:bold}.qr{width:42mm;height:42mm;display:block;margin:8px auto}.small{font-size:10px}.error{color:#a00}</style></head><body><div id="app">جاري تجهيز الطلب...</div><script>const id=new URLSearchParams(location.search).get('orderId'),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/delivery/order-print?orderId='+encodeURIComponent(id||'')).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok)throw Error(j.error||'تعذر قراءة الطلب');const o=j.order,d=o.customer||{},payment=o.paymentStatus==='CASH'?'كاش عند التسليم':o.paymentStatus==='PAID'?'مدفوع مسبقاً':'يحتاج تأكيد';app.innerHTML='<div class="center"><h2>NARA</h2><div>طلب توصيل</div><div class="line"></div></div><div class="row"><span class="label">رقم الطلب</span><span>'+esc(o.displayCode)+'</span></div><div class="row"><span class="label">الوقت</span><span>'+esc(o.createdAt||'')+'</span></div><div class="line"></div><div class="label">اسم العميل</div><div>'+esc(d.name||'غير مسجل')+'</div><div class="label">العنوان</div><div>'+esc(d.address||'غير مسجل')+'</div><div class="label">الهاتف</div><div>'+esc(d.phone||'غير مسجل')+'</div><div class="line"></div><div class="row"><span class="label">المبلغ</span><span>'+((Number(o.amountCents||0))/100).toFixed(2)+' €</span></div><div class="row"><span class="label">الدفع</span><span>'+payment+'</span></div><div class="line"></div><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(location.origin+'/delivery.html?token='+o.deliveryQrToken)+'" alt="QR الطلب"><div class="center small">كود تشغيل داخلي — ليس إيصالاً للزبون</div>';setTimeout(()=>window.print(),400)}).catch(e=>app.innerHTML='<p class="error">'+esc(e.message)+'</p>');</script></body></html>
