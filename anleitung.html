<style>
@font-face{font-family:LalezarX;src:url(fonts/lalezar.woff) format('woff');font-weight:400}
@font-face{font-family:CairoX;src:url(fonts/cairo-600.woff) format('woff');font-weight:600}
@font-face{font-family:CairoX;src:url(fonts/cairo-700.woff) format('woff');font-weight:700}
@font-face{font-family:CairoX;src:url(fonts/cairo-800.woff) format('woff');font-weight:800}
:root{--paper:#fff4de;--ink:#2b2118;--orange:#ff7a1a;--yellow:#ffc233;--red:#ff4d2e;--green:#3fae5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:CairoX,system-ui,'Noto Color Emoji',sans-serif;font-weight:700;color:var(--ink);background:var(--paper);background-image:radial-gradient(#f3dcb2 2px,transparent 2.5px);background-size:34px 34px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:#fff}
.bar b{font-family:LalezarX;font-weight:400;font-size:24px;color:var(--orange)}
.bar .tools{display:flex;gap:6px;flex-wrap:wrap}
.bar button{font:inherit;font-size:15px;border:2px solid #fff6;background:#3a2c22;color:#fff;border-radius:12px;padding:6px 12px;cursor:pointer}
.bar button.on{background:var(--orange);border-color:var(--orange)}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 100px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e6cfa6;border:2px solid var(--ink);cursor:pointer}
.dots i.on{background:var(--orange)}
.card{position:relative;background:#fffaf0;border:4px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:16px}
.head{display:flex;align-items:center;gap:12px}
.badge{flex:none;width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:LalezarX;font-weight:400;font-size:40px;line-height:1.1}
h1{font-family:LalezarX;font-weight:400;font-size:clamp(28px,7.4vw,42px);line-height:1.2}
.art{margin:12px -6px 4px}
.art svg{display:block;width:100%;height:auto;direction:ltr}
.row{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.flamo{flex:none;width:96px;height:auto;filter:drop-shadow(4px 5px 0 rgba(43,33,24,.18))}
.body{font-size:19px;line-height:1.65;font-weight:700}
.body ol{margin:8px 0 0;padding-inline-start:24px}
.body li{margin:4px 0}
.tip{margin-top:12px;background:#e9f7ec;border:3px dashed var(--green);border-radius:18px;padding:12px 14px;color:#1f5e30;font-size:17px;line-height:1.55}
.pfoot{display:none}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--ink)}
.nav button{flex:1;font:inherit;font-size:20px;border:0;border-radius:16px;padding:12px;background:var(--orange);color:#fff;cursor:pointer}
.nav button[disabled]{opacity:.35}
.nav .cnt{align-self:center;color:#fff;font-size:16px;min-width:64px;text-align:center}
@page{size:A5;margin:8mm}
body.print{background:#fff;background-image:none}
body.print .bar,body.print .nav,body.print .dots{display:none}
body.print .wrap{max-width:none;padding:0}
body.print .card{box-shadow:none;border-width:3px;page-break-after:always;break-after:page;margin:0;border-radius:18px}
body.print .card:last-child{page-break-after:auto;break-after:auto}
body.print .pfoot{display:block;margin-top:10px;text-align:center;font-size:12px;color:#8a6a4a;direction:ltr}
body.print .flamo{width:72px}
body.print .body{font-size:15px}
body.print .tip{font-size:13px}
body.print h1{font-size:30px}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ---------- App ---------- */
const $=s=>document.querySelector(s);
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
const dig=(n,L)=>L==='ar'?String(n).replace(/\d/g,d=>AR_DIG[d]):String(n);
const params=new URLSearchParams(location.search);
const printLang=['de','ar','en'].includes(params.get('print'))?params.get('print'):null;
let lang=printLang||(()=>{try{const a=localStorage.getItem('flamo-guide-lang')||localStorage.getItem('nara-kasse-language');if(['de','ar','en'].includes(a))return a}catch(e){}return 'de'})();
let cur=Math.max(0,Math.min(STEPS.length-1,(parseInt(location.hash.slice(1),10)||1)-1));

function card(s,n){
 const d=s[lang];
 return `<article class="card" data-n="${n}"><div class="head"><div class="badge">${dig(n+1,lang)}</div><h1>${d.t}</h1></div>
 <div class="art">${SC[s.scene](lang,X[lang])}</div>
 <div class="row"><img class="flamo" src="web-prototype/c/flamo-${s.clip}.webp" alt="" ${printLang?'':'loading="lazy"'}><div class="body">${d.b}${d.list?'<ol>'+d.list.map(l=>`<li>${l}</li>`).join('')+'</ol>':''}</div></div>
 ${d.tip?`<div class="tip">💡 ${d.tip}</div>`:''}
 <div class="pfoot">Flamo · ${UI.de.doc} · v${VER} · ${DATE} · ${n+1}/${STEPS.length}</div></article>`;
}
function render(){
 const rtl=lang==='ar';
 document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';
 document.title='Flamo · '+UI[lang].title;
 const u=UI[lang];
 const bar=`<div class="bar"><b>Flamo · ${u.title}</b><div class="tools">${LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===lang?'on':''}">${n}</button>`).join('')}<button data-pdf="1">${u.pdf}</button></div></div>`;
 if(printLang){$('#app').innerHTML=`<div class="wrap">${STEPS.map(card).join('')}</div>`;document.body.classList.add('print');return}
 const arrow=rtl?['▶','◀']:['◀','▶'];
 $('#app').innerHTML=bar+`<div class="wrap"><div class="dots">${STEPS.map((_,i)=>`<i data-i="${i}" class="${i===cur?'on':''}"></i>`).join('')}</div>${card(STEPS[cur],cur)}</div>
 <div class="nav"><button data-go="-1" ${cur===0?'disabled':''}>${arrow[0]} ${u.prev}</button><div class="cnt">${dig(cur+1,lang)} / ${dig(STEPS.length,lang)}</div><button data-go="1" ${cur===STEPS.length-1?'disabled':''}>${u.next} ${arrow[1]}</button></div>`;
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));history.replaceState(null,'','#'+(cur+1));render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('flamo-guide-lang',lang)}catch(_){}render();return}
 if(e.target.closest('[data-pdf]')){window.open(location.pathname+'?print='+lang,'_blank');return}
 const g=e.target.closest('[data-go]');if(g){go(cur+Number(g.dataset.go));return}
 const d=e.target.closest('[data-i]');if(d)go(Number(d.dataset.i));
});
document.addEventListener('keydown',e=>{if(printLang)return;const rtl=lang==='ar';if(e.key==='ArrowRight')go(cur+(rtl?-1:1));if(e.key==='ArrowLeft')go(cur+(rtl?1:-1))});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||printLang)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<60)return;const rtl=lang==='ar';go(cur+((dx<0)!==rtl?1:-1))},{passive:true});
render();
if(printLang){
 const imgs=[...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}));
 Promise.all([document.fonts.ready,...imgs]).then(()=>setTimeout(()=>window.print(),500));
}
</script>
