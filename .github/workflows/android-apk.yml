name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor-Projekt erzeugen
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: APK bauen
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flamo-fahrer-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
