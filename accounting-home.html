<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#1d2327;--mute:#6b7378;--line:#e7e3de;--brand:#ff6d00;--ok:#16884a;--bad:#d1342f;--soft:#fff4ea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 FlamoAr,"Segoe UI",system-ui,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
header{padding:14px 16px;background:#fff;box-shadow:0 1px 0 var(--line)}
header h1{margin:0;font-size:1.3rem;color:var(--brand)}
header p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
main{max-width:760px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0 0 8px;font-size:1.15rem}
.card.alert{box-shadow:inset 0 0 0 3px var(--bad);background:#fff6f5}
.card.ask{box-shadow:inset 0 0 0 3px var(--brand);background:var(--soft)}
.mute{color:var(--mute);font-size:.9rem}
.big{font-size:1.6rem;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.stat{background:#f7f5f2;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.15rem}
.bar{height:16px;border-radius:9px;background:#eee9e3;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar.warn i{background:var(--brand)}.bar.over i{background:var(--bad)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:90px;margin-top:10px}
.months div{display:flex;flex-direction:column-reverse;height:100%}
.months span{display:block;border-radius:4px 4px 0 0}
.months .o{background:var(--brand)}.months .p{background:#f6b27a}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:.7rem;color:var(--mute);text-align:center}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.check:first-of-type{border-top:0}
.check .e{font-size:1.5rem;width:34px;text-align:center}
.check .t{flex:1}
.check .t small{display:block;color:var(--mute)}
.check .go{color:var(--brand);font-weight:800}
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mnav b{flex:1;text-align:center;font-size:1.05rem}
.mnav button{min-height:44px;min-width:52px;border:0;border-radius:12px;background:#eef0ea;font-size:1.1rem;cursor:pointer}
.dl{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}
.dl .e{font-size:1.4rem;width:34px;text-align:center}
.dl .t{flex:1}
.dl .d{font-weight:800;white-space:nowrap}
.dl.soon .d{color:var(--brand)}.dl.late .d{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:#f7f5f2;text-decoration:none;color:inherit;font-weight:800}
.tile span{font-size:1.6rem}
.tile small{font-weight:400;color:var(--mute)}
.btn{min-height:52px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:1.02rem;cursor:pointer;padding:0 14px}
.btn.ghost{background:#eef0ea;color:var(--ink)}
.set{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.set label{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.set input,.set select{min-height:46px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.set label.cb{flex-direction:row;align-items:center;gap:8px}
.set label.cb input{min-height:auto;width:22px;height:22px}
#msg{min-height:1.4em;margin-top:6px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;font-weight:800;margin-top:6px}
.up input{display:none}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}
.cat{display:flex;align-items:center;gap:10px;padding:7px 0}.cat .e{font-size:1.3rem;width:30px;text-align:center}.cat .n{flex:1}.cat .b{height:8px;border-radius:5px;background:var(--brand);margin-top:3px}.cat .v{font-weight:800;white-space:nowrap;text-align:end}.cat small{display:block;font-weight:600}
.up2{color:var(--bad)}.down2{color:var(--ok)}
.fx{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.fx span{flex:1}.fx button{border:0;background:#eef0ea;border-radius:10px;min-height:36px;padding:0 10px;cursor:pointer}
.unk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}.unk span{flex:1;min-width:140px}.unk select{min-height:40px;border-radius:10px;border:2px solid var(--line);background:#fff}
.note{font-size:.82rem;color:var(--mute);text-align:center;padding:4px 10px 20px}
</style>

<body>
<header><h1>📚 <span data-t="title"></span></h1><p data-t="sub"></p></header>
<main>
  <section class="card alert" id="c-alert" hidden></section>
  <section class="card" id="c-klein"></section>
  <section class="card" id="c-month"></section>
  <section class="card" id="c-pur"></section>
  <section class="card" id="c-kb"></section>
  <section class="card" id="c-plat"></section>
  <section class="card" id="c-an"></section>
  <section class="card" id="c-euer" hidden></section>
  <section class="card" id="c-dl"></section>
  <section class="card">
    <h2>🧰 <span data-t="tools"></span></h2>
    <div class="tiles">
      <a class="tile" href="accounting-agent.html" style="background:var(--soft)"><span>🤖</span><b data-t="tAgent"></b><small data-t="tAgentHint"></small></a>
      <a class="tile" href="accounting.html"><span>📒</span><b data-t="tJournal"></b><small data-t="tJournalHint"></small></a>
      <a class="tile" href="kasse-settlement.html"><span>📊</span><b data-t="tClose"></b><small data-t="tCloseHint"></small></a>
      <a class="tile" href="sales.html"><span>💶</span><b data-t="tSales"></b><small data-t="tSalesHint"></small></a>
      <a class="tile" href="banking.html"><span>🏦</span><b data-t="tBank"></b><small data-t="tBankHint"></small></a>
      <a class="tile" href="inventory-foundation.html"><span>🧾</span><b data-t="tBelege"></b><small data-t="tBelegeHint"></small></a>
      <a class="tile" href="reports.html"><span>📈</span><b data-t="tPl"></b><small data-t="tPlHint"></small></a>
    </div>
  </section>
  <section class="card">
    <h2>⚙️ <span data-t="settings"></span></h2>
    <div class="set">
      <label><span data-t="sManualCur"></span><input id="s-mcur" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label><span data-t="sManualPrev"></span><input id="s-mprev" type="number" min="0" step="0.01" inputmode="decimal"></label>
    </div>
    <div class="set">
      <label><span data-t="sKasseSince"></span><input id="s-since" type="date"></label>
      <label class="cb"><input id="s-kmdone" type="checkbox"><span data-t="sKmDone"></span></label>
      <label class="cb"><input id="s-minijob" type="checkbox"><span data-t="sMinijob"></span></label>
    </div>
    <h2 style="margin-top:16px">🏠 <span data-t="fxTitle"></span></h2>
    <p class="mute" data-t="fxHint"></p>
    <div id="fxList"></div>
    <div class="set">
      <label><span data-t="fxName"></span><input id="fx-name" data-t-ph="fxNamePh"></label>
      <label><span data-t="fxMatch"></span><input id="fx-match" data-t-ph="fxMatchPh"></label>
      <label><span data-t="fxAmount"></span><input id="fx-amount" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label><span data-t="fxDay"></span><input id="fx-day" type="number" min="1" max="28" value="1"></label>
    </div>
    <button class="btn ghost" id="fxAdd" type="button" style="width:100%;margin-top:10px">➕ <span data-t="fxAdd"></span></button>
    <button class="btn" id="save" type="button" style="width:100%;margin-top:12px">💾 <span data-t="save"></span></button>
    <button class="btn ghost" id="weekly" type="button" style="width:100%;margin-top:10px">📨 <span data-t="weeklyTest"></span></button>
    <div id="msg" class="mute" role="status"></div>
  </section>
  <p class="note" data-t="disclaimer"></p>
</main>

const PLN={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',WOLT:'Wolt',SIDES:'Sides / Loco',LANCH:'Lanch',OTHER:'?'};
function plLine(s,c){
  const fee=(s.commissionGrossCents||0)+(s.otherFeesCents||0);
  const cmp=!c||!c.possible?`<small>${esc(t('plCmpNo'))}</small>`:c.ok===null?`<small>${esc(t('plCmpNone'))}</small>`:c.ok?`<small class="okc">${esc(t('plCmpOk',{n:c.flamoCount}))}</small>`:`<small class="badc">${esc(t('plCmpBad',{n:(c.diffCount>0?'+':'')+(c.diffCount==null?'?':c.diffCount),a:(c.diffCents==null?'?':eur(c.diffCents))+(c.missingPct==null?'':' ('+c.missingPct+'%)')}))}</small>`;
  return `<span class="t"><b>${esc(t('plRow',{p:PLN[s.platform]||s.platform,f:s.periodFrom?fmtD(s.periodFrom):'?',t:s.periodTo?fmtD(s.periodTo):'?'}))}</b><small>${esc(t('plNums',{g:s.grossCents==null?'?':eur(s.grossCents),c:eur(fee),o:s.payoutCents==null?'?':eur(s.payoutCents)}))}${c&&c.feeSharePct!=null?' · '+esc(t('plFee',{p:c.feeSharePct})):''}</small>${cmp}</span>`;
}
function drawPlat(){
  const el=$('c-plat');
  const prev=PPS.map((x,i)=>`<div class="check" style="background:var(--soft);border-radius:12px;padding:10px"><span class="e">🤖</span>${plLine(x.statement,x.comparison)}<button class="btn plSave" type="button" data-i="${i}">💾 ${esc(t('plSave'))}</button></div>`).join('');
  const groups=[...new Set(PL.map(s=>s.platform))]; // all statements, grouped by platform
  const list=groups.map(p=>{const L=PL.filter(s=>s.platform===p);return `<details class="plGrp"${groups.length===1?' open':''}><summary><b>${esc(PLN[p]||p)}</b> <small class="mute">(${L.length})</small></summary>${L.map(s=>`<div class="check"><span class="e">${s.comparison&&s.comparison.ok?'✅':'🛵'}</span>${plLine(s,s.comparison)}</div>`).join('')}</details>`}).join('');
  el.innerHTML=`<h2>🛵 ${esc(t('plTitle'))}</h2><p class="mute">${esc(t('plHint'))}</p><label class="up">📄 ${esc(t('plUp'))}<input type="file" id="plFile" accept=".pdf,.csv,application/pdf,text/csv,image/png,image/jpeg"></label><p class="mute" role="status">${esc(PMSG)}</p>${prev}${list||(!PPS.length?`<p class="mute">${esc(t('plNone'))}</p>`:'')}`;
  $('plFile').onchange=async()=>{const f=$('plFile').files[0];if(!f)return;PMSG=t('plReading');PPS=[];drawPlat();
    try{const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsDataURL(f)});
      const r=await fetch('/api/accounting/platform-statement/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({filename:f.name,mime:f.type,data})});const j=await r.json().catch(()=>({}));
      if(r.ok&&(j.items||j.statement)){PPS=j.items||[j];PMSG=''}else PMSG=t(j.code==='NO_AI_KEY'?'plNoKey':(j.code==='NOT_UBER_CSV'||j.code==='NO_ROWS')?'plCsvBad':'plFail')+(j.code&&j.code!=='NO_AI_KEY'?' ['+j.code+(j.status?' '+j.status:'')+(j.detail?': '+j.detail:'')+']':'');}catch(e){PMSG=t('plFail')}drawPlat()};
  document.querySelectorAll('.plSave').forEach(b=>b.onclick=async()=>{const x=PPS[Number(b.dataset.i)];if(!x)return;try{const r=await fetch('/api/accounting/platform-statement/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({documentId:x.documentId||null,statement:x.statement})});PMSG=t(r.ok?'plSaved':r.status===409?'plDup':'plFail');if(r.ok)PPS.splice(Number(b.dataset.i),1);await loadPlat()}catch(e){PMSG=t('plFail');drawPlat()}});
}

const CAT_ICON={MEAT:'🥩',BREAD:'🍞',VEG:'🥬',CHEESE:'🧀',SAUCE:'🥫',FROZEN:'🍟',DRINKS:'🥤',OIL:'🫒',PACKAGING:'📦',CLEANING:'🧽',OTHER:'📎'};
function drawPur(){
  const el=$('c-pur');if(!PU){el.innerHTML='';return}
  const c=PU.current,max=Math.max(1,...PU.categories.map(k=>c.totals[k]));
  const rows=PU.categories.filter(k=>c.totals[k]).sort((a,b)=>c.totals[b]-c.totals[a]).map(k=>{const ch=PU.changePct[k];return `<div class="cat"><span class="e">${CAT_ICON[k]}</span><span class="n"><b>${esc(tk('c_'+k))}</b><div class="b" style="width:${Math.round(c.totals[k]/max*100)}%"></div></span><span class="v">${esc(eur(c.totals[k]))}${ch==null?'':`<small class="${ch>0?'up2':'down2'}">${ch>0?'+':''}${ch}% ${esc(t('puVsPrev'))}</small>`}</span></div>`}).join('');
  const top=c.top.length?`<p class="mute" style="margin:10px 0 4px">${esc(t('puTop'))}</p>`+c.top.map(x=>`<div class="fx"><span>${esc(x.name)}</span><b>${esc(eur(x.cents))}</b></div>`).join(''):'';
  const unk=c.uncategorized.length?`<p class="mute" style="margin:10px 0 4px">${esc(t('puUnk'))}</p>`+c.uncategorized.slice(0,6).map((x,i)=>`<div class="unk"><span>${esc(x.description)} · ${esc(eur(x.cents))}</span><select data-u="${i}"><option value="">—</option>${PU.categories.filter(k=>k!=='OTHER').map(k=>`<option value="${k}">${CAT_ICON[k]} ${esc(tk('c_'+k))}</option>`).join('')}</select></div>`).join(''):'';
  el.innerHTML=`<h2>🧾 ${esc(t('puTitle'))}</h2><p class="mute">${esc(monthName(c.month))} ${c.year} · ${esc(t('puTotal',{a:eur(c.totalCents),n:c.invoices}))}</p>${rows||`<p class="mute">${esc(t('puNone'))}</p>`}${top}${unk}`;
  el.querySelectorAll('[data-u]').forEach(s=>s.onchange=async()=>{const x=c.uncategorized[Number(s.dataset.u)];if(!s.value)return;try{await fetch('/api/accounting/purchases/category',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({category:s.value,inventoryItemId:x.inventoryItemId||undefined,description:x.description})});$('msg').textContent=t('puSaved')}catch(e){}loadPur()});
}

  el.innerHTML=`<h2>🕵️ ${esc(t('anTitle'))}</h2>${rows||`<p class="mute">${esc(t('anNone'))}</p>`}`;
}
const DL_ICON={minijobReport:'👥',minijobPay:'💸',monthClose:'📅',gewstPre:'🏛️',estPre:'🏛️',ustVa:'🧾',annual:'📑',kassenmeldung:'🧮'};

function drawKlein(){
  if(H.klein.regime!=='KLEIN'){$('c-klein').hidden=true;$('c-klein').innerHTML='';return}
  $('c-klein').hidden=false;
  const k=H.klein,p=Math.min(100,Math.round(k.ytdCents/k.limitCurCents*100)),cls=k.status==='OVER'?'over':k.status==='WARN'?'warn':'';
  const max=Math.max(1,...k.months.map(x=>x.totalCents));
  const cross=k.crossDate==='PASSED'?t('crossPassed'):k.crossDate?t('cross',{d:fmtD(k.crossDate)}):t('crossNo');
  $('c-klein').innerHTML=`<h2>📏 ${esc(t('kleinTitle'))}</h2>
    <div class="mute">${esc(t('ytd',{y:k.year}))}</div><div class="big">${esc(eur(k.ytdCents))}</div>
    <div class="bar ${cls}"><i style="width:${p}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="mute">${esc(t('ofLimit',{p}))}</span><b>${esc(tk('st'+k.status))}</b></div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><span class="mute">${esc(t('own'))}</span><b>${esc(eur(k.ownCents))}</b></div>
      <div class="stat"><span class="mute">${esc(t('plat'))}</span><b>${esc(eur(k.platformCents))}</b></div>
      ${k.manualCents?`<div class="stat"><span class="mute">${esc(t('manual'))}</span><b>${esc(eur(k.manualCents))}</b></div>`:''}
    </div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><span class="mute">${esc(t('prevYear',{y:k.year-1}))}</span><b>${esc(eur(k.prevYearCents))}</b></div>
      <div class="stat"><span class="mute">${esc(t('proj'))}</span><b>${esc(eur(k.projectedCents))}</b><span class="mute">${esc(cross)}</span></div>
    </div>
    ${!k.prevManualCents&&k.prevYearInSystemCents<k.limitPrevCents?`<p class="mute">💡 ${esc(t('prevLow'))}</p>`:''}
    <div class="months">${k.months.map(x=>`<div title="${esc(monthName(x.month))}: ${esc(eur(x.totalCents))}"><span class="o" style="height:${x.ownCents/max*100}%"></span><span class="p" style="height:${x.platformCents/max*100}%"></span></div>`).join('')}</div>
    <div class="mlab">${k.months.map(x=>`<span>${esc(monthShort(x.month))}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--brand)"></i>${esc(t('own'))}</span><span><i style="background:#f6b27a"></i>${esc(t('plat'))}</span></div>`;
}
function drawMonth(){
  const m=H.month,dayList=d=>d.map(x=>x.slice(8)+'.').join(' ');
  const rows=m.items.map(i=>{
    const e=i.status==='ok'?'✅':i.status==='wait'?'⏳':'⚠️';
    const txt=tk('c_'+i.key+'_'+i.status,{n:i.count,d:i.days?dayList(i.days):''});
    return `<a class="check" href="${LINK[i.key]}"><span class="e">${e}</span><span class="t"><b>${esc(tk('c_'+i.key))}</b><small>${esc(txt)}</small></span>${i.status==='ok'||i.status==='wait'?'':`<span class="go">${esc(t('open'))} ›</span>`}</a>`;
  }).join('');
  $('c-month').innerHTML=`<h2>🗓️ ${esc(t('monthTitle'))}</h2>
    <div class="mnav"><button type="button" id="mPrev" aria-label="${esc(t('prevM'))}">‹</button><b>${esc(monthName(m.month))} ${m.year}</b><button type="button" id="mNext" aria-label="${esc(t('nextM'))}">›</button></div>
    <div class="mute" style="text-align:center">${esc(t('monthDone',{n:m.done,t:m.total}))} · ${esc(t('mSales',{a:eur(m.ownCents),b:eur(m.platformCents)}))}</div>
    <div class="bar ${m.done<m.total?'warn':''}"><i style="width:${Math.round(m.done/m.total*100)}%"></i></div>${rows}`;
  $('mPrev').onclick=()=>{M--;if(M<1){M=12;Y--}load()};
  $('mNext').onclick=()=>{M++;if(M>12){M=1;Y++}load()};
}
function drawDl(){
  const now=Date.parse(H.today+'T00:00:00Z');
  const rows=H.deadlines.slice(0,10).map(d=>{
    const n=Math.round((Date.parse(d.date+'T00:00:00Z')-now)/86400000),cls=n<0?'late':n<=7?'soon':'';
    const when=n<0?t('lateD'):n===0?t('todayD'):t('inDays',{n});
    const label=tk('d_'+d.key,{m:d.month?monthName(d.month):'',q:d.quarter||'',y:d.forYear||''});
    return `<div class="dl ${cls}"><span class="e">${DL_ICON[d.key]||'📌'}</span><span class="t">${esc(label)}<br><span class="mute">${esc(fmtD(d.date))}</span></span><span class="d">${esc(when)}</span></div>`;
  }).join('');
  $('c-dl').innerHTML=`<h2>⏰ ${esc(t('dlTitle'))}</h2>${rows||`<p class="mute">${esc(t('dlNone'))}</p>`}<p class="mute">${esc(t('dlNote'))}</p>`;
}
function drawSettings(){
  if(!S)return;
  const y=H?H.klein.year:new Date().getFullYear(),mr=S.manualRevenueCents||{};
  $('s-mcur').value=mr[y]?(mr[y]/100):'';
  $('s-mprev').value=mr[y-1]?(mr[y-1]/100):'';
  $('s-since').value=S.kasseInUseSince||'';
  $('s-kmdone').checked=!!S.kassenmeldungDone;
  $('s-minijob').checked=S.minijob!==false;
}
function draw(){if(!H)return;drawKlein();drawMonth();drawPur();drawKb();drawPlat();drawAn();drawEuer();drawDl();drawSettings();drawFx()}

async function load(){
  try{
    const q=Y?`?year=${Y}&month=${M}`:'';
    const [a,b]=await Promise.all([fetch('/api/accounting/health'+q,{cache:'no-store'}),fetch('/api/accounting/settings',{cache:'no-store'})]);
    if(!a.ok||!b.ok)throw 0;
    H=await a.json();S=(await b.json()).settings||{};
    if(!Y){Y=H.month.year;M=H.month.month}
    loadPur();loadKb();
    try{const c=await fetch('/api/accounting/anomalies',{cache:'no-store'});AN=c.ok?(await c.json()).anomalies||[]:null}catch(e){AN=null}
    draw();
  }catch(e){$('msg').textContent=t('err')}
}
async function saveSettings(patch){
  try{
    const r=await fetch('/api/accounting/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(patch)});
    if(!r.ok)throw 0;S=(await r.json()).settings||S;$('msg').textContent=t('saved');await load();
  }catch(e){$('msg').textContent=t('err')}
}
$('save').onclick=()=>{
  const y=H?H.klein.year:new Date().getFullYear(),mr=Object.assign({},(S&&S.manualRevenueCents)||{});
  const cents=v=>{const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>0?Math.round(n*100):0};
  mr[y]=cents($('s-mcur').value);mr[y-1]=cents($('s-mprev').value);
  saveSettings({vatRegime:'REGEL',manualRevenueCents:mr,kasseInUseSince:$('s-since').value||'',kassenmeldungDone:$('s-kmdone').checked,minijob:$('s-minijob').checked});
};
loadPlat();loadEuer();
$('fxAdd').onclick=()=>{const name=$('fx-name').value.trim(),match=($('fx-match').value.trim()||name);if(!name)return;const n=Number(String($('fx-amount').value).replace(',','.'));const l=((S&&S.fixedCosts)||[]).concat([{name:name.slice(0,60),match:match.slice(0,60),amountCents:Number.isFinite(n)&&n>0?Math.round(n*100):0,day:Math.min(28,Math.max(1,Number($('fx-day').value)||1))}]);$('fx-name').value='';$('fx-match').value='';$('fx-amount').value='';saveSettings({fixedCosts:l})};
$('weekly').onclick=async()=>{try{const r=await fetch('/api/accounting/weekly/test',{method:'POST'});const j=await r.json();$('msg').textContent=t(j.sent?'weeklyOk':'weeklyNo')}catch(e){$('msg').textContent=t('err')}};
load();
</script>
