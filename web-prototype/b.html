<!doctype html>
<meta charset="utf-8"><title>Farbfelder Prototyp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Cairo:wght@500;800;900&display=swap">
<style>[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
html[dir=rtl] body{font-family:var(--ar)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(16px,calc((100% - 1320px)/2));background:var(--topbg);color:var(--topfg)}
.brand{text-decoration:none;font-family:var(--display);font-size:28px;line-height:1;letter-spacing:var(--brandls)}
.chips{display:flex;gap:6px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;text-decoration:none;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px}
.tools{display:flex;gap:10px;align-items:center;margin-inline-start:auto}
.langs{display:flex;border-radius:999px;overflow:hidden;border:1.5px solid var(--line)}
.lang{border:0;background:transparent;padding:8px 11px;font-weight:800;font-size:13px}
.lang.on{background:var(--topfg);color:var(--topbg)}
.cartbtn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--cta);color:var(--ctaink)}
.cartbtn b{display:inline-block;min-width:1.4em;margin-inline-start:4px;padding:1px 6px;border-radius:999px;background:var(--ctaink);color:var(--cta);font-size:13px;text-align:center}
main{display:block}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding-block:48px 36px;padding-inline:max(16px,calc((100% - 1320px)/2))}
.hero-text{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.hero h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-wrap:balance}
.eyebrow{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.lede{margin:0;font-size:19px;max-width:56ch}
.hero-art{flex:0 1 340px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-inline:auto}
.hero-art img{max-width:100%}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;border:2px dashed currentColor;opacity:.75}
.sec{position:relative;overflow:hidden;text-decoration:none;background:var(--c);color:var(--ink);display:flex;flex-direction:column}
.sec .name{font-family:var(--display);font-weight:var(--dw);line-height:.9}
.sec .sub{font-weight:700;font-size:15px}
.sec img{pointer-events:none}
.sec>span{position:relative;z-index:1}
.shero{position:relative;overflow:hidden;background:var(--c);color:var(--ink);display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding-block:28px 0;padding-inline:max(16px,calc((100% - 1320px)/2));min-height:240px}
.shero-in{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px;padding-block-end:28px;position:relative;z-index:1}
.shero h1{margin:0;font-family:var(--display);font-weight:var(--dw);line-height:.85;font-size:clamp(72px,14vw,190px)}
.shero p{margin:0;font-weight:700}
.back{text-decoration:none;font-weight:800;font-size:14px;opacity:.85}
.shero-img{width:min(420px,70%);margin-block-end:-30px;filter:drop-shadow(0 22px 22px rgba(0,0,0,.35))}
html[dir=rtl] .shero-img{transform:scaleX(-1)}
.shero-m{position:absolute;inset-block-start:20px;inset-inline-end:max(16px,calc((100% - 1320px)/2))}
.menu{padding-block:24px 120px;padding-inline:max(16px,calc((100% - 1320px)/2))}
.grp{font-family:var(--display);font-weight:var(--dw);font-size:28px;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);color:var(--cardfg);border-radius:var(--r);overflow:hidden;border:var(--cardborder)}
.ph{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;max-width:100%}
.ph img{width:100%;height:100%;object-fit:contain}
.ph-name{padding:16px;text-align:center;font-family:var(--display);font-weight:var(--dw);font-size:22px;color:#222}
.info{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;flex:1}
.info h4{margin:0;font-size:16px;line-height:1.25}
.info p{margin:0;font-size:13px;opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-variant-numeric:tabular-nums;font-size:17px}
.add{width:44px;height:44px;border-radius:50%;border:0;background:var(--cta);color:var(--ctaink);font-size:24px;font-weight:800;line-height:1}
.add.has span{font-size:17px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:28px 40px;padding-inline:max(16px,calc((100% - 1320px)/2));font-size:14px;opacity:.8}
.foot span:first-child{font-family:var(--display);font-size:20px}
.bar{position:fixed;z-index:25;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;border:0;border-radius:999px;padding:16px 22px;display:flex;justify-content:space-between;font-weight:800;background:var(--cta);color:var(--ctaink);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45)}
.drawer{position:fixed;z-index:31;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);color:var(--cardfg);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:32px}
.x{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700}
.modes{display:flex;gap:6px}
.modes button{flex:1;border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:10px;font-weight:800}
.modes button.on{background:var(--cardfg);color:var(--card);border-color:var(--cardfg)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lines li{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"q n p" ". pm pm";gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.lines .q{grid-area:q;font-weight:800}.lines .n{grid-area:n;min-width:0}.lines .p{grid-area:p;font-variant-numeric:tabular-nums;font-weight:700}
.lines .pm{grid-area:pm;display:flex;gap:6px;justify-content:flex-end}
.lines .pm button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;font-weight:800}
.empty{opacity:.75}
.dsum{display:flex;justify-content:space-between;font-size:20px;margin-top:auto}
.orderbtn{border:0;border-radius:999px;padding:16px;font-weight:800;font-size:17px;background:var(--cta);color:var(--ctaink)}
.orderbtn:disabled{opacity:.4;cursor:default}
.note{margin:0;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--line2)}
@media (max-width:700px){.chips{order:3;flex-basis:100%}.brand{font-size:24px}.hero{padding-block:28px 20px}}
@media (prefers-reduced-motion:no-preference){.sec img{transition:transform .35s ease}.sec:hover img{transform:scale(1.05) rotate(-2deg)}}

.mascot{max-width:100%;height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.25))}
@media (prefers-reduced-motion:no-preference){.hero-art .mascot{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}}
/* product dialog */
button.ph{border:0;padding:0;width:100%;cursor:pointer;display:flex}
.price small{font-size:12px;font-weight:600;opacity:.7}
.lines .n small{display:block;font-size:12.5px;opacity:.7;line-height:1.35;margin-top:2px}
html.pd-on,html.pd-on body{overflow:hidden}
#pd{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.pd-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pd-sheet{position:relative;width:min(560px,100%);max-height:min(92vh,880px);background:var(--card);color:var(--cardfg);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.pd-x{position:absolute;z-index:2;top:12px;inset-inline-end:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.pd-body{overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
.pd-img{background:#fff;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;max-width:100%}
.pd-img img{width:100%;height:100%;object-fit:contain}
.pd-head{padding:16px 20px 4px}
.pd-head h2{margin:0;font-family:var(--display);font-weight:var(--dw);font-size:28px;line-height:1.05}
.pd-head p{margin:6px 0 0;font-size:14px;opacity:.75}
.pd-seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 20px 0}
.pd-seg button{border:2px solid var(--line2);background:transparent;color:inherit;border-radius:16px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px}
.pd-seg button b{font-size:16px}.pd-seg button span{font-size:12.5px;opacity:.75}
.pd-seg button[aria-checked=true]{border-color:var(--cardfg);box-shadow:inset 0 0 0 1px var(--cardfg)}
.pd-flamo{display:flex;align-items:center;gap:10px;margin:12px 20px 0;padding:10px 12px;border-radius:18px;background:#FFF1D6;color:#2A1A00}
.pd-flamo img{width:52px;height:auto;flex:0 0 auto}
.pd-flamo p{margin:0;flex:1;font-size:14px;font-weight:700;line-height:1.3}
.pd-flamo button{flex:0 0 auto;border:0;border-radius:999px;background:#111;color:#fff;font-weight:800;padding:10px 14px}
.pd-grp{border:0;margin:0;padding:16px 20px 0;min-width:0}
.pd-grp legend{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;padding:0;margin-bottom:8px}
.pd-grp legend b{font-size:17px}
.pd-grp legend span{font-size:12px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.pd-grp legend span.req{opacity:1;color:#C2410C}
.pd-grp.miss{animation:shake .4s}
.pd-grp.miss legend b{color:#C2410C}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pd-opts{display:flex;flex-direction:column;gap:6px}
.pd-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);background:transparent;color:inherit;border-radius:14px;padding:12px 14px;text-align:start;min-height:48px}
.pd-opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;opacity:.5;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.pd-opt[role=checkbox] .dot{border-radius:6px}
.pd-opt.on{border-color:var(--cardfg);background:rgba(0,0,0,.04)}
.pd-opt.on .dot{opacity:1;background:var(--cardfg);box-shadow:inset 0 0 0 3px var(--card)}
.pd-opt .on{flex:1;min-width:0}
.pd-opt .pc{font-weight:700;font-variant-numeric:tabular-nums;opacity:.8}
.pd-more{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:6px 2px;align-self:flex-start}
.pd-qn{display:flex;flex-wrap:wrap;gap:6px}
.pd-qn button{border:1.5px solid var(--line2);background:transparent;color:inherit;border-radius:999px;padding:9px 13px;font-weight:700;font-size:14px}
.pd-qn button.on{background:var(--cardfg);color:var(--card);border-color:var(--cardfg)}
.pd-note{display:block;margin-top:10px}
.pd-note input{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px;font:inherit;background:transparent;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pd-foot{border-top:1px solid var(--line2);padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:var(--card)}
.pd-miss{margin:0;font-size:13px;font-weight:700;color:#C2410C}
.pd-row{display:flex;gap:10px;align-items:center}
.pd-q{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:999px;padding:4px}
.pd-q button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:inherit;font-size:22px;font-weight:800}
.pd-q b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.pd-add{flex:1;border:0;border-radius:999px;padding:16px;font-weight:800;font-size:16px;background:var(--cta);color:var(--ctaink)}
.pd-add.dim{opacity:.55}
@media (max-width:600px){#pd{align-items:flex-end}.pd-sheet{border-radius:24px 24px 0 0;max-height:94vh}}
/* checkout + tracking */
.co-back{align-self:flex-start;border:0;background:transparent;color:inherit;font-weight:800;padding:4px 0;text-decoration:underline}
.co{display:flex;flex-direction:column;gap:10px}
.co h3{margin:4px 0 2px;font-size:20px}
.co-f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.co-f span{font-size:13px;font-weight:700;opacity:.7}
.co-f input,.co-f textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line2);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:transparent;color:inherit}
.co-f input:focus{outline:2px solid var(--focus);outline-offset:1px}
.co-f input:invalid:not(:placeholder-shown){border-color:#C2410C}
.co-row{display:flex;gap:10px}
.co-row .co-f:has(.short){flex:0 0 32%}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.co-pay{display:flex;flex-direction:column;gap:6px}
.co-sum{border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.co-sum div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.co-sum .big{font-size:20px;font-weight:800;margin-top:4px}
.co-err{margin:0;color:#C2410C;font-weight:700;font-size:14px}
.co-legal{margin:0;font-size:12px;opacity:.6}
.co-track{border:1.5px solid var(--cardfg);background:transparent;color:inherit;border-radius:999px;padding:11px 14px;font-weight:800}
#track{position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.tr-in{position:relative;background:var(--card);color:var(--cardfg);border-radius:28px;width:min(440px,100%);max-height:94vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center}
.tr-x{position:absolute;top:10px;inset-inline-end:12px;border:0;background:transparent;color:inherit;font-size:30px;width:44px;height:44px}
.tr-m{width:150px;height:150px;object-fit:contain;align-self:center;animation:trbob 2.4s ease-in-out infinite}
@keyframes trbob{50%{transform:translateY(-8px)}}
.tr-say{margin:0;font-size:19px;font-weight:800}
.tr-code{margin:0;opacity:.8}
.tr-steps{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:start}
.tr-steps li{padding:10px 14px;border-radius:14px;border:1.5px solid var(--line2);opacity:.5;font-weight:700}
.tr-steps li.done{opacity:.8}
.tr-steps li.done::before{content:'✓ '}
.tr-steps li.now{opacity:1;border-color:var(--cardfg);background:rgba(0,0,0,.05)}
@media (prefers-reduced-motion:reduce){.tr-m{animation:none}}
.hero-art img{-webkit-mask-image:linear-gradient(#000 78%,transparent 97%);mask-image:linear-gradient(#000 78%,transparent 97%)}

/* B · Farbfelder: every section is a full-bleed colour field with huge type; mascot leads */
:root{--bg:#FFF4E2;--fg:#111;--topbg:#111;--topfg:#fff;--line:#555;--line2:#E8DCC8;--card:#fff;--cardfg:#111;--cta:#111;--ctaink:#fff;--focus:#2563EB;
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Bricolage Grotesque',system-ui,sans-serif;--ar:'Cairo',system-ui,sans-serif;--dw:800;--r:22px;--brandls:-1px;--cardborder:0}
html[dir=rtl]{--display:'Cairo',sans-serif;--dw:900}
.chip{background:var(--c);color:var(--ink)}
.chip.on{box-shadow:inset 0 0 0 3px #fff}
.cartbtn{background:#fff;color:#111}.cartbtn b{background:#111;color:#fff}
.hero h1{font-size:clamp(64px,11vw,150px);line-height:.86;letter-spacing:-.04em}
html[dir=rtl] .hero h1{letter-spacing:0;line-height:1.1}
.secs{display:flex;flex-direction:column}
.sec{min-height:240px;padding-block:24px;padding-inline:max(16px,calc((100% - 1320px)/2));justify-content:center}
.sec .num{display:none}
.sec .name{font-size:clamp(76px,15vw,230px);letter-spacing:-.05em;position:relative;z-index:1}
html[dir=rtl] .sec .name{letter-spacing:0;line-height:1.15}
.sec .sub{position:relative;z-index:1}
.sec img{position:absolute;inset-block-start:50%;transform:translateY(-50%);inset-inline-end:max(16px,calc((100% - 1320px)/2));height:115%;max-height:340px;filter:drop-shadow(0 22px 22px rgba(0,0,0,.35))}
.sec:nth-child(even){align-items:flex-end;text-align:end}
.sec:nth-child(even) img{inset-inline-end:auto;inset-inline-start:max(16px,calc((100% - 1320px)/2))}
.sec-drinks img{height:130%}
.shero{min-height:300px}
.shero h1{letter-spacing:-.05em}
html[dir=rtl] .shero h1{letter-spacing:0;line-height:1.1}
.shero-m{position:static;margin-inline-start:auto;align-self:flex-end;margin-block-end:-6px}
.shero-m .mascot{width:clamp(150px,22vw,250px)}
.card{border-radius:24px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.add{background:var(--cta)}
body[data-route=burger] .add{background:#E3262F}
body[data-route=crispy] .add{background:#C98F00}
body[data-route=street] .add{background:#E85A0C}
body[data-route=orient] .add{background:#55652A}
body[data-route=drinks] .add{background:#1E7FA8}
body[data-route=sweet] .add{background:#C8487A}
@media (max-width:700px){.sec{min-height:180px}.sec img{height:90%;opacity:.95}.shero-in{flex-basis:55%}.shero-m .mascot{width:140px}}

g.innerHTML='<div class="g-bubble" id="gBubble" role="status" aria-live="polite"><span id="gText"></span><button type="button" class="g-act" id="gAct" hidden></button></div><div class="g-row"><button type="button" class="g-voice" id="gVoice" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6"/><path class="w" d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></button><button type="button" class="g-btn" id="gBtn" aria-label="Flamo"><img id="gImg" src="c/mascot.webp" alt=""></button></div>';
document.body.appendChild(g);
var bub=g.querySelector('#gBubble'),txtEl=g.querySelector('#gText'),act=g.querySelector('#gAct'),img=g.querySelector('#gImg'),vbtn=g.querySelector('#gVoice');
var timer=0,typing=0,talkT=0,voice=false,lastPick={};
try{voice=localStorage.getItem('flamoVoice')==='1'}catch(e){}
function L(){return document.documentElement.lang||'de'}
function tr(o){return o[L()]||o.de}
function route(){var h=(location.hash||'#home').slice(1);return IMG[h]?h:'home'}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function fill(t,p){return t.replace('{n}',p.n).replace('{p}',W.eur(p.p))}
function cartItems(){var c=W.cart(),out=[];for(var k in c){var l=c[k];if(l&&l.q>0&&W.byId[l.id])out.push(W.byId[l.id])}return out}
function pool(f){return W.menu.filter(f)}
function pickFrom(list,key){if(!list.length)return null;var p,i=0;do{p=rnd(list);i++}while(list.length>1&&lastPick[key]===p.id&&i<5);lastPick[key]=p.id;return p}
// اقتراح ذكي: حسب السلة، وإلا منتج من القسم
function suggestion(){
 var items=cartItems(),r=route();
 var hasFood=items.some(function(p){return /burger|crispy|street|orient/.test(p.s)});
 var hasFries=items.some(function(p){return p.s==='sides'});
 var hasDrink=items.some(function(p){return p.s==='drinks'});
 var hasSweet=items.some(function(p){return p.s==='sweet'});
 if(hasFood&&!hasFries){var f=pickFrom(pool(function(p){return p.s==='sides'&&/pommes|fries|frit/i.test(p.n)&&p.img}),'fries');if(f)return{t:fill(rnd(tr(TPL.fries)),f),id:f.id}}
 if(hasFood&&!hasDrink){var d=pickFrom(pool(function(p){return p.s==='drinks'&&p.img}),'drink');if(d)return{t:fill(rnd(tr(TPL.drink)),d),id:d.id}}
 if(hasFood&&hasDrink&&!hasSweet){var s=pickFrom(pool(function(p){return p.s==='sweet'&&p.img}),'sweet');if(s)return{t:fill(rnd(tr(TPL.sweet)),s),id:s.id}}
 if(r!=='home'){var x=pickFrom(pool(function(p){return p.s===r&&p.img}),r);if(x)return{t:fill(rnd(tr(TPL.pick)),x),id:x.id}}
 return null;
}
function timeTip(){var h=new Date().getHours();return h>=5&&h<16?'lunch':h<22&&h>=16?'evening':'late'}
function speak(t){
 if(!voice||!window.speechSynthesis)return;
 try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t),l=L(),code=l==='ar'?'ar':l==='en'?'en':'de';
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(code)===0});
  if(vs.length)u.voice=vs[0];u.lang=code==='ar'?'ar-SA':code==='en'?'en-US':'de-DE';u.rate=1.05;u.pitch=1.35;speechSynthesis.speak(u)}catch(e){}
}
function talk(ms){if(intro&&!intro.classList.contains('out'))return;if(route()!=='home'){if(g.classList.contains('away'))return;var wait=Math.max(0,busyUntil-Date.now(),danceUntil-Date.now());if(wait){setTimeout(function(){if(!clipOn||clipOn==='talk')clip('talk',Math.max(1500,ms-wait))},wait+50)}else if(!clipOn)clip('talk',ms);return}clearTimeout(talkT);if(g.classList.contains('perch')){g.classList.add('talking');talkT=setTimeout(function(){g.classList.remove('talking')},ms);return}setTimeout(function(){if(route()==='home'&&!intro&&!g.classList.contains('perch'))img.src='c/flamo-talk.webp'},220);talkT=setTimeout(function(){if(route()==='home'&&!intro&&!g.classList.contains('perch'))img.src='c/mascot.webp'},ms)}
function show(text,keep,pid){
 clearTimeout(timer);clearInterval(typing);bub.hidden=false;txtEl.textContent='';
 act.hidden=!pid;if(pid)setTimeout(function(){clip('present',6500)},Math.max(0,danceUntil-Date.now(),busyUntil-Date.now())+60);if(pid){act.textContent=tr(TPL.addBtn);act.setAttribute('data-add',pid)}else act.removeAttribute('data-add');
 var i=0;typing=setInterval(function(){i+=2;txtEl.textContent=text.slice(0,i);if(i>=text.length)clearInterval(typing)},28);
 talk(Math.max(3500,text.length*70));speak(text);
 if(!keep)timer=setTimeout(function(){bub.hidden=true},pid?9000:6500);
}
function say(key,keep){show(tr(TIPS[key]),keep)}
function hop(){g.classList.remove('hop');void g.offsetWidth;g.classList.add('hop')}
function pose(r){if(intro&&!intro.classList.contains('out'))return;var src=r==='home'&&g.classList.contains('perch')?'c/flamo-sit.webp':'c/'+(IMG[r]?'m-'+r:'mascot')+'.webp';if(img.getAttribute('src')!==src){g.classList.add('swap');setTimeout(function(){if(intro&&!intro.classList.contains('out')){g.classList.remove('swap');return}img.src=src;g.classList.remove('swap')},180)}}
var clipT=0,danceUntil=0,clipOn='',busyUntil=0;
function poseSrc(){var r=route();return r==='home'?(g.classList.contains('perch')?'c/flamo-sit.webp':'c/mascot.webp'):'c/'+(IMG[r]?'m-'+r:'mascot')+'.webp'}
function clip(name,ms){if(intro||g.classList.contains('perch'))return;clearTimeout(clipT);clipOn=name;img.src='c/flamo-'+name+'.webp';clipT=setTimeout(function(){clipOn='';img.src=poseSrc()},ms)}
function dock(){g.classList.remove('welcome');setTimeout(perch,0)}
/* Flamo sitzt auf einer Kachel (Startseite): Po auf der Oberkante, Beine hängen über die Kachel */
var SEAT=.698,perchKey='burger',perchT=0,walking=false,WALK='c/flamo-step.webp',WALK_R=370/269,SPIN_R=381/367;
/* echte Lauf-Animation, sobald es sie gibt (c/flamo-walk.webp), sonst stehender Flamo mit Watschel-Schritten */
(function(){var t=new Image();t.onload=function(){WALK='c/flamo-walk.webp';WALK_R=t.naturalHeight/t.naturalWidth};t.src='c/flamo-walk.webp'})();
function perchSpot(tile,standing){var ratio=standing===true?WALK_R:standing;
 var r=tile.getBoundingClientRect(),w=g.offsetWidth,rtl=document.documentElement.dir==='rtl';
 var x=rtl?r.left+Math.min(28,r.width*.06):r.right-w-Math.min(28,r.width*.06);
 var y=standing?r.top-w*ratio:r.top-w*338/246*SEAT;
 return {x:Math.round(x+window.scrollX),y:Math.round(y+window.scrollY)};
}
function perch(){
 if(walking)return;
 var introOn=intro&&!intro.classList.contains('out');var tile=route()==='home'&&!introOn&&!g.classList.contains('welcome')&&document.querySelector('#app .sec-'+perchKey);
 if(!tile){if(g.classList.contains('perch')){g.classList.remove('perch','talking');g.style.top=g.style.left='';if(route()==='home'&&!introOn)img.src='c/mascot.webp'}return}
 if(!g.classList.contains('perch')){g.classList.add('perch');img.src='c/flamo-sit.webp'}
 var p=perchSpot(tile,false);g.style.left=p.x+'px';g.style.top=p.y+'px';
}
/* aufstehen → zur neuen Kachel laufen → wieder hinsetzen */
function perchTo(k){
 var tile=document.querySelector('#app .sec-'+k),old=document.querySelector('#app .sec-'+perchKey);
 if(k===perchKey||!tile||walking||!g.classList.contains('perch'))return;
 perchKey=k;walking=true;bub.hidden=true;
 var a=old?perchSpot(old,true):null,b=perchSpot(tile,true),fromX=parseFloat(g.style.left)||b.x;
 var dist=Math.hypot(b.x-fromX,b.y-(a?a.y:b.y)),dur=Math.max(.7,Math.min(1.8,dist/420));
 g.style.setProperty('--wd',dur+'s');
 g.classList.toggle('face-left',b.x<fromX);
 img.src=WALK;g.classList.add('standup');
 if(a){g.style.top=a.y+'px'}
 setTimeout(function(){g.classList.remove('standup');g.classList.add('walking');g.style.left=b.x+'px';g.style.top=b.y+'px'},220);
 setTimeout(function(){g.classList.remove('walking','face-left');var sp=perchSpot(tile,SPIN_R);g.style.top=sp.y+'px';img.src='c/flamo-spin.webp';
  setTimeout(function(){walking=false;img.src='c/flamo-sit.webp';perch();hop()},1500)},220+dur*1000+60);
}
function onRoute(){var r=route();setTimeout(perch,60);if(r!=='home'&&IMG[r]){busyUntil=Date.now()+1700;setTimeout(function(){clip('point',1400)},260)}g.classList.toggle('away',r==='burger');if(r!=='home')dock();pose(r);hop();
 if(r==='home'){say(g.classList.contains('welcome')?'home':timeTip());return}
 var s=Math.random()<.6?suggestion():null; if(s)show(s.t,false,s.id); else say(r);
}

var INTRO={h:{de:'Hey, ich bin Flamo.',en:"Hey, I'm Flamo.",ar:'أهلا، أنا فلامو.'},
 p:{de:'Schön, dass du da bist. Worauf hast du heute Hunger?',en:'Glad you stopped by. What are you hungry for today?',ar:'منوّر! شو جاي عبالك اليوم؟'},
 lunch:{de:'Mittagspause? Ich hab was Schnelles für dich. Worauf hast du Hunger?',en:'Lunch break? I have something quick for you. What are you hungry for?',ar:'استراحة غدا؟ عندي شي سريع إلك. شو جاي عبالك؟'},
 evening:{de:'Guten Abend! Zeit für was Richtiges. Worauf hast du Lust?',en:'Good evening! Time for something proper. What do you fancy?',ar:'مسا الخير! وقت أكلة محرزة. شو جاي عبالك؟'},
 late:{de:'Späthunger? Wir haben bis 2 Uhr offen. Was darf es sein?',en:'Late-night hunger? We are open until 2 am. What will it be?',ar:'جوعان آخر الليل؟ نحنا فاتحين لـ ٢. شو بتحب؟'},
 back:{de:'Schön, dich wiederzusehen! Wieder das Gleiche wie letztes Mal?',en:'Good to see you again! Same as last time?',ar:'أهلا من جديد! متل المرة الماضية؟'},
 again:{de:'Wie letztes Mal',en:'Same as last time',ar:'متل المرة الماضية'},
 surprise:{de:'Überrasch mich',en:'Surprise me',ar:'فاجئني'},menu:{de:'Direkt zur Speisekarte →',en:'Straight to the menu →',ar:'خدني عالمنيو ←'}};
var SNAMES=[['burger',{de:'Burger',en:'Burgers',ar:'برغر'}],['crispy',{de:'Crispy',en:'Crispy',ar:'كرسبي'}],['street',{de:'Street',en:'Street',ar:'ستريت'}],['orient',{de:'Orientalisch',en:'Oriental',ar:'شرقي'}],['sides',{de:'Sides',en:'Sides',ar:'مقبلات'}],['drinks',{de:'Drinks',en:'Drinks',ar:'مشروبات'}],['sweet',{de:'Desserts',en:'Desserts',ar:'حلويات'}]];
var intro=null;
function lastOrder(){try{var o=JSON.parse(localStorage.getItem('lastOrder')||'null');if(o&&Object.keys(o).some(function(k){var l=o[k];return typeof l==='number'?l>0&&W.byId[k]:l&&l.q>0&&W.byId[l.id]}))return o}catch(e){}return null}
function introP(){return lastOrder()?INTRO.back:INTRO[timeTip()]||INTRO.p}
function introHTML(){var l=L();return '<div class="in-glow" aria-hidden="true"></div><div class="in-top"><span class="in-brand" dir="ltr">'+(window.__THEME__.brandHtml||'')+'</span><div class="in-langs">'+['de','en','ar'].map(function(x){return '<button type="button" data-ilang="'+x+'" class="'+(x===l?'on':'')+'">'+(x==='ar'?'عربي':x.toUpperCase())+'</button>'}).join('')+'</div></div><div class="in-text"><h1>'+tr(INTRO.h)+'</h1><p id="inP"></p><div class="in-chips">'+SNAMES.map(function(s){return '<button type="button" data-go="'+s[0]+'">'+tr(s[1])+'</button>'}).join('')+'<button type="button" class="hot" data-go="surprise">'+tr(INTRO.surprise)+'</button>'+(lastOrder()?'<button type="button" class="hot again" data-go="again">'+tr(INTRO.again)+'</button>':'')+'</div><button type="button" class="in-skip" data-go="home">'+tr(INTRO.menu)+'</button></div>'}
function typeP(){var el=intro.querySelector('#inP'),t=tr(introP()),i=0;clearInterval(typing);el.textContent='';typing=setInterval(function(){i+=2;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(typing)},30);speak(tr(INTRO.h)+' '+t)}
function openIntro(){intro=document.createElement('div');intro.id='intro';intro.setAttribute('role','dialog');intro.setAttribute('aria-label','Flamo');intro.innerHTML=introHTML();document.body.appendChild(intro);document.documentElement.classList.add('intro-on');g.classList.add('intro');bub.hidden=true;img.src='c/flamo-wave-hd.webp';var spark=document.createElement('span');spark.className='g-spark';spark.setAttribute('aria-hidden','true');g.appendChild(spark);g.classList.add('ignite');setTimeout(function(){g.classList.remove('ignite');spark.remove()},2200);setTimeout(typeP,1300);
 var prevT=0;function preview(k){clearTimeout(prevT);img.src=k&&IMG[k]?'c/m-'+k+'.webp':'c/flamo-wave-hd.webp';g.classList.remove('hop');void g.offsetWidth;g.classList.add('hop')}
 intro.addEventListener('pointerover',function(e){var b=e.target.closest('[data-go]');if(b&&IMG[b.dataset.go])preview(b.dataset.go)});
 intro.addEventListener('pointerout',function(e){var b=e.target.closest('[data-go]');if(b&&IMG[b.dataset.go]){prevT=setTimeout(function(){if(intro)img.src='c/flamo-wave-hd.webp'},250)}});
 intro.addEventListener('focusin',function(e){var b=e.target.closest('[data-go]');if(b&&IMG[b.dataset.go])preview(b.dataset.go)});
 var btn=g.querySelector('#gBtn');intro.addEventListener('pointermove',function(e){var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=Math.max(-1,Math.min(1,(e.clientX-cx)/(innerWidth/2))),dy=Math.max(-1,Math.min(1,(e.clientY-cy)/(innerHeight/2)));btn.style.setProperty('--ry',(dx*14).toFixed(1)+'deg');btn.style.setProperty('--rx',(-dy*9).toFixed(1)+'deg')});
 intro.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-ilang]');if(!b)return;
  if(b.dataset.ilang){var lb=document.querySelector('[data-lang="'+b.dataset.ilang+'"]');if(lb)lb.click();setTimeout(function(){intro.innerHTML=introHTML();typeP()},60);return}
  var go=b.dataset.go;if(go==='again'){var lo=lastOrder();if(lo)W.setCart(JSON.parse(JSON.stringify(lo)));closeIntro('home');setTimeout(function(){W.openCart()},700);return}if(go==='surprise'){go=SNAMES[Math.floor(Math.random()*SNAMES.length)][0]}
  closeIntro(go)})}
function closeIntro(go){if(!intro)return;try{sessionStorage.setItem('flamoIntro','1')}catch(e){}
 intro.classList.add('out');var gb=g.querySelector('#gBtn');gb.style.removeProperty('--rx');gb.style.removeProperty('--ry');document.documentElement.classList.remove('intro-on');g.classList.remove('intro');dock();
 setTimeout(function(){if(intro){intro.remove();intro=null}},700);
 if(go&&go!=='home'){location.hash=go}else{img.src='c/mascot.webp';setTimeout(perch,650);setTimeout(function(){say(timeTip())},900)}}
function setVoice(on){voice=on;vbtn.setAttribute('aria-pressed',on?'true':'false');vbtn.setAttribute('aria-label',tr(on?TPL.voiceOn:TPL.voiceOff));vbtn.title=tr(on?TPL.voiceOn:TPL.voiceOff);try{localStorage.setItem('flamoVoice',on?'1':'0')}catch(e){}if(!on&&window.speechSynthesis)speechSynthesis.cancel()}
setVoice(voice);
if(!window.speechSynthesis)vbtn.hidden=true;
var seen=false;try{seen=sessionStorage.getItem('flamoIntro')==='1'}catch(e){}
if(/[?&]intro\b/.test(location.search))seen=false;
if(route()==='home'&&!seen){openIntro()}else{dock();if(route()==='home')setTimeout(function(){say(timeTip())},600)}
window.addEventListener('scroll',function(){if(window.scrollY>40&&!intro)dock()},{passive:true});
/* Klick aufs Logo: Flamo begrüßt noch einmal (schwarzer Startbildschirm) */
document.addEventListener('click',function(e){var l=e.target.closest&&e.target.closest('.brand');if(!l||intro)return;e.preventDefault();if(location.hash&&location.hash!=='#home')location.hash='home';window.scrollTo(0,0);setTimeout(function(){if(!intro){bub.hidden=true;openIntro()}},80)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&intro)closeIntro('home')});
window.addEventListener('hashchange',function(){setTimeout(onRoute,30)});
vbtn.addEventListener('click',function(){setVoice(!voice);if(voice)speak(txtEl.textContent||tr(TIPS.home))});
g.querySelector('#gBtn').addEventListener('click',function(){dock();hop();var s=suggestion();if(s)show(s.t,false,s.id);else say(route()==='home'?timeTip():route())});
document.addEventListener('click',function(e){
 if(e.target.closest('[data-lang]'))setTimeout(function(){setVoice(voice);say(route()==='home'?timeTip():route())},40);
});
window.addEventListener('nara-added',function(){hop();clip('dance',3800);danceUntil=Date.now()+3800;setTimeout(function(){var s=suggestion();if(s)show(tr(TIPS.added)+' '+s.t,false,s.id);else show(tr(TIPS.added),false)},120)});
window.addEventListener('nara-product',function(){bub.hidden=true});
if(route()!=='home'){dock();pose(route());g.classList.toggle('away',route()==='burger')}
window.addEventListener('resize',function(){clearTimeout(perchT);perchT=setTimeout(perch,120)});
(function(){var app=document.getElementById('app');if(app&&window.MutationObserver)new MutationObserver(function(){clearTimeout(perchT);perchT=setTimeout(perch,40)}).observe(app,{childList:true})})();
var hovT=0;document.addEventListener('mouseover',function(e){if(!matchMedia('(pointer:fine)').matches||!g.classList.contains('perch'))return;var t=e.target.closest&&e.target.closest('#app .sec');if(!t)return;var k=(t.className.match(/sec-([a-z]+)/)||[])[1];clearTimeout(hovT);if(k)hovT=setTimeout(function(){perchTo(k)},420)});
setTimeout(perch,300);
})();
</script>
