<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · تفاصيل التوصيل</title><link rel="stylesheet" href="nara-shell.css"><style>body{font-family:Arial;background:#f4f6f8;padding:24px}.card{max-width:560px;margin:40px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.status{padding:10px;border-radius:10px;background:#fff3d6;color:#835d00}</style></head><body><main class="card"><h1>تفاصيل طلب التوصيل</h1><p id="status" class="status">جاري تحميل الطلب...</p><section id="details"></section><button id="map" hidden>فتح المسار في الخريطة</button></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),status=document.getElementById('status'),details=document.getElementById('details'),map=document.getElementById('map');const money=x=>x==null?'غير محدد':(Number(x)/100).toFixed(2)+' €';fetch('/api/delivery/scan?token='+encodeURIComponent(token||'')).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{if(!ok)throw Error(j.error||'تعذر قراءة QR');const o=j.order,d=o.customer||{};status.textContent=o.paymentStatus==='PAID'?'مدفوع مسبقاً':o.paymentStatus==='CASH'?'كاش عند التسليم':'طريقة الدفع تحتاج تأكيد';details.innerHTML='<div class="row"><b>رقم الطلب</b><span>'+String(o.displayCode)+'</span></div><div class="row"><b>العميل</b><span>'+String(d.name||'غير مسجل')+'</span></div><div class="row"><b>الهاتف</b><span>'+String(d.phone||'غير مسجل')+'</span></div><div class="row"><b>العنوان</b><span>'+String(d.address||'غير مسجل')+'</span></div><div class="row"><b>المبلغ</b><span>'+money(o.amountCents)+'</span></div>';if(d.address){map.hidden=false;map.onclick=()=>location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d.address)}}).catch(e=>{status.textContent=e.message;status.style.background='#ffe5e5';status.style.color='#9b1c1c'});</script></body></html>
