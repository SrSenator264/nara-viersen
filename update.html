<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flamo · Update</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2420;--mut:#6b7168;--ok:#1b7f3b;--bad:#b3261e;--warn:#b26a00;--accent:#e4572e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #e3dfd5}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
code{direction:ltr;unicode-bidi:embed;background:#f0ede4;border-radius:6px;padding:1px 6px;font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.badge.ok{background:#e4f5ea;color:var(--ok)}.badge.warn{background:#fff1d6;color:var(--warn)}.badge.bad{background:#fde7e5;color:var(--bad)}.badge.mut{background:#eceae3;color:var(--mut)}
button.big{width:100%;min-height:64px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;cursor:pointer}
button.big[disabled]{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:17px;font-weight:600}
.small{color:var(--mut);font-size:14px;margin-top:10px}
#lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
button.mid{width:100%;min-height:52px;border:2px solid #d9d4c7;border-radius:14px;background:#fff;color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
button.mid[disabled]{opacity:.45;cursor:default}
.hist{list-style:none;margin:0;padding:0}.hist li{padding:8px 0;border-bottom:1px dashed #e3dfd5;font-size:15px}.hist li:last-child{border-bottom:0}.hist small{display:block;color:var(--mut);font-size:13px}
.warnbox{background:#fff1d6;color:#6b4300;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:600}
a.back{display:inline-block;margin-bottom:6px;color:var(--mut);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <div id="lang"></div>
  <a class="back" href="/kasse.html" data-t="back"></a>
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>

  <section class="card">
    <div class="row"><span data-t="cur"></span><code id="cur">…</code></div>
    <div class="row"><span data-t="rem"></span><code id="rem">…</code></div>
    <div class="row"><span data-t="chg"></span><b id="remMsg" style="font-weight:600;text-align:left;direction:ltr">…</b></div>
    <div class="row"><span data-t="st"></span><span id="state" class="badge mut"></span></div>
  </section>

  <section class="card">
    <button id="go" class="big" type="button" data-t="go"></button>
    <div id="msg" class="msg" aria-live="polite"></div>
    <div class="small" data-t="note"></div>
    <div id="blocked" class="warnbox" hidden></div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 4px;font-size:20px" data-t="safeH"></h2>
    <div class="small" style="margin-top:0" data-t="safeTxt"></div>
    <button id="test" class="mid" type="button" data-t="testBtn"></button>
    <button id="back" class="mid" type="button" data-t="backBtn"></button>
    <div id="backInfo" class="small"></div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 6px;font-size:20px" data-t="histH"></h2>
    <ul id="hist" class="hist"></ul>
  </section>
</main>
<script src="/nara-lang.js?v=20261018" data-section="update"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = {
    back: { de: '→ Zurück zur Kasse', ar: '→ رجوع للكاشير', en: '→ Back to the till' },
    h1: { de: '🔄 System aktualisieren', ar: '🔄 تحديث النظام', en: '🔄 Update system' },
    sub: { de: 'Lädt die neueste Version von GitHub, prüft sie und startet den Server neu. Vorher werden deine Daten gesichert. Klappt etwas nicht, geht Flamo automatisch zur alten Version zurück.', ar: 'بينزّل آخر نسخة من GitHub، بيفحصها، وبيعيد تشغيل السيرفر. قبلها بيحفظ نسخة من بياناتك، وإذا في شي ما زبط بيرجع لحاله للنسخة القديمة.', en: 'Downloads the latest version from GitHub, checks it and restarts the server. Your data is backed up first. If anything fails, Flamo goes back to the old version by itself.' },
    cur: { de: 'Aktuelle Version', ar: 'النسخة الحالية', en: 'Current version' },
    rem: { de: 'Neueste Version auf GitHub', ar: 'آخر نسخة على GitHub', en: 'Latest version on GitHub' },
    chg: { de: 'Letzte Änderung', ar: 'آخر تغيير', en: 'Last change' },
    st: { de: 'Status', ar: 'الحالة', en: 'Status' },
    go: { de: '🔄 System aktualisieren', ar: '🔄 حدّث النظام', en: '🔄 Update system' },
    note: { de: 'Die Seite kann beim Neustart kurz unterbrechen. Das ist normal.', ar: 'ممكن الصفحة تنقطع ثواني وقت إعادة التشغيل، هاد طبيعي.', en: 'The page may drop for a few seconds during the restart. That is normal.' },
    safeH: { de: '🛟 Schutz', ar: '🛟 الحماية', en: '🛟 Safety' },
    safeTxt: { de: 'Test am besten nach Feierabend: der Server ist dabei ca. 30 Sekunden weg.', ar: 'التجربة أحسن بعد الإغلاق: السيرفر بيغيب حوالي 30 ثانية.', en: 'Best tested after closing: the server is away for about 30 seconds.' },
    testBtn: { de: '🧪 Schutz testen', ar: '🧪 جرّب الحماية', en: '🧪 Test the safety net' },
    backBtn: { de: '↩️ Zurück zur vorigen Version', ar: '↩️ رجّع للنسخة السابقة', en: '↩️ Back to the previous version' },
    backTo: { de: 'Vorige Version: ', ar: 'النسخة السابقة: ', en: 'Previous version: ' },
    noBack: { de: 'Keine vorige Version bekannt (erst nach einem Update mit Schutz).', ar: 'ما في نسخة سابقة معروفة (بتبيّن بعد أول تحديث فيه حماية).', en: 'No previous version known yet (appears after the first protected update).' },
    confirmTest: { de: 'Schutz jetzt testen? Der Server ist ca. 30 Sekunden nicht erreichbar.', ar: 'نجرّب الحماية هلأ؟ السيرفر رح يغيب حوالي 30 ثانية.', en: 'Test the safety net now? The server will be away for about 30 seconds.' },
    confirmBack: { de: 'Wirklich zur vorigen Version zurück? Deine Daten bleiben, nur das Programm wird alt.', ar: 'أكيد بدك ترجع للنسخة السابقة؟ بياناتك بتضل، بس البرنامج بيرجع قديم.', en: 'Really go back to the previous version? Your data stays, only the program goes back.' },
    blockedTxt: { de: '⛔ Diese neue Version wurde schon zurückgerollt und wird nicht installiert, bis eine neuere kommt.', ar: '⛔ هالنسخة الجديدة انرجعنا عنها قبل، وما رح تنركّب لحتى تنزل نسخة أجدد.', en: '⛔ This new version was rolled back before and will not be installed until a newer one arrives.' },
    histH: { de: '🕘 Letzte Vorgänge', ar: '🕘 آخر العمليات', en: '🕘 Recent runs' },
    histNone: { de: 'Noch nichts.', ar: 'لسا ما في شي.', en: 'Nothing yet.' },
    mUpdate: { de: 'Update', ar: 'تحديث', en: 'Update' },
    mRollback: { de: 'Zurück', ar: 'رجوع', en: 'Rollback' },
    mTest: { de: 'Test', ar: 'تجربة', en: 'Test' },
    checking: { de: 'Prüfe …', ar: 'عم يفحص …', en: 'Checking …' },
    needOwner: { de: 'Bitte als Inhaber/Manager anmelden', ar: 'لازم تدخل كمالك أو مدير', en: 'Please sign in as owner/manager' },
    cannotCheck: { de: 'Prüfung nicht möglich', ar: 'ما قدرت أفحص', en: 'Cannot check' },
    working: { de: '⏳ Aktualisiere …', ar: '⏳ عم يحدّث ...', en: '⏳ Updating …' },
    noGithub: { de: 'Keine Verbindung zu GitHub', ar: 'ما في اتصال بـ GitHub', en: 'No connection to GitHub' },
    newer: { de: '🆕 Update verfügbar', ar: '🆕 في تحديث جديد', en: '🆕 Update available' },
    uptodate: { de: '✅ System ist aktuell', ar: '✅ النظام محدّث', en: '✅ System is up to date' },
    restarting: { de: '⏳ Server startet neu …', ar: '⏳ السيرفر عم يعيد التشغيل ...', en: '⏳ Server is restarting …' },
    confirm: { de: 'System jetzt aktualisieren? Der Server ist kurz nicht erreichbar.', ar: 'تحديث النظام هلأ؟ السيرفر رح ينقطع ثواني.', en: 'Update the system now? The server will be unreachable for a few seconds.' },
    starting: { de: 'Starte …', ar: 'عم يبلّش ...', en: 'Starting …' },
    failed: { de: 'Hat nicht geklappt', ar: 'ما زبط', en: 'Failed' },
    noServer: { de: 'Server nicht erreichbar', ar: 'ما قدرت أتواصل مع السيرفر', en: 'Cannot reach the server' }
  };
  var L = window.NARA_LANG;
  var tr = function (k) { return L ? L.t(T[k]) : T[k].de; };
  var short = function (s) { return s ? String(s).slice(0, 7) : '—'; };
  var busy = false, timer = null, last = null, stateKey = 'checking', data = null;

  function paintStatic() {
    document.querySelectorAll('[data-t]').forEach(function (e) { var k = e.getAttribute('data-t'); if (T[k]) e.textContent = tr(k); });
    document.title = 'Flamo · ' + (L ? L.t({ de: 'Update', ar: 'تحديث', en: 'Update' }) : 'Update');
  }
  function setState(cls, key) { stateKey = key; var e = $('state'); e.className = 'badge ' + cls; e.textContent = tr(key); }
  function api(method, mode) {
    return fetch('/api/system/update', { method: method, headers: { 'Content-Type': 'application/json' }, body: method === 'POST' ? JSON.stringify({ mode: mode || 'update' }) : undefined, credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  // Server-Meldungen kommen auf Arabisch aus dem Update-Skript; sie werden unverändert angezeigt.
  function render(j) {
    data = j;
    if (j._status === 401 || j._status === 403) { setState('bad', 'needOwner'); return; }
    $('cur').textContent = short(j.current);
    $('rem').textContent = j.remote ? short(j.remote.sha) : tr('cannotCheck');
    $('remMsg').textContent = j.remote && j.remote.message ? j.remote.message : '—';
    last = j.last;
    renderSafety(j);
    if (j.running) { setState('warn', 'working'); busy = true; lock(true); $('msg').style.color = ''; $('msg').textContent = (last && last.message) || ''; return; }
    busy = false; lock(false);
    if (!j.remote) setState('mut', 'noGithub');
    else if (j.behind) setState('warn', 'newer');
    else setState('ok', 'uptodate');
    if (last && last.state === 'DONE' && last.message) {
      var t = last.time ? new Date(last.time).toLocaleString('de-DE') : '';
      $('msg').style.color = last.ok ? 'var(--ok)' : 'var(--bad)';
      $('msg').textContent = (last.ok ? '✅ ' : '❌ ') + last.message + (t ? '  (' + t + ')' : '');
    }
  }
  function lock(on) { $('go').disabled = on || !!(data && data.blocked); $('test').disabled = on; $('back').disabled = on || !(data && data.rollbackTo); }
  function renderSafety(j) {
    var b = $('blocked'); b.hidden = !j.blocked; b.textContent = j.blocked ? tr('blockedTxt') : '';
    $('backInfo').textContent = j.rollbackTo ? tr('backTo') + short(j.rollbackTo) : tr('noBack');
    var icon = { update: '🔄', rollback: '↩️', test: '🧪' }, name = { update: 'mUpdate', rollback: 'mRollback', test: 'mTest' };
    var h = Array.isArray(j.history) ? j.history.slice(0, 6) : [];
    $('hist').innerHTML = h.length ? h.map(function (x) {
      var t = x.time ? new Date(x.time).toLocaleString('de-DE') : '';
      return '<li>' + (x.ok ? '✅ ' : '❌ ') + (icon[x.mode] || '•') + ' <b>' + esc(tr(name[x.mode] || 'mUpdate')) + '</b> · ' + esc(x.message || '') + '<small>' + esc(t) + ' · ' + esc(short(x.from)) + ' → ' + esc(short(x.to)) + '</small></li>';
    }).join('') : '<li>' + esc(tr('histNone')) + '</li>';
  }
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function run(mode, confirmKey) {
    if (busy) return;
    if (!confirm(tr(confirmKey))) return;
    busy = true; lock(true); $('msg').style.color = ''; $('msg').textContent = tr('starting');
    api('POST', mode).then(function (j) {
      if (!j.ok) { busy = false; lock(false); $('msg').style.color = 'var(--bad)'; $('msg').textContent = '❌ ' + (j.error || tr('failed')); return; }
      setState('warn', 'working'); poll();
    }).catch(function () { busy = false; lock(false); $('msg').textContent = '❌ ' + tr('noServer'); });
  }
  $('test').onclick = function () { run('test', 'confirmTest'); };
  $('back').onclick = function () { run('rollback', 'confirmBack'); };
  function refresh() { return api('GET').then(render).catch(function () { setState('warn', 'restarting'); }); }
  function poll() { clearInterval(timer); timer = setInterval(refresh, 2500); }

  $('go').onclick = function () { run('update', 'confirm'); };
  if (L && L.mountSwitcher) L.mountSwitcher($('lang'));
  window.addEventListener('nara-lang', function () { paintStatic(); setState($('state').className.replace('badge ', '') || 'mut', stateKey); });
  paintStatic(); setState('mut', 'checking'); refresh(); poll();
})();
</script>
<script src="flamo-home.js?v=20261031a" defer></script></body>
</html>
