<!doctype html>
<html lang="de" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flamo · Mitarbeiter-App</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.app{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}button,input{width:100%;box-sizing:border-box;padding:13px;margin-top:8px;border-radius:10px;border:1px solid #ccd5e0;font-size:16px}button{background:#c9361e;color:#fff;border:0}.map{background:#1769aa}.muted{color:#667085}.order{border-top:1px solid #eee;padding:12px 0}</style><link rel="stylesheet" href="flamo-night.css?v=20261031b"><script src="flamo-night.js?v=20261031b"></script></head>
<body><main class="app"><h1>Flamo · <span data-t="title"></span></h1><p class="muted" data-t="sub"></p><section class="card"><h2 data-t="att"></h2><input id="employee" data-t-ph="empPh"><button onclick="attendance('CLOCK_IN')" data-t="in"></button><button onclick="attendance('CLOCK_OUT')" data-t="out"></button><p id="attendance" class="muted"></p></section><section class="card"><h2 data-t="tour"></h2><input id="token" data-t-ph="tokPh"><button onclick="addOrder()" data-t="add"></button><button class="map" onclick="openRoute()" data-t="route"></button><p id="routeStatus" class="muted" data-t="hint"></p><div id="orders" class="muted" data-t="noOrders"></div></section></main><script src="/nara-lang.js?v=20261018" data-section="driver-app"></script><script src="/flamo-t.js"></script><script>
FT.init({title:{de:'Mitarbeiter- & Liefer-App',ar:'تطبيق الموظف والتوصيل',en:'Staff & delivery app'},sub:{de:'Arbeitszeit, Bestellungen scannen und die Tour in Google Maps öffnen.',ar:'الدوام، مسح الطلبات، وفتح الجولة بـ Google Maps.',en:'Clock in/out, scan orders and open the tour in Google Maps.'},att:{de:'Zeiterfassung',ar:'تسجيل الدوام',en:'Time tracking'},empPh:{de:'Mitarbeiter-ID',ar:'معرّف الموظف',en:'Employee ID'},in:{de:'Schicht beginnen',ar:'بدء الدوام',en:'Clock in'},out:{de:'Schicht beenden',ar:'تسجيل الانصراف',en:'Clock out'},tour:{de:'Bestellungen der Tour',ar:'طلبات الجولة',en:'Tour orders'},tokPh:{de:'Code oder QR-Link',ar:'رمز أو رابط QR',en:'Code or QR link'},add:{de:'Bestellung nach dem Scan hinzufügen',ar:'إضافة الطلب بعد المسح',en:'Add order after scanning'},route:{de:'Tour in Google Maps öffnen',ar:'فتح الجولة بـ Google Maps',en:'Open tour in Google Maps'},hint:{de:'Bestellung hinzufügen, dann Tour öffnen.',ar:'أضف طلب وبعدين افتح الجولة.',en:'Add an order, then open the tour.'},noOrders:{de:'Keine Bestellungen.',ar:'ما في طلبات.',en:'No orders.'},needId:{de:'Mitarbeiter-ID eingeben',ar:'دخّل معرّف الموظف',en:'Enter the employee ID'},started:{de:'Schicht begonnen',ar:'تم بدء الدوام',en:'Clocked in'},ended:{de:'Schicht beendet',ar:'تم تسجيل الانصراف',en:'Clocked out'},attFail:{de:'Eintrag fehlgeschlagen',ar:'تعذر التسجيل',en:'Could not record'},nr:{de:'nicht erfasst',ar:'غير مسجل',en:'not provided'},cash:{de:'Barzahlung bei Lieferung',ar:'كاش عند التسليم',en:'Cash on delivery'},paid:{de:'Vorab bezahlt',ar:'مدفوع مسبقاً',en:'Paid in advance'},badQr:{de:'QR ungültig',ar:'QR غير صالح',en:'Invalid QR'},added:{de:'{n} Bestellung(en) hinzugefügt.',ar:'تمت إضافة {n} طلب.',en:'{n} order(s) added.'},addFirst:{de:'Zuerst eine Bestellung hinzufügen',ar:'أضف طلب أولاً',en:'Add an order first'},routeFail:{de:'Route konnte nicht erstellt werden',ar:'تعذر تجهيز المسار',en:'Could not prepare the route'},opened:{de:'Tour wurde ab der Hauptadresse des Restaurants in Google Maps geöffnet.',ar:'انفتحت الجولة من عنوان المطعم الرئيسي بـ Google Maps.',en:'Tour opened in Google Maps from the restaurant’s main address.'}},{onChange(){renderOrders();document.getElementById('routeStatus').textContent=orderIds.length?FT.t('added',{n:orderIds.length}):FT.t('hint')}});const t=FT.t;
const orderIds=[],orderRows=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function attendance(action){const employeeId=document.getElementById('employee').value.trim();if(!employeeId)return document.getElementById('attendance').textContent=t('needId');const r=await fetch('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeId,action,source:'DRIVER_APP',method:'APP'})});const j=await r.json();document.getElementById('attendance').textContent=r.ok?t(action==='CLOCK_IN'?'started':'ended'):(j.error||t('attFail'));}
function renderOrders(){document.getElementById('orders').innerHTML=[...orderRows.values()].map(o=>'<div class="order"><b>'+esc(o.displayCode)+'</b><br>'+esc(o.customer?.name||t('nr'))+'<br>'+esc(o.customer?.address||t('nr'))+(o.customer?.phone?'<br>☎ '+esc(o.customer.phone):'')+(o.delivery?.notes?'<br>📝 '+esc(o.delivery.notes):'')+'<br>'+(o.paymentStatus==='CASH'?t('cash'):t('paid'))+(o.amountCents!=null?' · '+(o.amountCents/100).toFixed(2)+' €':'')+'</div>').join('')||t('noOrders');}
async function addOrder(){const input=document.getElementById('token'),v=input.value.trim(),t=new URL(v,location.origin).searchParams.get('token')||v;if(!t)return;const r=await fetch('/api/delivery/scan?token='+encodeURIComponent(t)),j=await r.json();if(!r.ok)return alert(j.error||t('badQr'));if(!orderRows.has(j.order.id))orderIds.push(j.order.id);orderRows.set(j.order.id,j.order);renderOrders();input.value='';document.getElementById('routeStatus').textContent=t('added',{n:orderIds.length});}
async function openRoute(){if(!orderIds.length)return alert(t('addFirst'));const r=await fetch('/api/delivery/route-link?orderIds='+encodeURIComponent(orderIds.join(','))),j=await r.json();if(!r.ok)return alert(j.error||t('routeFail'));window.open(j.googleMapsUrl,'_blank','noopener');document.getElementById('routeStatus').textContent=t('opened');}
</script><script src="flamo-home.js?v=20261031a" defer></script></body></html>
