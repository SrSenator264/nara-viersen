<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flamo · Status</title>
<link rel="icon" href="brand/flamo-icon.svg">
<script src="/nara-lang.js?v=20261018" data-section="status"></script>
<style>
:root{--fire:#ef491d;--ink:#20231f;--paper:#f8f5ea;--mute:#62675f;--line:#dce0d7;--ok:#2f9e5b;--warn:#e8a317;--bad:#d6361f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Tahoma,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}h1{margin:6px 0 2px;font-size:1.6rem}.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 6px;font-size:.85rem;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:1.7rem;font-weight:800}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:8px;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}small{color:var(--mute)}
table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
.wide{grid-column:1/-1}.err{background:#fff0e4;border:1px solid #f1c9a8;padding:12px;border-radius:10px;margin-bottom:12px}
.lvl-crit{color:var(--bad);font-weight:700}.lvl-warn{color:#9a6a00;font-weight:700}
</style>
</head>
<body>
<main>
  <h1 id="h"></h1><p class="sub" id="sub"></p>
  <div id="err" class="err" hidden></div>
  <div class="grid" id="cards"></div>
</main>
<script>
(function(){
  const T={
    title:{de:'Betriebsstatus',ar:'حالة الشغل',en:'System status'},
    sub:{de:'Aktualisiert sich alle 10 Sekunden. Warnungen kommen zusätzlich per Telegram aufs Handy.',ar:'بيتحدّث كل 10 ثواني. التنبيهات بتوصلك كمان على Telegram.',en:'Refreshes every 10 seconds. Alerts also arrive on your phone via Telegram.'},
    server:{de:'Server',ar:'السيرفر',en:'Server'},up:{de:'läuft seit',ar:'شغّال من',en:'up for'},
    lag:{de:'Reaktionszeit',ar:'زمن الاستجابة',en:'Responsiveness'},lagOk:{de:'flüssig',ar:'سريع',en:'smooth'},lagBad:{de:'hängt',ar:'عم يهنّق',en:'stalling'},
    mem:{de:'Arbeitsspeicher',ar:'الذاكرة',en:'Memory'},disk:{de:'Freier Speicher',ar:'المساحة الفاضية',en:'Free disk'},
    data:{de:'Datendatei',ar:'ملف البيانات',en:'Data file'},dataHint:{de:'ab 40 MB Archivierung einplanen',ar:'من 40 MB لازم أرشفة',en:'plan archiving above 40 MB'},
    backup:{de:'Tages-Backup',ar:'النسخة الاحتياطية',en:'Daily backup'},days:{de:'Tage gesichert',ar:'يوم محفوظ',en:'days stored'},last:{de:'zuletzt',ar:'آخر وحدة',en:'latest'},none:{de:'noch keins',ar:'لسا ما في',en:'none yet'},
    bridges:{de:'Plattform-Brücken',ar:'جسور المنصات',en:'Platform bridges'},
    ok:{de:'läuft',ar:'شغّال',en:'running'},login:{de:'Login nötig',ar:'لازم تسجيل دخول',en:'login needed'},down:{de:'offline',ar:'واقف',en:'offline'},never:{de:'noch nie gestartet',ar:'لسا ما اشتغل',en:'never started'},nodata:{de:'keine Daten',ar:'ما في بيانات',en:'no data'},
    alerts:{de:'Letzte Warnungen',ar:'آخر التنبيهات',en:'Recent alerts'},noAlerts:{de:'Keine Warnungen 🎉',ar:'ما في تنبيهات 🎉',en:'No alerts 🎉'},
    tg:{de:'Telegram',ar:'Telegram',en:'Telegram'},tgOn:{de:'verbunden',ar:'مفعّل',en:'connected'},tgOff:{de:'nicht eingerichtet (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in .env)',ar:'مو مفعّل (حط TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID بملف .env)',en:'not set up (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in .env)'},
    dms:{de:'Totmann-Ping',ar:'فحص الإنترنت الخارجي',en:'Dead-man ping'},dmsHint:{de:'meldet, wenn der ganze PC/das Internet ausfällt (HEALTHCHECK_URL)',ar:'بيبلّغك إذا الكمبيوتر كله أو النت وقع (HEALTHCHECK_URL)',en:'tells you if the whole PC/internet is down (HEALTHCHECK_URL)'},
    on:{de:'an',ar:'مفعّل',en:'on'},off:{de:'aus',ar:'مطفي',en:'off'},test:{de:'Testnachricht senden',ar:'ابعت رسالة تجريبية',en:'Send test message'},sent:{de:'gesendet ✅',ar:'انبعتت ✅',en:'sent ✅'},notSent:{de:'nicht gesendet ❌ (Zugangsdaten prüfen)',ar:'ما انبعتت ❌ (راجع الإعدادات)',en:'not sent ❌ (check credentials)'},fail:{de:'Server antwortet nicht',ar:'السيرفر ما عم يرد',en:'Server not responding'}
  };
  const L=window.NARA_LANG,lang=()=>L?L.get():'de',t=k=>(T[k]&&(T[k][lang()]||T[k].de))||k;
  const $=s=>document.querySelector(s),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const NAMES={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',SIDES:'Loco (Sides)',WOLT:'Wolt',LANCH:'Lanch'};
  const dur=s=>s<3600?Math.round(s/60)+' min':s<172800?(s/3600).toFixed(1)+' h':Math.round(s/86400)+' d';
  const card=(h,body,wide)=>'<div class="card'+(wide?' wide':'')+'"><h2>'+esc(h)+'</h2>'+body+'</div>';
  const dot=c=>'<span class="dot '+(c||'')+'"></span>';
  function draw(d){
    const lagBad=d.lagMs>d.limits.lagMs,memBad=d.rssMb>d.limits.rssMb,diskBad=d.diskFreeMb!=null&&d.diskFreeMb<d.limits.diskMinMb,dataBad=d.dataMb>d.limits.dataMaxMb;
    const br=(d.bridges||[]).map(b=>'<tr><td>'+dot(!b.lastHeartbeatAt?'warn':b.state==='ok'?'':b.state==='down'||b.state==='login'?'bad':'warn')+esc(NAMES[b.source]||b.source)+'</td><td>'+esc(!b.lastHeartbeatAt?t('never'):t(b.state))+'</td></tr>').join('');
    const al=(d.alerts||[]).map(a=>'<tr><td><small>'+esc(new Date(a.at).toLocaleString(lang()==='ar'?'ar':'de-DE'))+'</small></td><td class="lvl-'+esc(a.level)+'">'+esc(a.text)+(a.delivered?'':' <small>·</small>')+'</td></tr>').join('');
    $('#cards').innerHTML=
      card(t('server'),'<div class="big">'+dot()+esc(t('up'))+' '+esc(dur(d.uptimeSec))+'</div><small>PID '+d.pid+'</small>')+
      card(t('lag'),'<div class="big">'+dot(lagBad?'bad':'')+esc(lagBad?t('lagBad'):t('lagOk'))+'</div><small>'+Math.round(d.lagMs)+' ms (max/min)</small>')+
      card(t('mem'),'<div class="big">'+dot(memBad?'warn':'')+Math.round(d.rssMb)+' MB</div>')+
      card(t('disk'),'<div class="big">'+dot(diskBad?'bad':'')+(d.diskFreeMb==null?'–':(d.diskFreeMb/1024).toFixed(1)+' GB')+'</div>')+
      card(t('data'),'<div class="big">'+dot(dataBad?'warn':'')+d.dataMb.toFixed(1)+' MB</div><small>'+esc(t('dataHint'))+'</small>')+
      card(t('backup'),'<div class="big">'+dot(d.backups.error?'bad':d.backups.count?'':'warn')+d.backups.count+' '+esc(t('days'))+'</div><small>'+esc(t('last'))+': '+esc(d.backups.last||t('none'))+(d.backups.error?' · '+esc(d.backups.error):'')+'</small>')+
      card(t('tg'),'<div class="big">'+dot(d.telegram?'':'warn')+esc(d.telegram?t('tgOn'):'–')+'</div>'+(d.telegram?'<button id="tgtest" type="button" style="margin-top:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:inherit;cursor:pointer">'+esc(t('test'))+'</button> <small id="tgres"></small>':'<small>'+esc(t('tgOff'))+'</small>'))+
      card(t('dms'),'<div class="big">'+dot(d.deadManSwitch?'':'warn')+esc(d.deadManSwitch?t('on'):t('off'))+'</div><small>'+esc(t('dmsHint'))+'</small>')+
      card(t('bridges'),'<table>'+(br||'<tr><td>–</td></tr>')+'</table>',true)+
      card(t('alerts'),'<table>'+(al||'<tr><td>'+esc(t('noAlerts'))+'</td></tr>')+'</table>',true);
    $('#err').hidden=true;
    const b=$('#tgtest');if(b)b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/health/test-alert',{method:'POST'});const j=await r.json();$('#tgres').textContent=j.sent?t('sent'):t('notSent')}catch(e){$('#tgres').textContent=t('notSent')}b.disabled=false};
  }
  async function load(){
    try{const r=await fetch('/api/health/details',{cache:'no-store'});if(!r.ok)throw Error(r.status);draw(await r.json())}
    catch(e){$('#err').textContent=t('fail');$('#err').hidden=false}
  }
  function head(){document.documentElement.lang=lang();$('#h').textContent=t('title');$('#sub').textContent=t('sub');document.title='Flamo · '+t('title')}
  head();load();setInterval(load,10000);window.addEventListener('nara-lang',()=>{head();load()});
})();
</script>
<script src="flamo-home.js?v=20261031a" defer></script></body>
</html>
