<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c9361e"><title>NARA · تطبيق التوصيل</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}.app{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}button,input{width:100%;padding:13px;border-radius:10px;border:1px solid #ccd5e0;margin-top:8px;font-size:16px}button{background:#c9361e;color:#fff;border:0}.muted{color:#667085}.order{border-top:1px solid #eee;padding:12px 0}.cash{color:#9a6500;font-weight:bold}.paid{color:#18794e;font-weight:bold}</style></head><body><main class="app"><h1>تطبيق توصيل NARA</h1><p class="muted">امسح QR الطلب أو ألصق الرابط، ثم اجمع الطلبات في جولتك.</p><section class="card"><button id="scan">مسح QR بالكاميرا</button><input id="token" placeholder="رمز أو رابط الطلب"><button id="load">إضافة الطلب</button><p id="status" class="muted"></p></section><section class="card"><h2>طلبات الجولة</h2><div id="orders">لا توجد طلبات بعد.</div><button id="route" hidden>فتح المسار للطلبات</button></section></main><script>const token=document.getElementById('token'),status=document.getElementById('status'),orders=document.getElementById('orders'),route=document.getElementById('route'),list=[];function getToken(v){try{return new URL(v,location.origin).searchParams.get('token')||v}catch{return v}}async function add(){const t=getToken(token.value.trim());if(!t)return;const r=await fetch('/api/delivery/scan?token='+encodeURIComponent(t)),j=await r.json();if(!r.ok){status.textContent=j.error||'QR غير صالح';return}if(list.some(x=>x.id===j.order.id)){status.textContent='الطلب مضاف مسبقاً';return}list.push(j.order);token.value='';render()}function render(){orders.innerHTML=list.map(o=>'<div class="order"><b>'+o.displayCode+'</b><br>'+String(o.customer?.name||'غير مسجل')+'<br>'+String(o.customer?.address||'غير مسجل')+'<br><span class="'+(o.paymentStatus==='CASH'?'cash':'paid')+'">'+(o.paymentStatus==='CASH'?'كاش عند التسليم':'مدفوع مسبقاً')+'</span></div>').join('');route.hidden=list.length<1}document.getElementById('load').onclick=add;token.addEventListener('keydown',e=>{if(e.key==='Enter')add()});route.onclick=()=>{const addresses=list.map(x=>x.customer?.address).filter(Boolean);if(addresses.length)location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addresses[addresses.length-1])+'&waypoints='+encodeURIComponent(addresses.slice(0,-1).join('|'))};document.getElementById('scan').onclick=async()=>{if(!('BarcodeDetector'in window)){status.textContent='المتصفح لا يدعم المسح المباشر؛ استخدم رابط QR أو أضف قارئاً متوافقاً.';return}const detector=new BarcodeDetector({formats:['qr_code']}),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),video=document.createElement('video');video.srcObject=stream;await video.play();document.body.append(video);const loop=async()=>{const codes=await detector.detect(video);if(codes[0]){token.value=codes[0].rawValue;stream.getTracks().forEach(x=>x.stop());video.remove();add()}else requestAnimationFrame(loop)};loop()};</script></body></html>
