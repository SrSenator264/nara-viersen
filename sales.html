<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · المبيعات</title><link rel="stylesheet" href="nara-shell.css?v=20261002-sales4"><style>
main{max-width:1280px;margin:auto;padding:28px}.hero,.panel{background:#fff;border:1px solid #e3e7ed;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 24px #1822300b}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px)}.muted{color:#687386}.filters{display:grid;grid-template-columns:1fr 160px 160px auto;gap:10px;align-items:end}.filters label{display:grid;gap:6px;font-weight:700}.filters input{border:1px solid #ccd4df;border-radius:10px;padding:12px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 18px;background:#c9361e;color:#fff;font:inherit;font-weight:700;cursor:pointer}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.stat{background:#f7f8fa;border-radius:12px;padding:14px 18px;min-width:150px}.stat strong{display:block;font-size:22px;margin-top:5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:14px 12px;border-bottom:1px solid #e8ebef;text-align:right;white-space:nowrap}.table th{color:#536071;background:#fafbfc}.sale-row{cursor:pointer}.sale-row:hover{background:#fff6f2}.open{color:#bd351e;font-weight:700}.empty{text-align:center;padding:35px;color:#687386}.error{color:#a32121}.dialog{border:0;border-radius:18px;max-width:720px;width:calc(100% - 30px);padding:0;box-shadow:0 20px 70px #0005}.dialog::backdrop{background:#10182099}.dialog-body{padding:24px}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:1px solid #e8ebef;padding-bottom:14px}.close{border:0;background:#f0f2f5;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.detail{background:#f7f8fa;border-radius:10px;padding:12px}.items{width:100%;border-collapse:collapse}.items td{padding:10px;border-bottom:1px solid #eee}.total{font-size:22px;font-weight:800;margin-top:18px;text-align:left}@media(max-width:760px){main{padding:14px}.hero{display:block}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.filters .btn{grid-column:1/-1}.detail-grid{grid-template-columns:1fr}}
</style></head><body><header><h1>NARA · المبيعات</h1></header><main><section class="hero"><div><h1>المبيعات المكتملة</h1><p class="muted">ابحث، راجع، وافتح تفاصيل أي عملية مبيعات.</p></div><button class="btn" id="refresh">تحديث</button></section><section class="panel"><div class="filters"><label>بحث عام<input id="query" placeholder="التاريخ أو اسم العميل أو رقم الفاتورة أو المبلغ"></label><label>من تاريخ<input id="from" type="date"></label><label>إلى تاريخ<input id="to" type="date"></label><button class="btn" id="clear">مسح البحث</button></div><div class="stats"><div class="stat">العمليات<strong id="count">—</strong></div><div class="stat">الإجمالي<strong id="total">—</strong></div><div class="stat">المعروض<strong id="shown">—</strong></div></div></section><section class="panel table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>رقم الفاتورة/العملية</th><th>العميل</th><th>المصدر</th><th>الحالة</th><th>المبلغ</th><th>فتح</th></tr></thead><tbody id="sales-list"><tr><td colspan="7" class="empty">جاري التحميل…</td></tr></tbody></table></section></main><dialog id="sale-dialog" class="dialog"><div class="dialog-body"><div class="dialog-head"><div><h2 id="detail-title">تفاصيل العملية</h2><div id="detail-sub" class="muted"></div></div><button class="close" id="close-detail">×</button></div><div id="detail-content"></div></div></dialog><script src="business-day.js"></script><script src="nara-shell.js?v=20261002-sales4"></script><script>
const state={rows:[],data:null},esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),money=c=>`${(Number(c||0)/100).toFixed(2)} €`,dateText=x=>x?new Date(x).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'—',nameOf=x=>x?.customerName||x?.customer?.name||x?.delivery?.customerName||x?.receipt?.customerName||'عميل الكاشير',itemsOf=x=>x?.cart||x?.items||x?.lineItems||x?.receipt?.items||[];
function buildRows(d){const orders=Array.isArray(d.orders)?d.orders:[],payments=Array.isArray(d.payments)?d.payments:[],invoices=Array.isArray(d.invoices)?d.invoices:[],rows=[],used=new Set();orders.filter(o=>String(o.status||'').toUpperCase()==='COMPLETED').forEach(o=>{const p=payments.find(x=>x.orderId===o.id);used.add(o.id);rows.push({key:`order:${o.id}`,at:o.completedAt||o.updatedAt||o.createdAt,id:o.displayCode||o.id||p?.id,customer:nameOf(o),source:o.source||'كاشير',status:'مكتملة',cents:Number(o.totalCents??p?.amountCents??0),order:o,payment:p})});payments.filter(p=>!p.orderId||!used.has(p.orderId)).filter(p=>Number(p.amountCents||0)>0).forEach(p=>rows.push({key:`payment:${p.id}`,at:p.createdAt,id:p.id,customer:nameOf(p),source:'كاشير',status:p.status||'مكتملة',cents:Number(p.amountCents||0),payment:p}));invoices.filter(i=>i.source==='MANAGER_DEMO'&&i.status!=='DRAFT').forEach(i=>rows.push({key:`invoice:${i.invoiceNumber}`,at:i.updatedAt||i.createdAt,id:i.invoiceNumber,customer:i.customerName||'NARA Manager',source:'NARA Manager',status:i.status,cents:Number(i.totalCents||0),invoice:i}));return rows.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0))}
function filtered(){const q=document.querySelector('#query').value.trim().toLowerCase(),from=document.querySelector('#from').value,to=document.querySelector('#to').value;return state.rows.filter(r=>{const hay=[r.at,r.id,r.customer,r.source,r.status,(r.cents/100).toFixed(2),String(r.cents)].join(' ').toLowerCase(),day=r.at?(window.NARA_DAY?NARA_DAY.dayOf(r.at):new Date(r.at).toISOString().slice(0,10)):'';return(!q||hay.includes(q))&&(!from||day>=from)&&(!to||day<=to)})}
function render(){const rows=filtered();document.querySelector('#shown').textContent=rows.length;document.querySelector('#sales-list').innerHTML=rows.length?rows.map(r=>`<tr class="sale-row" data-i="${state.rows.indexOf(r)}"><td>${esc(dateText(r.at))}</td><td>${esc(r.id)}</td><td>${esc(r.customer)}</td><td>${esc(r.source)}</td><td>${esc(r.status)}</td><td>${money(r.cents)}</td><td class="open">فتح التفاصيل</td></tr>`).join(''):'<tr><td colspan="7" class="empty">لا توجد عمليات مطابقة للبحث.</td></tr>';document.querySelectorAll('.sale-row').forEach(el=>el.onclick=()=>openDetail(state.rows[Number(el.dataset.i)]))}
function openDetail(r){const x=r.order||r.invoice||r.payment||{},items=itemsOf(x);document.querySelector('#detail-title').textContent=`تفاصيل ${r.id}`;document.querySelector('#detail-sub').textContent=`${dateText(r.at)} · ${r.status}`;document.querySelector('#detail-content').innerHTML=`<div class="detail-grid"><div class="detail"><b>العميل</b><br>${esc(r.customer)}</div><div class="detail"><b>المصدر</b><br>${esc(r.source)}</div><div class="detail"><b>رقم العملية</b><br>${esc(r.id)}</div><div class="detail"><b>الحالة</b><br>${esc(r.status)}</div></div><h3>الأصناف</h3>${items.length?`<table class="items">${items.map(i=>`<tr><td>${esc(i.name||i.title||i.productName||'صنف')}</td><td>${esc(i.quantity??i.qty??1)} ×</td><td>${money(i.totalCents??i.priceCents??0)}</td></tr>`).join('')}</table>`:'<p class="muted">لا توجد تفاصيل أصناف محفوظة لهذه العملية.</p>'}<div class="total">الإجمالي: ${money(r.cents)}</div>`;document.querySelector('#sale-dialog').showModal()}
async function load(){document.querySelector('#sales-list').innerHTML='<tr><td colspan="7" class="empty">جاري التحميل…</td></tr>';try{const res=await fetch('/api/admin-data',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);state.data=await res.json();state.rows=buildRows(state.data);document.querySelector('#count').textContent=state.rows.length;document.querySelector('#total').textContent=money(state.rows.reduce((s,r)=>s+r.cents,0));render()}catch(e){document.querySelector('#sales-list').innerHTML='<tr><td colspan="7" class="empty error">تعذر تحميل المبيعات. تأكد أن السيرفر يعمل.</td></tr>'}}
['query','from','to'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));document.querySelector('#clear').onclick=()=>{['query','from','to'].forEach(id=>document.querySelector('#'+id).value='');render()};document.querySelector('#refresh').onclick=load;document.querySelector('#close-detail').onclick=()=>document.querySelector('#sale-dialog').close();document.querySelector('#sale-dialog').addEventListener('click',e=>{if(e.target.id==='sale-dialog')e.target.close()});load();
</script></body></html>
