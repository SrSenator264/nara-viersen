<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · تطبيق الموظف</title><style>body{font-family:Arial;background:#f4f6f8;margin:0}.app{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}button,input{width:100%;box-sizing:border-box;padding:13px;margin-top:8px;border-radius:10px;border:1px solid #ccd5e0;font-size:16px}button{background:#c9361e;color:#fff;border:0}.map{background:#1769aa}.muted{color:#667085}.order{border-top:1px solid #eee;padding:12px 0}</style></head>
<body><main class="app"><h1>NARA · تطبيق الموظف والتوصيل</h1><p class="muted">الدوام، مسح الطلبات، وفتح الجولة في Google Maps.</p><section class="card"><h2>تسجيل الدوام</h2><input id="employee" placeholder="معرّف الموظف"><button onclick="attendance('CLOCK_IN')">بدء الدوام</button><button onclick="attendance('CLOCK_OUT')">تسجيل الانصراف</button><p id="attendance" class="muted"></p></section><section class="card"><h2>طلبات الجولة</h2><input id="token" placeholder="رمز أو رابط QR"><button onclick="addOrder()">إضافة الطلب بعد المسح</button><button class="map" onclick="openRoute()">فتح الجولة في Google Maps</button><p id="routeStatus" class="muted">أضف طلباً ثم افتح الجولة.</p><div id="orders" class="muted">لا توجد طلبات.</div></section></main><script>
const orderIds=[],orderRows=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function attendance(action){const employeeId=document.getElementById('employee').value.trim();if(!employeeId)return document.getElementById('attendance').textContent='أدخل معرّف الموظف';const r=await fetch('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeId,action,source:'DRIVER_APP',method:'APP'})});const j=await r.json();document.getElementById('attendance').textContent=r.ok?(action==='CLOCK_IN'?'تم بدء الدوام':'تم تسجيل الانصراف'):(j.error||'تعذر التسجيل');}
function renderOrders(){document.getElementById('orders').innerHTML=[...orderRows.values()].map(o=>'<div class="order"><b>'+esc(o.displayCode)+'</b><br>'+esc(o.customer?.name||'غير مسجل')+'<br>'+esc(o.customer?.address||'غير مسجل')+'<br>'+(o.paymentStatus==='CASH'?'كاش عند التسليم':'مدفوع مسبقاً')+'</div>').join('')||'لا توجد طلبات.';}
async function addOrder(){const input=document.getElementById('token'),v=input.value.trim(),t=new URL(v,location.origin).searchParams.get('token')||v;if(!t)return;const r=await fetch('/api/delivery/scan?token='+encodeURIComponent(t)),j=await r.json();if(!r.ok)return alert(j.error||'QR غير صالح');if(!orderRows.has(j.order.id))orderIds.push(j.order.id);orderRows.set(j.order.id,j.order);renderOrders();input.value='';document.getElementById('routeStatus').textContent='تمت إضافة '+orderIds.length+' طلبات.';}
async function openRoute(){if(!orderIds.length)return alert('أضف طلباً أولاً');const r=await fetch('/api/delivery/route-link?orderIds='+encodeURIComponent(orderIds.join(','))),j=await r.json();if(!r.ok)return alert(j.error||'تعذر تجهيز المسار');window.open(j.googleMapsUrl,'_blank','noopener');document.getElementById('routeStatus').textContent='تم فتح الجولة من عنوان المطعم الرئيسي في Google Maps.';}
</script></body></html>
