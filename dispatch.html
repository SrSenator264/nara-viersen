<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NARA · التوزيع</title>
<script src="nara-lang.js?v=20261009b" data-section="dispatch"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202a;--muted:#6b7580;--line:#e2e6ea;--late:#dc2626;--ok:#16a34a;--blue:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#101820;color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:19px}
.chip{background:#ffffff1a;border-radius:999px;padding:4px 10px;font-size:13px}
.sp{flex:1}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;background:#ffffff1a;border-radius:10px;padding:6px 10px}
.tog input{width:18px;height:18px}
.wrap{display:grid;grid-template-columns:minmax(340px,420px) 1fr;height:calc(100% - 52px)}
aside{overflow:auto;padding:10px;border-inline-end:1px solid var(--line)}
#map{height:100%;min-height:300px}
.drv{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;border-top:5px solid var(--c,#999)}
.drv h2{margin:0;padding:9px 12px 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.drv .st{padding:0 12px 8px;font-size:13px;color:var(--muted)}
.tour{border-top:1px solid var(--line);padding:8px 12px}
.tour .hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.tour .hd .t{color:var(--muted);font-weight:600}
.stop{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:14px}
.stop .n{min-width:20px;height:20px;border-radius:50%;background:var(--c,#999);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.stop .c{font-weight:800;direction:ltr}
.stop .a{flex:1;color:#334;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .e{font-variant-numeric:tabular-nums;font-weight:700}
.stop.late .e{color:var(--late)}
.stop.done{opacity:.45;text-decoration:line-through}
.btns{display:flex;gap:6px;margin-top:6px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:30px;height:28px;font-size:14px;cursor:pointer;padding:0 6px;color:var(--ink)}
.mini:disabled{opacity:.3}
.bd{font-size:12px;margin-inline-start:2px}
.dh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.dh select{border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:13px;background:#fff}
#dlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
#dlg.on{display:flex}
#dlg .bx{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:14px 16px}
#dlg h3{margin:0 0 4px;font-size:17px}#dlg h4{margin:12px 0 6px;font-size:14px;color:var(--muted)}
#dlg .row{display:flex;flex-wrap:wrap;gap:6px}
#dlg label{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
#dlg label input{width:18px;height:18px}
#dlg select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:#eef1f4;color:var(--ink)}.btn.red{background:#fee2e2;color:#991b1b}
.btn:disabled{opacity:.5}
.late-b{background:#fee2e2;color:#991b1b;border-radius:6px;padding:1px 6px;font-size:12px}
.box{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.box h3{margin:0 0 6px;font-size:14px}
.warn{background:#fff7d6;border:1px solid #f3d36b}
.muted{color:var(--muted);font-size:13px}
#msg{position:fixed;bottom:14px;inset-inline-start:14px;background:#101820;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:999}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.car{font-size:24px;filter:drop-shadow(0 1px 2px #0008)}
.pin.sm{width:18px;height:18px;font-size:11px;border-width:1px}
.arw{font-size:15px;line-height:16px;width:16px;height:16px;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff}
.tour.focus{outline:3px solid var(--c,#2563eb);outline-offset:-3px;background:#f8fafc}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}#map{height:55vh}aside{border:0}}
</style>
</head>
<body>
<header>
  <h1>🛵 <span data-t="title"></span></h1>
  <span class="chip" id="learn">…</span>
  <span class="sp"></span>
  <label class="tog" data-tt="autoT"><input type="checkbox" id="auto"> <span data-t="auto"></span></label>
  <label class="tog" id="custTog" hidden><input type="checkbox" id="showCust"> <span id="custTxt"></span></label>
  <span class="chip" id="upd"></span>
  <span id="langsw"></span>
</header>
<div class="wrap">
  <aside id="side"></aside>
  <div id="map"></div>
</div>
<div id="msg"></div>
<div id="dlg"><div class="bx" id="dlgBox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const COLORS=['#2563eb','#d97706','#9333ea','#059669','#db2777','#0891b2','#65a30d'];
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hm=v=>{const d=new Date(v);return isNaN(d)?'—':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  const $=s=>document.querySelector(s);
  const T={
    de:{title:'Fahrer-Disposition',autoT:'Schickt die erste Tour automatisch an jeden Fahrer, sobald es Zeit ist',auto:'Automatisch senden',
      noMap:'Karte nicht geladen (kein Internet?). Die Planung funktioniert auch ohne.',shop:'Laden',
      learned:'🧠 Gelernt aus {n} Fahrten · Faktor {f}×',learning:'🧠 Lernt noch (keine Lieferungen erfasst)',
      assumed:'Kein Fahrer ist gerade eingestempelt, deshalb plant das System mit allen Fahrern.',
      noDrivers:'Keine Fahrer im System. Lege sie auf der Team-Seite (team.html) mit der Rolle „Fahrer“ an.',
      out:'🛵 Unterwegs · zurück ca. {t}',sentWait:'📦 Tour geschickt, noch nicht losgefahren',freeNow:'✅ Jetzt frei',freeAt:'Frei ab {t}',
      onWay:'Unterwegs',sent:'Geschickt',leftOf:'{a} von {b} offen',cancelSend:'Senden abbrechen',next:'Nächste Tour',after:'Danach',
      depart:'Los {a} · zurück {b}',late:'{n} zu spät',sendTo:'📤 An {n} senden',route:'🗺️ Google Maps',noOrders:'Gerade keine Bestellungen für ihn',
      unplaced:'Bestellungen ohne Position auf der Karte',unplacedHint:'Adresse fehlt oder ist falsch, oder wird noch gesucht (dauert bis zu einer Minute). Adresse an der Kasse korrigieren.',
      noAddr:'Ohne Adresse',waiting:'Wartet auf einen Fahrer',waitingHint:'Diese Bestellungen haben eine Position, aber es gibt noch keinen Fahrer, dem das System sie geben kann.',noOpen:'Keine offenen Lieferungen.',sentToast:'📤 An {n} geschickt',updated:'Aktualisiert {t}',login:'Bitte zuerst anmelden',loadErr:'Plan konnte nicht geladen werden: ',cancelled:'Senden abgebrochen'},
    ar:{title:'التوزيع',autoT:'بيبعت أول جولة لكل سواق لحاله لما يجي وقتها',auto:'بعت أوتوماتيك',
      noMap:'الخريطة ما حمّلت (ما في إنترنت؟). الخطة شغّالة بدونها.',shop:'المحل',
      learned:'🧠 تعلّم من {n} مشوار · معامل {f}×',learning:'🧠 لسا عم يتعلّم (ما في توصيلات مسجّلة)',
      assumed:'ولا سواق مسجّل دوامه هلق، فالخطة معتبرة كل السواقين شغّالين.',
      noDrivers:'ما في سواقين بالنظام. ضيفهم من صفحة الفريق (team.html) بدور "سواق".',
      out:'🛵 طالع · بيرجع تقريباً {t}',sentWait:'📦 عنده جولة مبعوتة لسا ما طلع',freeNow:'✅ فاضي هلق',freeAt:'بيفضى الساعة {t}',
      onWay:'بالطريق',sent:'مبعوتة',leftOf:'{a} باقي من {b}',cancelSend:'لغي البعت',next:'الجولة الجاية',after:'بعدها',
      depart:'طلوع {a} · رجعة {b}',late:'{n} متأخر',sendTo:'📤 بعت لـ{n}',route:'🗺️ Google Maps',noOrders:'ما في طلبات إله هلق',
      unplaced:'طلبات بدون موقع على الخريطة',unplacedHint:'العنوان ناقص أو غلط، أو لسا عم يندوّر عليه (بياخد لحد دقيقة). صلّح العنوان بالكاشير.',
      noAddr:'بدون عنوان',waiting:'ناطرة سواق',waitingHint:'هالطلبات إلها موقع، بس ما في سواق لحتى البرنامج يعطيه ياها.',noOpen:'ما في طلبات توصيل مفتوحة.',sentToast:'📤 انبعتت لـ {n}',updated:'تحديث {t}',login:'سجّل دخول أول',loadErr:'ما قدرت حمّل الخطة: ',cancelled:'انلغى البعت'},
    en:{title:'Driver dispatch',autoT:'Sends the first tour to each driver automatically when it is time',auto:'Auto send',
      noMap:'Map did not load (no internet?). Planning still works without it.',shop:'Shop',
      learned:'🧠 Learned from {n} trips · factor {f}×',learning:'🧠 Still learning (no deliveries recorded)',
      assumed:'No driver is clocked in right now, so the plan assumes all drivers are working.',
      noDrivers:'No drivers in the system. Add them on the team page (team.html) with the role "Driver".',
      out:'🛵 Out · back around {t}',sentWait:'📦 Tour sent, not left yet',freeNow:'✅ Free now',freeAt:'Free at {t}',
      onWay:'On the way',sent:'Sent',leftOf:'{a} of {b} left',cancelSend:'Cancel sending',next:'Next tour',after:'After that',
      depart:'Leave {a} · back {b}',late:'{n} late',sendTo:'📤 Send to {n}',route:'🗺️ Google Maps',noOrders:'No orders for this driver right now',
      unplaced:'Orders without a map position',unplacedHint:'Address missing or wrong, or still being looked up (takes up to a minute). Fix the address at the till.',
      noAddr:'No address',waiting:'Waiting for a driver',waitingHint:'These orders have a position, but there is no driver yet for the system to give them to.',noOpen:'No open delivery orders.',sentToast:'📤 Sent to {n}',updated:'Updated {t}',login:'Please log in first',loadErr:'Could not load the plan: ',cancelled:'Sending cancelled'}
  };
  Object.assign(T.de,{focusBtn:'🎯 Auf Karte',showAll:'👁 Alle zeigen',finish:'Tour beenden',finished:'Tour beendet',others:'Weitere offene Touren',menu:'Optionen',moveTo:'Zu anderem Fahrer verschieben',swapWith:'Mit Bestellung tauschen',prefs:'Einstellungen für diese Bestellung',pin:'🔒 Nur dieser Fahrer',pinNone:'— egal —',avoid:'🚫 Nicht diesen Fahrern geben',hold:'⏸ Zurückhalten (noch nicht verplanen)',urgent:'⚡ Dringend (zuerst)',solo:'1️⃣ Allein fahren (nicht mit anderen)',clearPrefs:'Alles zurücksetzen',pause:'⏸ Pause',resume:'▶ Weiter',maxS:'Max. Stopps',maxAuto:'Auto',held:'Zurückgehaltene Bestellungen',release:'Freigeben',close:'Schließen',paused:'Fahrer in Pause',moved:'Verschoben',swapped:'Getauscht',saved:'Gespeichert',noSwap:'Keine Bestellung zum Tauschen (nur Touren, die noch nicht losgefahren sind).',planNote:'Noch nicht gesendet: „Verschieben“ merkt sich den Fahrer für die Planung.',noMove:'Kein anderer Fahrer verfügbar.',up:'Nach oben',down:'Nach unten'});Object.assign(T.ar,{focusBtn:'🎯 بيّنها عالخريطة',showAll:'👁 بيّن الكل',finish:'إنهاء الجولة',finished:'انتهت الجولة',others:'جولات مفتوحة تانية',menu:'خيارات',moveTo:'نقل لسائق تاني',swapWith:'تبديل مع طلب',prefs:'تفضيلات هالطلب',pin:'🔒 لهالسائق بس',pinNone:'— أي سائق —',avoid:'🚫 لا تعطيه لهدول السواقين',hold:'⏸ استنى (لا تخطّطه هلق)',urgent:'⚡ مستعجل (قدّمه)',solo:'1️⃣ لحاله (مو مع طلبات تانية)',clearPrefs:'رجّع كل شي للافتراضي',pause:'⏸ استراحة',resume:'▶ كمّل',maxS:'أقصى محطات',maxAuto:'أوتو',held:'طلبات موقوفة',release:'فكّ',close:'سكّر',paused:'سواقين بالاستراحة',moved:'اننقل',swapped:'انبدلوا',saved:'انحفظ',noSwap:'ما في طلب للتبديل (بس الجولات اللي لسا ما طلعت).',planNote:'لسا ما انبعت: "نقل" بيثبّت السائق بالخطة.',noMove:'ما في سائق تاني متاح.',up:'فوق',down:'تحت'});Object.assign(T.en,{focusBtn:'🎯 On map',showAll:'👁 Show all',finish:'End tour',finished:'Tour ended',others:'Other open tours',menu:'Options',moveTo:'Move to another driver',swapWith:'Swap with order',prefs:'Preferences for this order',pin:'🔒 Only this driver',pinNone:'— any —',avoid:'🚫 Never give to these drivers',hold:'⏸ Hold (do not plan yet)',urgent:'⚡ Urgent (first)',solo:'1️⃣ Ride alone (not with others)',clearPrefs:'Reset all',pause:'⏸ Break',resume:'▶ Resume',maxS:'Max stops',maxAuto:'Auto',held:'Held orders',release:'Release',close:'Close',paused:'Drivers on break',moved:'Moved',swapped:'Swapped',saved:'Saved',noSwap:'No order to swap with (only tours that have not left yet).',planNote:'Not sent yet: “Move” pins the driver for the plan.',noMove:'No other driver available.',up:'Up',down:'Down'});
  const lang=window.NARA_LANG?NARA_LANG.get():'de';
  const t=(k,v)=>String((T[lang]||T.de)[k]??T.de[k]??k).replace(/\{(\w+)\}/g,(m,x)=>v&&v[x]!=null?v[x]:m);
  const tr=t; // للأماكن اللي فيها متغير اسمه t (جولة)
  document.title='NARA · '+t('title');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tt]').forEach(e=>e.title=t(e.dataset.tt));
  if(window.NARA_LANG)NARA_LANG.mountSwitcher(document.getElementById('langsw'),{buttonStyle:'min-width:34px;height:30px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff1a;color:#fff;font-weight:800;cursor:pointer'});
  const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let plan=null,busy=false,colorOf={},map=null,layer=null,fitted=false,focus=null;
  $('#auto').checked=store.get('nara-dispatch-auto','0')==='1';
  $('#auto').onchange=()=>store.set('nara-dispatch-auto',$('#auto').checked?'1':'0');

  function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',3500)}
  function color(id){if(!colorOf[id])colorOf[id]=COLORS[Object.keys(colorOf).length%COLORS.length];return colorOf[id]}

  const CT={ar:'🧑‍🤝‍🧑 الزباين على الخريطة',de:'🧑‍🤝‍🧑 Kunden auf Karte',en:'🧑‍🤝‍🧑 Show customers'},CSEG={REGULAR:'#16a34a',RETURNING:'#d97706',NEW:'#0891b2',SLEEPING:'#9ca3af',CANCELLED_ONLY:'#dc2626'};
  let custLayer=null,custDb=null;
  async function showCustomers(on){
    if(!map)return;
    if(!on){if(custLayer){map.removeLayer(custLayer);custLayer=null}return}
    if(!custDb){try{const r=await fetch('/api/customer-db',{credentials:'same-origin',cache:'no-store'});if(!r.ok){$('#custTog').hidden=true;return}custDb=(await r.json()).customers||[]}catch(e){return}}
    custLayer=L.layerGroup().addTo(map);
    for(const c of custDb)if(Number.isFinite(c.lat)&&Number.isFinite(c.lng)){const r=Math.min(18,8+(c.orders||1)*2);L.marker([c.lat,c.lng],{zIndexOffset:-500,icon:L.divIcon({className:'',html:'<div style="width:'+r+'px;height:'+r+'px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #0008;background:'+(CSEG[c.segment]||'#999')+'"></div>',iconSize:[r,r],iconAnchor:[r/2,r/2]})}).addTo(custLayer).bindTooltip(esc(c.name)+' · '+(c.orders||0)+'× · '+esc([c.street,c.house].filter(Boolean).join(' ')))}
  }
  $('#custTxt').textContent=CT[lang]||CT.de;
  $('#custTog').hidden=false;
  $('#showCust').checked=store.get('nara-dispatch-cust','0')==='1';
  $('#showCust').onchange=()=>{store.set('nara-dispatch-cust',$('#showCust').checked?'1':'0');showCustomers($('#showCust').checked)};
  function initMap(){
    if(!window.L){$('#map').innerHTML='<div class="box warn" style="margin:12px">'+esc(t('noMap'))+'</div>';return}
    map=L.map('map',{zoomControl:true}).setView([51.2556,6.3936],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    map.on('zoomend',()=>drawMap());
    if($('#showCust').checked)showCustomers(true);
  }
  const pin=(n,c,sm)=>{const z=sm?18:26;return L.divIcon({className:'',html:'<div class="pin'+(sm?' sm':'')+'" style="background:'+c+'">'+esc(n)+'</div>',iconSize:[z,z],iconAnchor:[z/2,z/2]})};

  // أسهم اتجاه موزّعة على طول الخط (كل ~90 بكسل)
  function arrows(path,c){
    const z=map.getZoom();let acc=60;
    for(let i=0;i<path.length-1;i++){
      const a=path[i],b=path[i+1],pa=map.project(a,z),pb=map.project(b,z),d=Math.hypot(pb.x-pa.x,pb.y-pa.y);
      acc+=d;if(acc<90||d<6)continue;acc=0;
      const ang=Math.atan2(pb.y-pa.y,pb.x-pa.x)*180/Math.PI;
      L.marker([(a[0]+b[0])/2,(a[1]+b[1])/2],{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<div class="arw" style="color:'+c+';transform:rotate('+ang+'deg)">➤</div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(layer);
    }
  }
  // مسار الشوارع من OSRM (مجاني). بنحفظه بالذاكرة؛ إذا فشل بنضل على الخط المستقيم.
  const roadCache=new Map(),RETRY_MS=300000;
  let redrawT=null;
  function roadFor(line){
    const key=line.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(';'),e=roadCache.get(key);
    if(e&&e.path)return e.path;
    if(e&&(e.pending||Date.now()-e.at<RETRY_MS))return null;
    if(roadCache.size>60)roadCache.delete(roadCache.keys().next().value);
    const ent={pending:true,at:Date.now()};roadCache.set(key,ent);
    const ac=window.AbortController?new AbortController():null,to=setTimeout(()=>ac&&ac.abort(),8000);
    fetch('https://router.project-osrm.org/route/v1/driving/'+line.map(p=>p[1]+','+p[0]).join(';')+'?overview=full&geometries=geojson',{signal:ac?ac.signal:undefined})
      .then(r=>r.ok?r.json():Promise.reject(new Error(r.status)))
      .then(j=>{const g=j&&j.routes&&j.routes[0]&&j.routes[0].geometry&&j.routes[0].geometry.coordinates;if(!g||g.length<2)throw Error('empty');ent.path=g.map(c=>[c[1],c[0]])})
      .catch(()=>{})
      .finally(()=>{clearTimeout(to);ent.pending=false;ent.at=Date.now();if(ent.path){clearTimeout(redrawT);redrawT=setTimeout(()=>drawMap(),150)}});
    return null;
  }
  const keysNow=()=>{const k=new Set();for(const r of plan.active||[])k.add('a:'+r.routeId);for(const d of plan.drivers||[])d.tours.forEach((_,i)=>k.add('p:'+d.driverId+':'+i));return k};

  function drawMap(refit){
    if(!map||!plan)return;layer.clearLayers();
    const shop=[plan.shop.lat,plan.shop.lng],pts=[shop],tp={};
    L.marker(shop,{icon:L.divIcon({className:'',html:'<div class="pin" style="background:#101820">🏠</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(layer).bindTooltip(esc(t('shop')));
    // جولة وحدة بتنرسم بوضوح: المختارة (focus) أو، إذا ما في اختيار، الجولة الأساسية لكل سواق. الباقي باهت أو مخفي.
    function drawTour(key,c,stops,o){
      const on=focus?focus===key:o.primary;
      if(focus&&!on)return;
      const line=[shop];
      stops.forEach((s,i)=>{const pt=[s.lat,s.lng];line.push(pt);pts.push(pt);L.marker(pt,{icon:pin(s.delivered?'✓':i+1,c,!on),opacity:s.delivered?.5:(on?1:.4)}).addTo(layer).bindTooltip(o.tip(s))});
      if(o.back)line.push(shop);
      const road=on&&line.length>1?roadFor(line):null,path=road||line;
      L.polyline(path,{color:c,weight:on?5:2,opacity:on?.95:.35,dashArray:(!road&&(o.back||!on))||(!on)?'6 8':null}).addTo(layer);
      if(on)arrows(path,c);
      tp[key]=line;
    }
    const hasAct=new Set((plan.active||[]).map(r=>r.driverId));
    for(const r of plan.active||[])drawTour('a:'+r.routeId,color(r.driverId),r.stops.filter(s=>Number.isFinite(s.lat)),{primary:true,tip:s=>esc(s.code)+' · '+esc(s.address)});
    for(const d of plan.drivers||[])d.tours.forEach((tt,i)=>drawTour('p:'+d.driverId+':'+i,color(d.driverId),tt.stops.filter(s=>Number.isFinite(s.lat)),{primary:i===0&&!hasAct.has(d.driverId),back:true,tip:s=>esc(s.code)+' · '+esc(d.name)+' · '+hm(s.etaAt)}));
    for(const u of plan.unplaced||[])if(Number.isFinite(u.lat)){L.marker([u.lat,u.lng],{icon:pin('•','#8a8f98'),opacity:.9}).addTo(layer).bindTooltip(esc(u.code||'')+' · '+esc(u.address||''));pts.push([u.lat,u.lng])}
    for(const p of plan.positions||[])if(Number.isFinite(p.lat)){const age=Math.max(0,Math.round((Date.now()-Date.parse(p.at))/60000)),old=age>=3;L.marker([p.lat,p.lng],{opacity:old?.45:1,icon:L.divIcon({className:'',html:'<div class="car">🛵'+(old?'<sup>?</sup>':'')+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(layer).bindTooltip(esc(p.name||'')+' · '+hm(p.at)+(old?' · '+age+' min':''),{permanent:true,direction:'top'});pts.push([p.lat,p.lng])}
    if(refit&&focus&&tp[focus]&&tp[focus].length>1)map.fitBounds(tp[focus],{padding:[50,50]});
    else if((!fitted||refit)&&pts.length>1){map.fitBounds(pts,{padding:[30,30]});fitted=true}
  }

  const pf=id=>((plan&&plan.prefs&&plan.prefs.orders)||{})[String(id)]||{};
  const badges=id=>{const p=pf(id);return '<span class="bd">'+(p.pin?'🔒':'')+(p.urgent?'⚡':'')+(p.solo?'1️⃣':'')+((p.avoid||[]).length?'🚫':'')+'</span>'};
  const menuBtn=(id,sent)=>'<button class="mini" title="'+esc(t('menu'))+'" data-menu="'+esc(id)+'" data-sent="'+(sent?1:0)+'">⋯</button>';

  function render(){
    const side=$('#side');if(!plan){side.innerHTML='<div class="box">…</div>';return}
    const L_=plan.learning||{};$('#learn').textContent=L_.samples?t('learned',{n:L_.samples,f:(L_.global||1).toFixed(2)}):t('learning');
    let h='';
    if(plan.assumedDrivers)h+='<div class="box warn">'+esc(t('assumed'))+'</div>';
    if(!plan.ok&&plan.reason==='NO_DRIVERS')h+='<div class="box warn">'+esc(t('noDrivers'))+'</div>';
    const fb=key=>'<button class="btn sec" data-focus="'+esc(key)+'">'+(focus===key?t('showAll'):t('focusBtn'))+'</button>';
    const byDriver={};for(const r of plan.active||[])(byDriver[r.driverId]??=[]).push(r);
    for(const d of plan.drivers||[]){
      const c=color(d.driverId),act=byDriver[d.driverId]||[],out=act.some(r=>r.startedAt);
      const st=out?t('out',{t:hm(d.freeAt)}):act.length?t('sentWait'):(Date.parse(d.freeAt)<=Date.now()+60000?t('freeNow'):t('freeAt',{t:hm(d.freeAt)}));
      const dp=((plan.prefs||{}).drivers||{})[d.driverId]||{};
      h+='<section class="drv" style="--c:'+c+'"><h2>'+esc(d.name||d.driverId)+'</h2><div class="st">'+st+'</div><div class="dh"><button class="mini" data-pause="'+esc(d.driverId)+'">'+t('pause')+'</button><span class="muted">'+t('maxS')+'</span><select data-maxs="'+esc(d.driverId)+'"><option value="0">'+t('maxAuto')+'</option>'+[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'"'+(dp.maxStops===n?' selected':'')+'>'+n+'</option>').join('')+'</select></div>';
      for(const r of act){
        const left=r.stops.filter(s=>!s.delivered).length;
        h+='<div class="tour'+(focus==='a:'+r.routeId?' focus':'')+'"><div class="hd">'+(r.startedAt?t('onWay'):t('sent'))+' <span class="t">'+t('leftOf',{a:left,b:r.stops.length})+'</span></div>'
          +r.stops.map((s,i)=>'<div class="stop'+(s.delivered?' done':'')+'"><span class="n">'+(i+1)+'</span><span class="c">'+esc(s.code)+badges(s.orderId)+'</span><span class="a">'+esc(s.address)+'</span>'+(r.startedAt||r.canEdit===false||s.delivered?'':'<button class="mini" title="'+esc(t('up'))+'" data-up="'+esc(r.routeId)+'" data-i="'+i+'"'+(i?'':' disabled')+'>⬆️</button><button class="mini" title="'+esc(t('down'))+'" data-down="'+esc(r.routeId)+'" data-i="'+i+'"'+(i<r.stops.length-1?'':' disabled')+'>⬇️</button>'+menuBtn(s.orderId,true))+'</div>').join('')
          +(r.startedAt?'<div class="btns">'+fb('a:'+r.routeId)+'<button class="btn sec" data-finish="'+esc(r.routeId)+'">'+t('finish')+'</button></div>':'<div class="btns">'+fb('a:'+r.routeId)+'<button class="btn red" data-cancel="'+esc(r.routeId)+'">'+t('cancelSend')+'</button></div>')+'</div>';
      }
      d.tours.forEach((t,i)=>{
        const late=t.stops.map(s=>plan.assignments.find(a=>a.orderId===s.orderId)).filter(a=>a&&a.lateMin);
        const key='p:'+d.driverId+':'+i;
        h+='<div class="tour'+(focus===key?' focus':'')+'"><div class="hd">'+(i===0&&!act.length?tr('next'):tr('after'))+' <span class="t">'+tr('depart',{a:hm(t.departAt),b:hm(t.backAt)})+'</span>'+(late.length?'<span class="late-b">'+tr('late',{n:late.length})+'</span>':'')+'</div>'
          +t.stops.map((s,k)=>{const a=plan.assignments.find(x=>x.orderId===s.orderId)||{};return '<div class="stop'+(a.lateMin?' late':'')+'"><span class="n">'+(k+1)+'</span><span class="c">'+esc(s.code)+badges(s.orderId)+'</span><span class="a">'+esc(s.address||s.name||'')+'</span><span class="e">'+hm(s.etaAt)+(a.lateMin?' (+'+a.lateMin+')':'')+'</span>'+menuBtn(s.orderId,false)+'</div>'}).join('')
          +'<div class="btns">'+(i===0?'<button class="btn" data-send="'+esc(d.driverId)+'" data-tour="0">'+tr('sendTo',{n:esc(d.name||'')})+'</button>':'')+fb(key)+(i===0&&t.googleMapsUrl?'<a class="btn sec" target="_blank" rel="noopener" href="'+esc(t.googleMapsUrl)+'">'+tr('route')+'</a>':'')+'</div></div>';
      });
      if(!d.tours.length&&!act.length)h+='<div class="tour muted">'+t('noOrders')+'</div>';
      h+='</section>';
    }
    const noLoc=(plan.unplaced||[]).filter(u=>u.reason!=='NO_DRIVERS'||!Number.isFinite(u.lat)),waiting=(plan.unplaced||[]).filter(u=>u.reason==='NO_DRIVERS'&&Number.isFinite(u.lat));
    if(waiting.length)h+='<div class="box warn"><h3>'+t('waiting')+' ('+waiting.length+')</h3><div class="muted">'+t('waitingHint')+'</div>'+waiting.map(u=>'<div>• <b>'+esc(u.code||u.id)+'</b> '+esc(u.address||'')+'</div>').join('')+'</div>';
    if(noLoc.length)h+='<div class="box warn"><h3>'+t('unplaced')+'</h3><div class="muted">'+t('unplacedHint')+'</div>'+noLoc.map(u=>'<div>• <b>'+esc(u.code||u.id)+'</b> '+esc(u.address||t('noAddr'))+'</div>').join('')+'</div>';
    if(!(plan.drivers||[]).some(d=>d.tours.length)&&!(plan.active||[]).length&&!(plan.unplaced||[]).length)h+='<div class="box muted">'+t('noOpen')+'</div>';
    const listed=new Set((plan.drivers||[]).map(d=>d.driverId)),stray=(plan.active||[]).filter(r=>!listed.has(r.driverId));
    if(stray.length)h+='<div class="box warn"><h3>'+t('others')+'</h3>'+stray.map(r=>'<div class="stop"><span class="c" style="color:'+color(r.driverId)+'">'+esc(r.driverName||r.driverId)+'</span><span class="a">'+r.stops.map(x=>esc(x.code)).join(', ')+'</span><button class="mini" data-finish="'+esc(r.routeId)+'">'+t('finish')+'</button></div>').join('')+'</div>';
    if((plan.pausedDrivers||[]).length)h+='<div class="box"><h3>'+t('paused')+'</h3>'+plan.pausedDrivers.map(d=>'<div>'+esc(d.name)+' <button class="mini" data-resume="'+esc(d.id)+'">'+t('resume')+'</button></div>').join('')+'</div>';
    if((plan.held||[]).length)h+='<div class="box warn"><h3>⏸ '+t('held')+' ('+plan.held.length+')</h3>'+plan.held.map(o=>'<div class="stop"><span class="c">'+esc(o.code)+'</span><span class="a">'+esc(o.address||o.name||'')+'</span><button class="mini" data-release="'+esc(o.orderId)+'">'+t('release')+'</button>'+menuBtn(o.orderId,false)+'</div>').join('')+'</div>';
    side.innerHTML=h;
  }


  // ===== قائمة خيارات الطلب =====
  function findStop(id){
    for(const r of plan.active||[]){const s=r.stops.find(x=>String(x.orderId)===String(id));if(s)return{s,r,sent:true}}
    for(const d of plan.drivers||[])for(const tt of d.tours){const s=tt.stops.find(x=>String(x.orderId)===String(id));if(s)return{s,d,sent:false}}
    const h=(plan.held||[]).find(x=>String(x.orderId)===String(id));return h?{s:h,sent:false}:null;
  }
  function openMenu(id){
    const f=findStop(id);if(!f)return closeDlg();
    const p=pf(id),drivers=(plan.allDrivers||[]).filter(d=>!d.paused),code=f.s.code||id,curDriver=f.sent?f.r.driverId:null;
    let h='<h3>'+esc(code)+' · '+t('menu')+'</h3><div class="muted">'+esc(f.s.address||'')+'</div>';
    if(!f.sent)h+='<div class="muted">'+t('planNote')+'</div>';
    const others=drivers.filter(d=>d.id!==curDriver);
    h+='<h4>'+t('moveTo')+'</h4><div class="row">'+(others.length?others.map(d=>'<button class="btn" data-mv="'+esc(d.id)+'" style="background:'+color(d.id)+'">'+esc(d.name)+'</button>').join(''):'<span class="muted">'+t('noMove')+'</span>')+'</div>';
    if(f.sent){
      const cand=[];for(const r of plan.active||[])if(!r.startedAt&&r.canEdit!==false&&r.routeId!==f.r.routeId)for(const s of r.stops)if(!s.delivered)cand.push({s,r});
      h+='<h4>'+t('swapWith')+'</h4>'+(cand.length?'<div class="row">'+cand.map(x=>'<button class="btn sec" data-sw="'+esc(x.s.orderId)+'">⇄ '+esc(x.s.code)+' · '+esc(x.r.driverName)+'</button>').join('')+'</div>':'<div class="muted">'+t('noSwap')+'</div>');
    }else{
      h+='<h4>'+t('prefs')+'</h4><div>'+t('pin')+'<select data-pin><option value="">'+t('pinNone')+'</option>'+drivers.map(d=>'<option value="'+esc(d.id)+'"'+(p.pin===d.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></div>'
        +'<div style="margin-top:6px">'+t('avoid')+'</div>'+(plan.allDrivers||[]).map(d=>'<label><input type="checkbox" data-av="'+esc(d.id)+'"'+((p.avoid||[]).includes(d.id)?' checked':'')+'> '+esc(d.name)+'</label>').join('')
        +'<label><input type="checkbox" data-flag="hold"'+(p.hold?' checked':'')+'> '+t('hold')+'</label><label><input type="checkbox" data-flag="urgent"'+(p.urgent?' checked':'')+'> '+t('urgent')+'</label><label><input type="checkbox" data-flag="solo"'+(p.solo?' checked':'')+'> '+t('solo')+'</label>'
        +'<div class="btns"><button class="btn red" data-clear="1">'+t('clearPrefs')+'</button></div>';
    }
    h+='<div class="btns"><button class="btn sec" data-close="1">'+t('close')+'</button></div>';
    $('#dlgBox').innerHTML=h;$('#dlg').dataset.id=id;$('#dlg').dataset.sent=f.sent?1:0;$('#dlg').classList.add('on');
  }
  function closeDlg(){$('#dlg').classList.remove('on');delete $('#dlg').dataset.id}
  async function act(fn,msg,keep){
    try{await fn();if(msg)toast(msg)}catch(err){toast(err.message)}
    const id=$('#dlg').dataset.id;await load();if(keep&&id&&$('#dlg').classList.contains('on'))openMenu(id);else closeDlg();
  }
  $('#dlg').addEventListener('click',e=>{
    const id=$('#dlg').dataset.id,sent=$('#dlg').dataset.sent==='1',tg=e.target;
    if(tg.id==='dlg'||tg.closest('[data-close]'))return closeDlg();
    const mv=tg.closest('[data-mv]'),sw=tg.closest('[data-sw]'),cl=tg.closest('[data-clear]');
    if(mv)return act(()=>sent?api('POST','/api/delivery/move',{orderId:id,toDriverId:mv.dataset.mv}):api('POST','/api/delivery/order-pref',{orderId:id,pin:mv.dataset.mv}),t('moved'));
    if(sw)return act(()=>api('POST','/api/delivery/swap',{orderA:id,orderB:sw.dataset.sw}),t('swapped'));
    if(cl)return act(()=>api('POST','/api/delivery/order-pref',{orderId:id,clear:true}),t('saved'));
  });
  $('#dlg').addEventListener('change',e=>{
    const id=$('#dlg').dataset.id,tg=e.target;
    if(tg.matches('[data-pin]'))return act(()=>api('POST','/api/delivery/order-pref',{orderId:id,pin:tg.value}),t('saved'),true);
    if(tg.matches('[data-av]')){const av=[...document.querySelectorAll('#dlg [data-av]')].filter(x=>x.checked).map(x=>x.dataset.av);return act(()=>api('POST','/api/delivery/order-pref',{orderId:id,avoid:av}),t('saved'),true)}
    if(tg.matches('[data-flag]'))return act(()=>api('POST','/api/delivery/order-pref',{orderId:id,[tg.dataset.flag]:tg.checked}),t('saved'),tg.dataset.flag!=='hold');
  });
  async function api(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}
  async function send(driverId){
    const d=plan.drivers.find(x=>x.driverId===driverId);if(!d||!d.tours[0])return;
    const t=d.tours[0],etas={};t.stops.forEach(s=>etas[s.orderId]=s.etaAt);
    await api('POST','/api/delivery/assign',{driverId,orderIds:t.stops.map(s=>s.orderId),etas});
    toast(tr('sentToast',{n:d.name||''}));
  }
  async function load(){
    if(busy)return;busy=true;
    try{
      plan=await api('GET','/api/delivery/auto-plan');
      if($('#auto').checked){
        // إرسال تلقائي: الجولة الأولى لسائق ما عنده جولة مرسلة ووقت طلوعها إجا
        const sent=new Set((plan.active||[]).map(r=>r.driverId));let any=false;
        for(const d of plan.drivers||[])if(d.tours[0]&&!sent.has(d.driverId)&&Date.parse(d.tours[0].departAt)<=Date.now()+60000){try{await send(d.driverId);any=true}catch(e){toast(e.message)}}
        if(any)plan=await api('GET','/api/delivery/auto-plan');
      }
      if(focus&&!keysNow().has(focus))focus=null;
      render();drawMap();$('#upd').textContent=t('updated',{t:hm(Date.now())});
    }catch(e){$('#side').innerHTML='<div class="box warn">'+esc(e.message==='401'?t('login'):t('loadErr')+e.message)+'</div>'}
    finally{busy=false}
  }
  $('#side').addEventListener('click',async e=>{
    const fo=e.target.closest('[data-focus]');if(fo){focus=focus===fo.dataset.focus?null:fo.dataset.focus;render();drawMap(true);return}
    const m=e.target.closest('[data-menu]');if(m)return openMenu(m.dataset.menu);
    const up=e.target.closest('[data-up]'),dn=e.target.closest('[data-down]'),ps=e.target.closest('[data-pause]'),rs=e.target.closest('[data-resume]'),rl=e.target.closest('[data-release]');
    if(up||dn){const b=up||dn,r=(plan.active||[]).find(x=>x.routeId===(up?b.dataset.up:b.dataset.down));if(!r)return;const i=Number(b.dataset.i),j=up?i-1:i+1,ids=r.stops.map(x=>x.orderId);[ids[i],ids[j]]=[ids[j],ids[i]];b.disabled=true;try{await api('POST','/api/delivery/reorder',{routeId:r.routeId,orderIds:ids})}catch(err){toast(err.message)}return load()}
    if(ps){ps.disabled=true;try{await api('POST','/api/delivery/driver-pref',{driverId:ps.dataset.pause,paused:true})}catch(err){toast(err.message)}return load()}
    if(rs){rs.disabled=true;try{await api('POST','/api/delivery/driver-pref',{driverId:rs.dataset.resume,paused:false})}catch(err){toast(err.message)}return load()}
    if(rl){rl.disabled=true;try{await api('POST','/api/delivery/order-pref',{orderId:rl.dataset.release,hold:false})}catch(err){toast(err.message)}return load()}
    const fn=e.target.closest('[data-finish]');
    if(fn){fn.disabled=true;try{await api('POST','/api/driver/finish',{routeId:fn.dataset.finish});toast(t('finished'))}catch(err){toast(err.message)}return load()}
    const s=e.target.closest('[data-send]'),c=e.target.closest('[data-cancel]');if(!s&&!c)return;
    const b=s||c;b.disabled=true;
    try{if(s)await send(s.dataset.send);else{await api('POST','/api/delivery/cancel',{routeId:c.dataset.cancel});toast(t('cancelled'))}}catch(err){toast(err.message)}
    await load();
  });
  $('#side').addEventListener('change',async e=>{const m=e.target.closest('[data-maxs]');if(!m)return;try{await api('POST','/api/delivery/driver-pref',{driverId:m.dataset.maxs,maxStops:Number(m.value)||null});toast(t('saved'))}catch(err){toast(err.message)}load()});
  initMap();load();setInterval(load,10000);
})();
</script>
</body>
</html>
