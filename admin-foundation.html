<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARA · Menüverwaltung</title><link rel="stylesheet" href="admin-foundation.css"><link rel="stylesheet" href="nara-shell.css"></head><body><header><a href="kasse.html">← Zurück zur Kasse</a> <a href="web-prototype/index.html" style="margin-inline-start:14px;font-weight:800;color:#e85f12;text-decoration:none">🔥 Website-Designs</a><h1>NARA · Menüverwaltung</h1><span>JSON persistence · MVP</span></header><main><p id="status" role="status"></p><section class="layout"><aside class="categories-panel"><div class="section-title"><h2>Kategorien</h2><button id="new-category">+ Neue Kategorie</button></div><div id="categories"></div></aside><section class="products-panel"><div class="section-title"><div><h2 id="products-title">Produkte</h2><p id="products-count"></p></div><div class="actions"><input id="product-search" type="search" placeholder="Produkte suchen …"><button id="new-product">+ Neues Produkt</button></div></div><div id="products"></div></section></section></main><dialog id="category-dialog"><form method="dialog" id="category-form"><h2>Neue Kategorie</h2><label>Name<input name="name" required></label><label>Sortierung<input name="sortOrder" type="number" min="0" required></label><label class="check"><input name="active" type="checkbox" checked> Aktiv</label><label class="check"><input name="favorite" type="checkbox"> Schnellzugriff / Favorit</label><div class="dialog-actions"><button type="button" data-close>Abbrechen</button><button>Speichern</button></div></form></dialog><dialog id="product-dialog"><form method="dialog" id="product-form"><h2>Produkt bearbeiten</h2><input name="id" type="hidden"><label>Name<input name="name" required></label><label>Kategorie<select name="categoryId" required></select></label><label>Verkaufspreis (€)<input name="price" inputmode="decimal" placeholder="8,49" required></label><label>Beschreibung<textarea name="description" rows="3"></textarea></label><label>Bild-Referenz<input name="imageRef" placeholder="assets/burger.png"></label><img id="image-preview" alt="Bildvorschau" hidden><label class="check"><input name="active" type="checkbox" checked> Aktiv</label><label class="check"><input name="available" type="checkbox" checked> Verfügbar</label><label>Sortierung<input name="sortOrder" type="number" min="0" required></label><p id="modifier-summary" class="muted"></p><p id="form-error" class="error"></p><div class="dialog-actions"><button type="button" data-close>Abbrechen</button><button>Speichern</button></div></form></dialog><script src="nara-shell.js"></script><script src="admin-foundation.js"></script></body></html>
