<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NARA · Umsatzbericht</title>
<script src="nara-lang.js?v=20261009b" data-section="app"></script>
<style>
  :root{--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--acc:#ea580c}
  *{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#faf9f7}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:1.5rem}h2{margin:22px 0 8px;font-size:1.05rem;border-bottom:2px solid var(--line);padding-bottom:4px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0}.bar label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut)}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc)}button.g{background:#fff;color:var(--ink);border-color:var(--line)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:1.3rem}.kpi span{color:var(--mut);font-size:.8rem}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{padding:6px 10px;text-align:start;border-bottom:1px solid var(--line)}th{background:#f5f4f2;font-size:.8rem}td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
  .note{color:var(--mut);font-size:.82rem;margin-top:6px}.warn{color:#b45309;font-weight:600}
  @media print{body{background:#fff}.bar,#lang-switch{display:none}.wrap{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div id="lang-switch" style="float:right"></div>
  <h1 id="t-title"></h1><div class="note" id="t-sub"></div>
  <div class="bar"><label><span id="t-from"></span><input type="date" id="from"></label><label><span id="t-to"></span><input type="date" id="to"></label><button id="go"></button><button class="g" id="print"></button><button class="g" id="csv1"></button><button class="g" id="csv2"></button></div>
  <div id="out"></div>
</div>
<script>
(function(){
  var L=(window.NARA_LANG&&NARA_LANG.get())||'de';
  var T={
    de:{title:'Umsatzbericht',sub:'Alle Verkäufe: eigene (Kasse/Website, mit TSE) und Plattformen (ohne TSE). Zur Vorlage beim Steuerberater, kein Ersatz für Plattform-Abrechnungen.',from:'Von',to:'Bis',go:'Anzeigen',print:'Drucken / PDF',csv1:'CSV Eigene Verkäufe',csv2:'CSV Plattformen',total:'Gesamtumsatz',orders:'Bestellungen',avg:'Ø Bestellung',own:'Eigene Verkäufe',plat:'Plattformen',canc:'Storniert',tseMiss:'Ohne TSE-Transaktion',sumH:'Übersicht',payH:'Zahlungsarten',cash:'Bar (Kasse)',card:'Karte (Kasse)',online:'Online bezahlt (Plattform)',pcash:'Bar bei Lieferung (Plattform)',platH:'Nach Plattform',brandH:'Nach Marke',dayH:'Nach Geschäftstag',itemsH:'Meistverkaufte Artikel',day:'Tag',cnt:'Anz.',gross:'Brutto',item:'Artikel',qty:'Menge',name:'Name',err:'Fehler: ',nov:'Hinweis: USt wird erst mit der TSE-Anbindung je Artikel ausgewiesen.'},
    ar:{title:'تقرير المبيعات الشامل',sub:'كل المبيعات: المحلية (كاشير/موقع، مع TSE) والمنصات (بدون TSE). للمحاسب، وما بيغني عن كشوفات المنصات.',from:'من',to:'إلى',go:'اعرض',print:'طباعة / PDF',csv1:'CSV المبيعات المحلية',csv2:'CSV المنصات',total:'إجمالي المبيعات',orders:'الطلبات',avg:'متوسط الطلب',own:'المبيعات المحلية',plat:'المنصات',canc:'الملغي',tseMiss:'بدون معاملة TSE',sumH:'الملخص',payH:'طرق الدفع',cash:'كاش (كاشير)',card:'كرت (كاشير)',online:'مدفوع أونلاين (منصات)',pcash:'كاش عند التوصيل (منصات)',platH:'حسب المنصة',brandH:'حسب البراند',dayH:'حسب يوم العمل',itemsH:'الأصناف الأكثر مبيعاً',day:'اليوم',cnt:'العدد',gross:'الإجمالي',item:'الصنف',qty:'الكمية',name:'الاسم',err:'خطأ: ',nov:'ملاحظة: الضريبة (USt) بتنعرض لكل صنف بعد ربط الـTSE.'},
    en:{title:'Sales report',sub:'All sales: own (till/website, with TSE) and platforms (no TSE). For your accountant; does not replace platform statements.',from:'From',to:'To',go:'Show',print:'Print / PDF',csv1:'CSV own sales',csv2:'CSV platforms',total:'Total sales',orders:'Orders',avg:'Avg order',own:'Own sales',plat:'Platforms',canc:'Cancelled',tseMiss:'Without TSE transaction',sumH:'Summary',payH:'Payment methods',cash:'Cash (till)',card:'Card (till)',online:'Paid online (platform)',pcash:'Cash on delivery (platform)',platH:'By platform',brandH:'By brand',dayH:'By business day',itemsH:'Top items',day:'Day',cnt:'Count',gross:'Gross',item:'Item',qty:'Qty',name:'Name',err:'Error: ',nov:'Note: VAT per item will be shown once the TSE is connected.'}
  }[L]||{};
  var $=function(i){return document.getElementById(i)},esc=function(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var eur=function(c){return (Number(c||0)/100).toLocaleString(L==='ar'?'de-DE':L==='en'?'en-GB':'de-DE',{style:'currency',currency:'EUR'})};
  var PL={LIEFERANDO:'Lieferando',UBER_EATS:'Uber Eats',WOLT:'Wolt',LANCH:'Lanch'};
  $('t-title').textContent=T.title;$('t-sub').textContent=T.sub;$('t-from').textContent=T.from;$('t-to').textContent=T.to;$('go').textContent=T.go;$('print').textContent=T.print;$('csv1').textContent=T.csv1;$('csv2').textContent=T.csv2;
  if(L==='ar')document.documentElement.dir='rtl';document.documentElement.lang=L;
  if(window.NARA_LANG)NARA_LANG.mountSwitcher($('lang-switch'));
  var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var now=new Date();$('from').value=iso(new Date(now.getFullYear(),now.getMonth(),1));$('to').value=iso(now);
  var last=null;
  function tbl(head,rows){return '<table><thead><tr>'+head.map(function(h,i){return '<th'+(i?' class="n"':'')+'>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i?' class="n"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
  function draw(j){var s=j.summary,t=s.totals,p=s.payment;
    var h='<h2>'+esc(T.sumH)+'</h2><div class="kpis">'
      +[[T.total,eur(t.grossCents)],[T.orders,t.orders],[T.avg,eur(t.avgCents)],[T.own,eur(t.ownCents)],[T.plat,eur(t.platformCents)],[T.canc,t.cancelled]].map(function(k){return '<div class="kpi"><b>'+k[1]+'</b><span>'+esc(k[0])+'</span></div>'}).join('')+'</div>'
      +(t.ownTseMissing?'<p class="warn">⚠ '+esc(T.tseMiss)+': '+t.ownTseMissing+'</p>':'')
      +'<h2>'+esc(T.payH)+'</h2>'+tbl([T.name,T.gross],[[esc(T.cash),eur(p.ownCashCents)],[esc(T.card),eur(p.ownCardCents)],[esc(T.online),eur(p.platformOnlineCents)],[esc(T.pcash),eur(p.platformCashCents)]])
      +'<h2>'+esc(T.platH)+'</h2>'+tbl([T.name,T.gross],Object.keys(s.byPlatform).map(function(k){return [esc(PL[k]||k),eur(s.byPlatform[k])]}))
      +'<h2>'+esc(T.brandH)+'</h2>'+tbl([T.name,T.gross],Object.keys(s.byBrand).map(function(k){return [esc(k),eur(s.byBrand[k])]}))
      +'<h2>'+esc(T.dayH)+'</h2>'+tbl([T.day,T.cnt,T.own,T.plat,T.gross],s.byDay.map(function(d){return [esc(d.day),d.count,eur(d.ownCents),eur(d.platformCents),'<b>'+eur(d.totalCents)+'</b>']}))
      +'<h2>'+esc(T.itemsH)+'</h2>'+tbl([T.item,T.qty,T.gross],s.topItems.map(function(i){return [esc(i.name),i.qty,eur(i.cents)]}))
      +'<p class="note">'+esc(T.nov)+'</p>';
    $('out').innerHTML=h}
  function load(){var q=new URLSearchParams({from:$('from').value,to:$('to').value});fetch('/api/reports/sales-ledger?'+q,{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.error||r.status);return j})}).then(function(j){last=j;draw(j)}).catch(function(e){$('out').innerHTML='<p class="warn">'+esc(T.err+e.message)+'</p>'})}
  function dl(k,name){if(!last)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([last.csv[k]],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+last.from+'-'+last.to+'.csv';a.click()}
  $('go').onclick=load;$('print').onclick=function(){window.print()};$('csv1').onclick=function(){dl('own','eigene-verkaeufe')};$('csv2').onclick=function(){dl('platform','plattform-verkaeufe')};
  load();
})();
</script>
</body>
</html>
